name: deploy-workgraph-service

on:
  pull_request:
    paths:
      - packages/claxedo-workgraph-service/**
      - packages/claxedo-service-contract/**
      - .github/actions/setup-bun/action.yml
      - .github/workflows/deploy-workgraph-service.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for an explicit dark service deploy
        required: true
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-workgraph-service-${{ inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Verify independent WorkGraph package
        working-directory: packages/claxedo-workgraph-service
        run: |
          bun run typecheck
          bun run test

  deploy-dark:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: packages/claxedo-workgraph-service
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLAXEDO_WORKGRAPH_ENVIRONMENT: ${{ inputs.environment }}
      CLAXEDO_WORKGRAPH_ENVIRONMENT_ID: ${{ vars.CLAXEDO_WORKGRAPH_ENVIRONMENT_ID }}
      CLAXEDO_WORKGRAPH_DEPLOYMENT_ID: ${{ vars.CLAXEDO_WORKGRAPH_DEPLOYMENT_ID }}
      CLAXEDO_WORKGRAPH_WORKER_NAME: ${{ vars.CLAXEDO_WORKGRAPH_WORKER_NAME }}
      CLAXEDO_WORKGRAPH_DATABASE_NAME: ${{ vars.CLAXEDO_WORKGRAPH_DATABASE_NAME }}
      CLAXEDO_WORKGRAPH_DATABASE_ID: ${{ vars.CLAXEDO_WORKGRAPH_DATABASE_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun

      - name: Validate explicit WorkGraph installation resources
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            CLAXEDO_WORKGRAPH_ENVIRONMENT_ID CLAXEDO_WORKGRAPH_DEPLOYMENT_ID
            CLAXEDO_WORKGRAPH_WORKER_NAME CLAXEDO_WORKGRAPH_DATABASE_NAME
            CLAXEDO_WORKGRAPH_DATABASE_ID
          )
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || { echo "::error::${name} is required on the selected GitHub environment"; exit 1; }
          done

      - name: Derive immutable WorkGraph service build identity
        run: |
          set -euo pipefail
          hash=$(git -C "$GITHUB_WORKSPACE" archive "${GITHUB_SHA}" packages/claxedo-workgraph-service packages/claxedo-service-contract | sha256sum | awk '{print $1}')
          echo "CLAXEDO_WORKGRAPH_SERVICE_BUILD_ID=sha256:${hash}" >> "$GITHUB_ENV"

      - name: Render and dry-run the isolated Worker manifest
        run: |
          set -euo pipefail
          bun run render:wrangler > .wrangler.deploy.toml
          bun x wrangler deploy --dry-run --config .wrangler.deploy.toml --outdir .wrangler-dry-run
          ! grep -E 'AUTH_DB|CONTROL_PLANE_DB|DOCUMENTS|CLERK|CONVEX|BETTER_AUTH|\[\[services\]\]' .wrangler.deploy.toml

      - name: Apply WorkGraph-owned D1 migrations
        run: bun x wrangler d1 migrations apply WORKGRAPH_DB --remote --config .wrangler.deploy.toml

      - name: Require uninitialized or installed-disabled before dark deploy
        run: |
          set -euo pipefail
          state=$(bun x wrangler d1 execute WORKGRAPH_DB --remote --config .wrangler.deploy.toml --json \
            --command 'select state from workgraph_service_lifecycle where singleton = 1' \
            | jq -er '.[0].results | if length == 0 then "uninitialized" elif length == 1 then .[0].state else "invalid" end')
          case "$state" in
            uninitialized|installed_disabled) ;;
            *) echo "::error::refusing dark deploy while WorkGraph lifecycle is ${state}"; exit 1 ;;
          esac

      - name: Deploy WorkGraph Worker dark
        run: bun x wrangler deploy --config .wrangler.deploy.toml

      - name: Record coordinated-install boundary
        run: |
          echo "### WorkGraph service deployed dark" >> "$GITHUB_STEP_SUMMARY"
          echo "No core binding or catalog state was changed. The coordinated installer must initialize the empty lifecycle as installed_disabled, bind WorkGraphServiceV1, probe it, and only then enable the service and catalog." >> "$GITHUB_STEP_SUMMARY"
