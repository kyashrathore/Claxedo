name: deploy-control-plane

# D11 (docs/plans/2026-07-11-012, ops floor ADR 2026-07-11-016 §2): push to
# `dev` auto-deploys the hosted control plane to STAGING (Convex first, then
# the Worker — the unrollbackable unit ships first and must stay
# backward-compatible), then runs a behavioral smoke that asserts the staging
# Worker is up AND fail-closed on garbage credentials.
#
# PROD is never automatic: promotion runs only on `workflow_dispatch` and is
# additionally gated by the GitHub environment `production` (configure
# "Required reviewers" on that environment — the approval click IS the
# one-click promotion gate).
#
# Rollback doctrine, secrets, and break-glass commands:
#   public-docs/deploy-runbook.md
#
# Environment-scoped secrets (same names in `staging` and `production`):
#   CONVEX_DEPLOY_KEY       — deploy key for that environment's Convex deployment
#   CLOUDFLARE_API_TOKEN    — Workers Scripts:Edit on the target account
#   CLOUDFLARE_ACCOUNT_ID   — the account to deploy into
#   CLERK_SECRET_KEY        — Clerk Backend API key used only to mint short-lived
#                             smoke sessions for the configured test users
#   CLAXEDO_RUNTIME_ADMIN_TOKEN — Worker admin bearer used by the smoke to run
#                                  the same bounded WorkGraph reconciler as cron
# Environment-scoped variables:
#   CLAXEDO_CONTROL_PLANE_URL — base URL of that environment's Worker
#                               (e.g. https://claxedo-control-plane-staging.<subdomain>.workers.dev)
#   WORKGRAPH_SMOKE_USER_A_ID / WORKGRAPH_SMOKE_USER_B_ID — distinct Clerk users
#   WORKGRAPH_SMOKE_USER_A_EMAIL — primary email for user A's browser sign-in
#   WORKGRAPH_SMOKE_ORGANIZATION_A_ID / WORKGRAPH_SMOKE_ORGANIZATION_B_ID
#     — distinct Clerk organizations; user A belongs to both and user B belongs to A
#   WORKGRAPH_SMOKE_HARNESS / WORKGRAPH_SMOKE_AGENT — deployed execution catalog IDs
#   WORKGRAPH_SMOKE_PROVIDER_ID / WORKGRAPH_SMOKE_MODEL_ID / WORKGRAPH_SMOKE_EFFORT
#   WORKGRAPH_SMOKE_TOOLS_JSON — exact JSON array of tool IDs used by the no-op Task

on:
  push:
    branches: [dev]
    paths:
      - convex/**
      - packages/claxedo-server/**
      - packages/claxedo-connections/**
      - packages/workgraph/**
      - packages/agent-sdk-runtime/**
      - packages/channels/**
      - packages/sandbox-manager/**
      - packages/wakes/**
      - packages/workspace-relay/**
      - packages/workspace-relay-protocol/**
      - .github/actions/setup-bun/action.yml
      - .github/workflows/deploy-control-plane.yml
      - .github/workflows/deploy-claxedo-app.yml
      - .github/workflows/deploy-claxedo-app-staging.yml
  workflow_dispatch:
    inputs:
      promote:
        description: "Also promote this commit to production (after staging smoke passes and the production environment approval is granted)"
        required: false
        type: boolean
        default: true

# Every top-level Claxedo Cloud deploy shares this lock. The reusable app
# workflow has no independent trigger or lock, so this ordered parent keeps the
# global lock through Convex -> Worker -> app.
concurrency:
  group: claxedo-cloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify ordered release configuration
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLAXEDO_RUNTIME_ADMIN_TOKEN: ${{ secrets.CLAXEDO_RUNTIME_ADMIN_TOKEN }}
          CONTROL_PLANE_URL: ${{ vars.CLAXEDO_CONTROL_PLANE_URL }}
          WORKGRAPH_SMOKE_USER_A_ID: ${{ vars.WORKGRAPH_SMOKE_USER_A_ID }}
          WORKGRAPH_SMOKE_USER_A_EMAIL: ${{ vars.WORKGRAPH_SMOKE_USER_A_EMAIL }}
          WORKGRAPH_SMOKE_USER_B_ID: ${{ vars.WORKGRAPH_SMOKE_USER_B_ID }}
          WORKGRAPH_SMOKE_ORGANIZATION_A_ID: ${{ vars.WORKGRAPH_SMOKE_ORGANIZATION_A_ID }}
          WORKGRAPH_SMOKE_ORGANIZATION_B_ID: ${{ vars.WORKGRAPH_SMOKE_ORGANIZATION_B_ID }}
          WORKGRAPH_SMOKE_HARNESS: ${{ vars.WORKGRAPH_SMOKE_HARNESS }}
          WORKGRAPH_SMOKE_AGENT: ${{ vars.WORKGRAPH_SMOKE_AGENT }}
          WORKGRAPH_SMOKE_PROVIDER_ID: ${{ vars.WORKGRAPH_SMOKE_PROVIDER_ID }}
          WORKGRAPH_SMOKE_MODEL_ID: ${{ vars.WORKGRAPH_SMOKE_MODEL_ID }}
          WORKGRAPH_SMOKE_EFFORT: ${{ vars.WORKGRAPH_SMOKE_EFFORT }}
          WORKGRAPH_SMOKE_TOOLS_JSON: ${{ vars.WORKGRAPH_SMOKE_TOOLS_JSON }}
          APP_URL: ${{ vars.CLAXEDO_APP_URL }}
          PAGES_PROJECT: ${{ vars.CLAXEDO_PAGES_PROJECT }}
          PAGES_BRANCH: ${{ vars.CLAXEDO_PAGES_BRANCH }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          set -euo pipefail
          required=(
            CONVEX_DEPLOY_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            CLERK_SECRET_KEY CLAXEDO_RUNTIME_ADMIN_TOKEN CONTROL_PLANE_URL
            WORKGRAPH_SMOKE_USER_A_ID WORKGRAPH_SMOKE_USER_A_EMAIL WORKGRAPH_SMOKE_USER_B_ID
            WORKGRAPH_SMOKE_ORGANIZATION_A_ID WORKGRAPH_SMOKE_ORGANIZATION_B_ID
            WORKGRAPH_SMOKE_HARNESS WORKGRAPH_SMOKE_AGENT WORKGRAPH_SMOKE_PROVIDER_ID
            WORKGRAPH_SMOKE_MODEL_ID WORKGRAPH_SMOKE_EFFORT WORKGRAPH_SMOKE_TOOLS_JSON
            APP_URL PAGES_PROJECT PAGES_BRANCH CLERK_PUBLISHABLE_KEY CONVEX_URL
          )
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured in the staging environment"; exit 1; }
          done

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Build control-plane workspace packages
        run: |
          bun run --cwd packages/workspace-relay-protocol build
          bun run --cwd packages/workspace-relay build
          bun run --cwd packages/claxedo-connections build
          bun run --cwd packages/sandbox-manager build

      - name: Build WorkGraph packages for Convex
        run: bun run --cwd packages/workgraph build

      # ADR ordering: Convex FIRST (push-only, no server-side rollback; old
      # Workers must keep working against new Convex, so Convex changes are
      # additive-only). Schema commits contain only the compatible Convex
      # expansion; this ordered workflow then redeploys the unchanged Worker
      # and app artifacts from the same SHA. deploy-convex.yml is reserved for
      # an isolated operator-driven Convex roll-forward.
      # F18 (adversarial review): run the SAME pre-flight gate deploy-convex.yml
      # encodes before the real push — generate config + codegen + typecheck
      # WITHOUT deploying, so a config/codegen/type error is caught before the
      # unrollbackable Convex push (the auto-staging path previously deployed
      # with `--typecheck disable` and no dry-run, bypassing this gate).
      - name: Convex dry-run (config generation gate)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --dry-run --typecheck enable

      - name: Deploy Convex (staging deployment)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --typecheck enable --message "staging ${GITHUB_SHA}"

      - name: Normalize legacy runtime lease fields (staging)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex run migrations:run '{"fn":"migrations:normalizeRuntimeLeaseLegacyFields"}'

      # wrangler resolves to the workspace-pinned version (4.50.0 via the
      # repo lockfile) after setup-bun's `bun install`.
      # D12: CLAXEDO_RELEASE = git SHA → Sentry release tagging.
      - name: Deploy control-plane Worker (staging)
        working-directory: packages/claxedo-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --env staging --var "CLAXEDO_RELEASE:${GITHUB_SHA}"

      - name: Synchronize staging sandbox control token
        working-directory: packages/claxedo-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SANDBOX_CONTROL_TOKEN: ${{ secrets.CLAXEDO_RUNTIME_ADMIN_TOKEN }}
        run: printf '%s' "$SANDBOX_CONTROL_TOKEN" | bunx wrangler secret put CLOUDFLARE_SANDBOX_API_TOKEN --env staging

  smoke-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      # Behavioral smoke, not liveness theater (house doctrine: green checks
      # are claims). Four assertions:
      #   1. health returns ok:true
      #   2. the deployment reports signed auth ENABLED (fail-closed config)
      #   3. a garbage bearer token is rejected with exactly 401 on a
      #      signed-auth route — asserts the auth path fails CLOSED. A 200
      #      here (e.g. authority not wired) is a launch-blocking
      #      misconfiguration and fails the job.
      - name: Behavioral smoke (health + fail-closed auth probe)
        env:
          BASE_URL: ${{ vars.CLAXEDO_CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "::error::CLAXEDO_CONTROL_PLANE_URL variable is not set on the staging environment"
            exit 1
          fi
          BASE="${BASE_URL%/}"

          echo "== 1/4 health =="
          ok=""
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 15 "$BASE/api/claxedo/health") \
              && echo "$body" | jq -e '.ok == true' > /dev/null; then
              ok=1; echo "health ok: $body"; break
            fi
            echo "health attempt $attempt failed; retrying in 10s"; sleep 10
          done
          [ -n "$ok" ] || { echo "::error::staging health check failed"; exit 1; }

          echo "== 2/4 signed auth enabled =="
          mode=$(curl -fsS --max-time 15 "$BASE/api/claxedo/mode")
          echo "$mode" | jq -e '.signedAuth == true' > /dev/null \
            || { echo "::error::staging reports signedAuth != true — deployment is not fail-closed: $mode"; exit 1; }

          echo "== 3/4 garbage bearer must be 401 =="
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer smoke-garbage-token-${GITHUB_RUN_ID}" \
            "$BASE/api/control/sessions?workspaceId=smoke-probe")
          if [ "$code" != "401" ]; then
            echo "::error::expected 401 for a garbage bearer token, got $code — auth is not failing closed"
            exit 1
          fi
          echo "fail-closed probe ok (401)"

          echo "== 4/4 WorkGraph garbage bearer must be 401 =="
          workgraph_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer workgraph-smoke-garbage-${GITHUB_RUN_ID}" \
            "$BASE/api/workgraph/snapshot?limit=1")
          [ "$workgraph_code" = "401" ] \
            || { echo "::error::expected WorkGraph 401, got $workgraph_code"; exit 1; }

      - name: WorkGraph authenticated persistence and no-op execution smoke
        working-directory: packages/claxedo-server
        env:
          BASE_URL: ${{ vars.CLAXEDO_CONTROL_PLANE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          WORKGRAPH_SMOKE_USER_A_ID: ${{ vars.WORKGRAPH_SMOKE_USER_A_ID }}
          WORKGRAPH_SMOKE_USER_A_EMAIL: ${{ vars.WORKGRAPH_SMOKE_USER_A_EMAIL }}
          WORKGRAPH_SMOKE_USER_B_ID: ${{ vars.WORKGRAPH_SMOKE_USER_B_ID }}
          WORKGRAPH_SMOKE_ORGANIZATION_A_ID: ${{ vars.WORKGRAPH_SMOKE_ORGANIZATION_A_ID }}
          WORKGRAPH_SMOKE_ORGANIZATION_B_ID: ${{ vars.WORKGRAPH_SMOKE_ORGANIZATION_B_ID }}
          WORKGRAPH_SMOKE_RECONCILE_TOKEN: ${{ secrets.CLAXEDO_RUNTIME_ADMIN_TOKEN }}
          WORKGRAPH_SMOKE_HARNESS: ${{ vars.WORKGRAPH_SMOKE_HARNESS }}
          WORKGRAPH_SMOKE_AGENT: ${{ vars.WORKGRAPH_SMOKE_AGENT }}
          WORKGRAPH_SMOKE_PROVIDER_ID: ${{ vars.WORKGRAPH_SMOKE_PROVIDER_ID }}
          WORKGRAPH_SMOKE_MODEL_ID: ${{ vars.WORKGRAPH_SMOKE_MODEL_ID }}
          WORKGRAPH_SMOKE_EFFORT: ${{ vars.WORKGRAPH_SMOKE_EFFORT }}
          WORKGRAPH_SMOKE_TOOLS_JSON: ${{ vars.WORKGRAPH_SMOKE_TOOLS_JSON }}
        run: bun run smoke:workgraph

  deploy-app-staging:
    needs: smoke-staging
    uses: ./.github/workflows/deploy-claxedo-app.yml
    with:
      target_environment: staging
    secrets: inherit

  # Prod promotion: only on manual dispatch, and only after a human approves
  # the `production` environment (configure required reviewers there). It
  # redeploys the SAME commit the staging smoke just validated.
  promote-production:
    if: github.event_name == 'workflow_dispatch' && inputs.promote
    needs: deploy-app-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify ordered release configuration
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLAXEDO_RUNTIME_ADMIN_TOKEN: ${{ secrets.CLAXEDO_RUNTIME_ADMIN_TOKEN }}
          CONTROL_PLANE_URL: ${{ vars.CLAXEDO_CONTROL_PLANE_URL }}
          WORKGRAPH_SMOKE_USER_A_ID: ${{ vars.WORKGRAPH_SMOKE_USER_A_ID }}
          WORKGRAPH_SMOKE_USER_A_EMAIL: ${{ vars.WORKGRAPH_SMOKE_USER_A_EMAIL }}
          WORKGRAPH_SMOKE_USER_B_ID: ${{ vars.WORKGRAPH_SMOKE_USER_B_ID }}
          WORKGRAPH_SMOKE_ORGANIZATION_A_ID: ${{ vars.WORKGRAPH_SMOKE_ORGANIZATION_A_ID }}
          WORKGRAPH_SMOKE_ORGANIZATION_B_ID: ${{ vars.WORKGRAPH_SMOKE_ORGANIZATION_B_ID }}
          WORKGRAPH_SMOKE_HARNESS: ${{ vars.WORKGRAPH_SMOKE_HARNESS }}
          WORKGRAPH_SMOKE_AGENT: ${{ vars.WORKGRAPH_SMOKE_AGENT }}
          WORKGRAPH_SMOKE_PROVIDER_ID: ${{ vars.WORKGRAPH_SMOKE_PROVIDER_ID }}
          WORKGRAPH_SMOKE_MODEL_ID: ${{ vars.WORKGRAPH_SMOKE_MODEL_ID }}
          WORKGRAPH_SMOKE_EFFORT: ${{ vars.WORKGRAPH_SMOKE_EFFORT }}
          WORKGRAPH_SMOKE_TOOLS_JSON: ${{ vars.WORKGRAPH_SMOKE_TOOLS_JSON }}
          APP_URL: ${{ vars.CLAXEDO_APP_URL }}
          PAGES_PROJECT: ${{ vars.CLAXEDO_PAGES_PROJECT }}
          PAGES_BRANCH: ${{ vars.CLAXEDO_PAGES_BRANCH }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          set -euo pipefail
          required=(
            CONVEX_DEPLOY_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            CLERK_SECRET_KEY CLAXEDO_RUNTIME_ADMIN_TOKEN CONTROL_PLANE_URL
            WORKGRAPH_SMOKE_USER_A_ID WORKGRAPH_SMOKE_USER_A_EMAIL WORKGRAPH_SMOKE_USER_B_ID
            WORKGRAPH_SMOKE_ORGANIZATION_A_ID WORKGRAPH_SMOKE_ORGANIZATION_B_ID
            WORKGRAPH_SMOKE_HARNESS WORKGRAPH_SMOKE_AGENT WORKGRAPH_SMOKE_PROVIDER_ID
            WORKGRAPH_SMOKE_MODEL_ID WORKGRAPH_SMOKE_EFFORT WORKGRAPH_SMOKE_TOOLS_JSON
            APP_URL PAGES_PROJECT PAGES_BRANCH CLERK_PUBLISHABLE_KEY CONVEX_URL
          )
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured in the production environment"; exit 1; }
          done

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Build control-plane workspace packages
        run: |
          bun run --cwd packages/workspace-relay-protocol build
          bun run --cwd packages/workspace-relay build
          bun run --cwd packages/claxedo-connections build
          bun run --cwd packages/sandbox-manager build

      - name: Build WorkGraph packages for Convex
        run: bun run --cwd packages/workgraph build

      # Same ADR ordering as staging: Convex before Worker, with the app
      # released only after the Worker and authenticated smoke are healthy.
      # F18: same pre-flight gate as staging / deploy-convex.yml before the push.
      - name: Convex dry-run (config generation gate)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --dry-run --typecheck enable

      - name: Deploy Convex (production deployment)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --typecheck enable --message "production ${GITHUB_SHA}"

      - name: Normalize legacy runtime lease fields (production)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex run migrations:run '{"fn":"migrations:normalizeRuntimeLeaseLegacyFields"}'

      # Top-level wrangler env = production (name = claxedo-control-plane).
      # D12: CLAXEDO_RELEASE = git SHA → Sentry release tagging.
      - name: Deploy control-plane Worker (production)
        working-directory: packages/claxedo-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --env "" --var "CLAXEDO_RELEASE:${GITHUB_SHA}"

      - name: Behavioral smoke (production)
        env:
          BASE_URL: ${{ vars.CLAXEDO_CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "::error::CLAXEDO_CONTROL_PLANE_URL variable is not set on the production environment"
            exit 1
          fi
          BASE="${BASE_URL%/}"

          ok=""
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 15 "$BASE/api/claxedo/health") \
              && echo "$body" | jq -e '.ok == true' > /dev/null; then
              ok=1; echo "health ok: $body"; break
            fi
            echo "health attempt $attempt failed; retrying in 10s"; sleep 10
          done
          [ -n "$ok" ] || { echo "::error::production health check failed — roll back: see public-docs/deploy-runbook.md"; exit 1; }

          mode=$(curl -fsS --max-time 15 "$BASE/api/claxedo/mode")
          echo "$mode" | jq -e '.signedAuth == true' > /dev/null \
            || { echo "::error::production reports signedAuth != true: $mode"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer smoke-garbage-token-${GITHUB_RUN_ID}" \
            "$BASE/api/control/sessions?workspaceId=smoke-probe")
          if [ "$code" != "401" ]; then
            echo "::error::expected 401 for a garbage bearer token, got $code — roll back: see public-docs/deploy-runbook.md"
            exit 1
          fi
          workgraph_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer workgraph-smoke-garbage-${GITHUB_RUN_ID}" \
            "$BASE/api/workgraph/snapshot?limit=1")
          [ "$workgraph_code" = "401" ] \
            || { echo "::error::expected WorkGraph 401, got $workgraph_code"; exit 1; }
          echo "production smoke passed"

      - name: WorkGraph authenticated persistence and no-op execution smoke
        working-directory: packages/claxedo-server
        env:
          BASE_URL: ${{ vars.CLAXEDO_CONTROL_PLANE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          WORKGRAPH_SMOKE_USER_A_ID: ${{ vars.WORKGRAPH_SMOKE_USER_A_ID }}
          WORKGRAPH_SMOKE_USER_B_ID: ${{ vars.WORKGRAPH_SMOKE_USER_B_ID }}
          WORKGRAPH_SMOKE_ORGANIZATION_A_ID: ${{ vars.WORKGRAPH_SMOKE_ORGANIZATION_A_ID }}
          WORKGRAPH_SMOKE_ORGANIZATION_B_ID: ${{ vars.WORKGRAPH_SMOKE_ORGANIZATION_B_ID }}
          WORKGRAPH_SMOKE_RECONCILE_TOKEN: ${{ secrets.CLAXEDO_RUNTIME_ADMIN_TOKEN }}
          WORKGRAPH_SMOKE_HARNESS: ${{ vars.WORKGRAPH_SMOKE_HARNESS }}
          WORKGRAPH_SMOKE_AGENT: ${{ vars.WORKGRAPH_SMOKE_AGENT }}
          WORKGRAPH_SMOKE_PROVIDER_ID: ${{ vars.WORKGRAPH_SMOKE_PROVIDER_ID }}
          WORKGRAPH_SMOKE_MODEL_ID: ${{ vars.WORKGRAPH_SMOKE_MODEL_ID }}
          WORKGRAPH_SMOKE_EFFORT: ${{ vars.WORKGRAPH_SMOKE_EFFORT }}
          WORKGRAPH_SMOKE_TOOLS_JSON: ${{ vars.WORKGRAPH_SMOKE_TOOLS_JSON }}
        run: bun run smoke:workgraph

  deploy-app-production:
    if: github.event_name == 'workflow_dispatch' && inputs.promote
    needs: promote-production
    uses: ./.github/workflows/deploy-claxedo-app.yml
    with:
      target_environment: production
    secrets: inherit
