name: workgraph-stress

on:
  # Temporarily manual-only while WorkGraph is not an active product focus.
  # Keep the workflow available for explicit validation without paying the
  # scheduled 30-minute CI cost every day.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workgraph-stress
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15"

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The stress entry reaches far past WorkGraph itself: it constructs the
      # hosted service, which pulls in the live-sync room and the runtime bus.
      # Those resolve through `dist` export maps, and `^build` from workgraph
      # and workspace-relay does not reach agent-sdk-runtime, agent-extensions,
      # or workspace-runtime -- so every run of this workflow died at import
      # with "Failed to load url @claxedo/agent-sdk-runtime/sse" before a single
      # gate executed. Build the closure the stress module graph actually needs.
      - name: Build dist-resolved workspace packages
        run: >-
          bun turbo build
          --filter=@claxedo/agent-extensions
          --filter=@claxedo/agent-sdk-runtime
          --filter=@claxedo/sandbox-contract
          --filter=@claxedo/sandbox-manager
          --filter=@claxedo/workgraph
          --filter=@claxedo/workspace-relay-protocol
          --filter=@claxedo/workspace-relay
          --filter=@claxedo/workspace-runtime

      - name: Run WorkGraph stress gates
        working-directory: packages/claxedo-server
        run: bun run stress:workgraph

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workgraph-stress-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: packages/claxedo-server/bench-reports/workgraph-latest.md
