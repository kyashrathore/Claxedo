name: Windows CIM probe (temporary)

# TEMPORARY release diagnostics — delete once the Windows source smoke is green.
#
# Root cause, named by round 3: on Windows PowerShell 5.1 the worker's
#   $inputPids = @($line | ConvertFrom-Json)
# NESTED the parsed array (@(@(pid))) — 5.1 emits a JSON array as ONE
# pipeline object — so [int]$_ threw InvalidCast on EVERY query, swallowed by
# the catch into {"ok":false}. The fix parses by bare assignment, which stays
# flat under 5.1 and 7 alike. Round 4 proves the fixed REVIEWED script
# end-to-end under the app's exact spawn policy: single-pid and multi-pid
# queries must both return ok:true rows, warm responses in ms.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify the fixed worker under the app's spawn policy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $text = [System.IO.File]::ReadAllText("$PWD\packages\claxedo-desktop\src\main\diagnostics\windows-cim-worker.ps1")
          $text = $text -replace "`r?`n", "`r`n"
          $enc = [Convert]::ToBase64String([System.Text.Encoding]::Unicode.GetBytes($text))

          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          $psi.Arguments = "-NoLogo -NoProfile -NonInteractive -EncodedCommand $enc"
          $psi.WorkingDirectory = "C:\Windows\Temp"
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.EnvironmentVariables.Clear()
          $psi.EnvironmentVariables["SystemRoot"] = "C:\Windows"
          $psi.EnvironmentVariables["WINDIR"] = "C:\Windows"
          $psi.EnvironmentVariables["PATH"] = "C:\Windows\System32;C:\Windows"

          $p = [System.Diagnostics.Process]::Start($psi)
          $stderr = $p.StandardError.ReadToEndAsync()
          $sw = [System.Diagnostics.Stopwatch]::StartNew()

          $p.StandardInput.WriteLine("[$PID]")
          $p.StandardInput.Flush()
          $first = $p.StandardOutput.ReadLine()
          $sw.Stop()
          Write-Host "single-pid FIRST ($($sw.ElapsedMilliseconds)ms): $first"
          if ($first -notmatch '"ok":true') { throw "single-pid query did not return ok:true" }
          if ($first -notmatch """pid"":$PID") { throw "single-pid query did not return a row for $PID" }

          $sw.Restart()
          $p.StandardInput.WriteLine("[1,$PID]")
          $p.StandardInput.Flush()
          $second = $p.StandardOutput.ReadLine()
          $sw.Stop()
          Write-Host "multi-pid WARM ($($sw.ElapsedMilliseconds)ms): $second"
          if ($second -notmatch '"ok":true') { throw "multi-pid query did not return ok:true" }

          $sw.Restart()
          $p.StandardInput.WriteLine("[0]")
          $p.StandardInput.Flush()
          $third = $p.StandardOutput.ReadLine()
          $sw.Stop()
          Write-Host "empty-set WARM ($($sw.ElapsedMilliseconds)ms): $third"

          # Forced failure: an uncastable payload takes the catch. This proves
          # the catch block parses under 5.1 AND that a failure now names
          # itself, which is what the release gate needs to be diagnosable.
          $sw.Restart()
          $p.StandardInput.WriteLine('"not-a-pid-array"')
          $p.StandardInput.Flush()
          $fourth = $p.StandardOutput.ReadLine()
          $sw.Stop()
          Write-Host "forced-failure WARM ($($sw.ElapsedMilliseconds)ms): $fourth"
          if ($fourth -notmatch '"ok":false') { throw "forced failure did not return ok:false" }
          if ($fourth -notmatch '"reason":"') { throw "forced failure did not name a reason" }

          # The worker must still serve queries after a caught failure.
          $p.StandardInput.WriteLine("[$PID]")
          $p.StandardInput.Flush()
          $fifth = $p.StandardOutput.ReadLine()
          Write-Host "recovery AFTER FAILURE: $fifth"
          if ($fifth -notmatch '"ok":true') { throw "worker did not recover after a caught failure" }

          Write-Host "alive at end: $(-not $p.HasExited)"
          if (-not $p.HasExited) { $p.Kill() }
          $errText = $stderr.GetAwaiter().GetResult()
          if ($errText.Trim() -and $errText.Trim() -ne "#< CLIXML") { Write-Host "child stderr: $errText" }
          Write-Host "PROBE PASSED: fixed worker returns ok:true rows under the app spawn policy"
