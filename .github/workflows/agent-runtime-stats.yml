name: Agent runtime stats

on:
  pull_request:
    paths:
      - "packages/agent-runtime-stats/**"
      - ".github/workflows/agent-runtime-stats.yml"
  push:
    branches: [dev]
    paths:
      - "packages/agent-runtime-stats/**"
      - ".github/workflows/agent-runtime-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/agent-runtime-stats
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: npm test
      - run: node bin/agent-runtime-stats.js --version
      - if: runner.os == 'Linux'
        run: npm pack --dry-run
      - if: runner.os == 'Linux'
        run: bun install --frozen-lockfile --filter @claxedo/agent-runtime-stats
        working-directory: ${{ github.workspace }}
      - if: runner.os == 'Linux'
        run: bun run worker:check
