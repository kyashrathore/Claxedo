name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: select affected typecheck surfaces
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.changed.outputs.full }}
      typecheck: ${{ steps.changed.outputs.typecheck }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Select affected gates
        id: changed
        uses: ./.github/actions/detect-ci-changes
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          force-full: ${{ github.event_name == 'workflow_dispatch' }}

  typecheck:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # packages/*/dist is gitignored, so a fresh checkout has none of the
      # build outputs that dist-resolved @claxedo/* workspace packages export
      # (e.g. @claxedo/wakes -> dist/index.js).
      # Typecheck consumers (claxedo-mcp, claxedo-app, claxedo-server, ...)
      # resolve those exports, so build them first. Scoped filters — not a
      # blanket `turbo build` or `typecheck: dependsOn ^build` — keep the
      # heavy app/binary builds (claxedo-app, desktop, web) out of this job.
      - name: Build dist-resolved workspace packages
        run: >-
          bun turbo build
          --filter=@claxedo/agent-event-runtime
          --filter=@claxedo/agent-sdk-runtime
          --filter=@claxedo/channels
          --filter=@claxedo/connections
          --filter=@claxedo/mcp
          --filter=@claxedo/sandbox-contract
          --filter=@claxedo/sandbox-manager
          --filter=@claxedo/wakes
          --filter=@claxedo/workspace-relay-protocol
          --filter=@claxedo/workspace-relay
          --filter=@claxedo/workspace-runtime

      # Full-repo lint is ~12 s and needs the same dist outputs as typecheck
      # (type-aware rules resolve @claxedo/* through package exports). The
      # root .oxlintrc.json sets every enabled rule to error, so this fails on
      # any finding, exactly like the pre-push hook (`bun run prepush`).
      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: |
          if [[ "${{ needs.changes.outputs.full }}" == "true" ]]; then
            bun typecheck
          else
            bun turbo typecheck --affected
          fi
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

      # `bun run prepush` is lint, then typecheck, then this. The first two ran
      # above; without this step the ratchets ran in no workflow at all and
      # deterministic closure drift reached `dev` whenever someone pushed with
      # the hook bypassed. It walks source from product entrypoints, so it needs
      # no build output beyond what the job already produced.
      - name: Run architecture ratchets
        run: bun run test:architecture-ratchets
