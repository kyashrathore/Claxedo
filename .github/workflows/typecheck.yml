name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: select affected typecheck surfaces
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.changed.outputs.full }}
      typecheck: ${{ steps.changed.outputs.typecheck }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Select affected gates
        id: changed
        uses: ./.github/actions/detect-ci-changes
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          force-full: ${{ github.event_name == 'workflow_dispatch' }}

  typecheck:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Typecheck reads sibling source through the `development` export
      # condition each tsconfig declares. Type-aware lint does not: files no
      # tsconfig includes (desktop scripts and tests, stories) resolve
      # @claxedo/* through the default condition, which is dist/, and an
      # unresolved import is an `error` type that trips
      # no-redundant-type-constituents and the unsafe-* rules.
      - name: Build dist-resolved workspace packages
        run: bun run build:packages

      # perf-harness is not a workspace package: without its own install its
      # agent-app-benchmark imports are `error` types too.
      - name: Install performance harness
        working-directory: packages/claxedo-app/perf-harness
        run: bun install --frozen-lockfile

      # The root .oxlintrc.json sets every enabled rule to error, so this
      # fails on any finding, exactly like the pre-push hook (`bun run prepush`).
      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: |
          if [[ "${{ needs.changes.outputs.full }}" == "true" ]]; then
            bun typecheck
          else
            bun turbo typecheck --affected
          fi
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

      # script/ci-changes.mjs decides which gates every workflow runs, so a
      # mistake in it is silent: the gate it stops selecting simply never
      # reports. Its test ran in no workflow at all until this step. Editing it
      # is a GLOBAL_FILE change, which forces `full`, so this job is always
      # selected when the policy moves.
      - name: Run CI gate-selection policy tests
        run: bun run test:ci-policy

      # `bun run prepush` is lint, then typecheck, then this. The first two ran
      # above; without this step the ratchets ran in no workflow at all and
      # deterministic closure drift reached `dev` whenever someone pushed with
      # the hook bypassed. It walks source from product entrypoints, so it needs
      # no build output beyond what the job already produced.
      - name: Run architecture ratchets
        run: bun run test:architecture-ratchets
