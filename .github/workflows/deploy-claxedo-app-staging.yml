name: deploy-claxedo-app-staging

# App-only staging releases enter through this lock-owning workflow. There is
# no ordered control-plane workflow to defer to anymore: the control plane
# (Better Auth + D1) is released separately, by hand, via
# packages/claxedo-server/scripts/deploy/release-better-auth-d1.ts. So the app
# deploys whenever its own watched paths change, with no change-detection
# gate on unrelated server packages.
on:
  push:
    branches: [dev]
    paths:
      - packages/claxedo-app/**
      - .github/actions/setup-bun/action.yml
      - .github/workflows/deploy-claxedo-app.yml
      - .github/workflows/deploy-claxedo-app-staging.yml

concurrency:
  group: claxedo-cloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-claxedo-app.yml
    with:
      target_environment: staging
    secrets: inherit
