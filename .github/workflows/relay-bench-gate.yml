# The relay's credential-free gate. `bun run bench:gate` (bench/cf-dev-smoke.ts)
# boots the deployed Worker under `wrangler dev --local` on workerd, points it at
# an in-process resolver and echo target, and fails unless HTTP requests and WS
# upgrades round-trip through it. Nothing is mocked and no Cloudflare account is
# involved, so it runs on fork PRs. `cf-dev-smoke.ts` exits 1 on a gate breach
# and 2 on a harness error.

name: relay-bench-gate

on:
  pull_request:
    paths:
      - "packages/workspace-relay/**"
      - ".github/workflows/relay-bench-gate.yml"
  push:
    branches: [dev]
    paths:
      - "packages/workspace-relay/**"
      - ".github/workflows/relay-bench-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-bench-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      # The Worker bundle resolves these through their gitignored dist entries.
      - name: Build dist-resolved workspace dependencies
        run: |
          bun run --cwd packages/claxedo-helpers build
          bun run --cwd packages/workspace-relay-protocol build

      - name: Typecheck bench harness
        working-directory: packages/workspace-relay
        run: bun run typecheck:bench

      - name: Relay gate on workerd
        working-directory: packages/workspace-relay
        run: bun run bench:gate
