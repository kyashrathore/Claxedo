name: docs-links

# Mintlify's link checker for the packages/claxedo-docs .mdx tree.
#
# Deliberately NOT in test.yml's `unit` job: `mintlify broken-links` resolves
# links over the network and takes 1-2 minutes, and `unit` is a required check.
# A transient Mintlify or CDN failure there would block every merge, which buys
# far less than it costs.
#
# The repo-local guard (`bun run docs:check-links`, script/check-doc-links.ts)
# covers docs/ and public-docs/ with pure filesystem reads and no network, so
# that one IS in the required gate. This workflow covers the .mdx tree that the
# repo-local guard does not.
on:
  schedule:
    # Mondays 06:00 UTC. Docs links rot on external-change timescales, not on
    # per-commit ones, so a weekly sweep is the right cadence.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - packages/claxedo-docs/**
      - .github/workflows/docs-links.yml

permissions:
  contents: read

jobs:
  broken-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Check documentation links
        working-directory: packages/claxedo-docs
        run: bun run broken-links
