name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ github.ref == 'refs/heads/dev' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnostics:
    name: local diagnostics release gate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build diagnostics package dependencies
        run: >-
          bun turbo build
          --filter=@claxedo/agent-event-runtime
          --filter=@claxedo/agent-extensions
          --filter=@claxedo/agent-sdk-runtime
          --filter=@claxedo/channels
          --filter=@claxedo/connections
          --filter=@claxedo/mcp
          --filter=@claxedo/sandbox-contract
          --filter=@claxedo/sandbox-manager
          --filter=@claxedo/wakes
          --filter=@claxedo/workgraph
          --filter=@claxedo/workspace-relay-protocol
          --filter=@claxedo/workspace-relay
          --filter=@claxedo/workspace-runtime

      - name: Build desktop diagnostics
        working-directory: packages/claxedo-desktop
        run: bun run build

      - name: Verify exact diagnostics dependencies
        working-directory: packages/claxedo-desktop
        env:
          CLAXEDO_DIAGNOSTICS_VERIFY_ADVISORIES: "1"
        run: bun run verify:diagnostics-dependencies

      - name: Verify diagnostics privacy boundary
        working-directory: packages/claxedo-desktop
        run: bun run verify:diagnostics-privacy

      - name: Run diagnostics contract and safety suite
        working-directory: packages/claxedo-desktop
        run: bun run test:diagnostics-release

      - name: Run rendered diagnostics task evaluator
        working-directory: packages/claxedo-app
        run: bun run test:diagnostics-release

      # perf-harness is an intentionally standalone package with its own lockfile;
      # the repository-root workspace install does not install its dependencies.
      - name: Install diagnostics performance harness dependencies
        working-directory: packages/claxedo-app/perf-harness
        run: bun install --frozen-lockfile

      - name: Run diagnostics performance gates
        working-directory: packages/claxedo-app/perf-harness
        run: bun test

      - name: Build real app performance target
        working-directory: packages/claxedo-app
        run: bun run build

      # ---------------------------------------------------------------------
      # Local product bundle boundary (emitted artifact, not source graph).
      #
      # `src/architecture/local-entry-closure.guard.test.ts` already runs in the
      # `unit` job and proves the local entry's SOURCE closure never reaches the
      # identity provider. It structurally CANNOT see Rollup configuration: the
      # local config derives from the hosted one, so a `manualChunks` entry
      # naming `@clerk/clerk-js/headless` was inherited by a build whose whole
      # purpose is to have no identity provider in it, and the source guard was
      # green throughout. A clean source graph and a contaminated artifact are
      # indistinguishable without reading the emitted files. These steps read
      # them.
      #
      # It lives in THIS job because this job already pays for a checkout, a
      # `bun install`, the dist-resolved workspace build, and a production
      # `vite build`. A dedicated job would repeat all of that to run two extra
      # vite builds. It is deliberately NOT attached to turbo's generic `test`
      # task: that would put a vite build in every package's test graph, which
      # is the same mistake as wiring `^build` there (see turbo.json).
      #
      # Placed before the Playwright install/perf flows so a contaminated
      # bundle fails in ~2 build-lengths instead of after the browser work.
      # Measured 2026-08-09 on an M-series dev machine: `build:local` 20.6s,
      # `build:marker-control` ~20s. Neither writes to `dist`, so the perf
      # target built above is untouched.
      #
      # The marker control needs its OWN build rather than the `dist`
      # produced earlier in this job. MEASURED, not assumed: `auth-client.ts` reaches
      # `import("@clerk/clerk-js/headless")` only past `if (!clerkPubKey) return`,
      # and `clerkPubKey` folds to "" when `VITE_CLERK_PUBLISHABLE_KEY` is unset —
      # so Rollup drops the import and a plain CI `bun run build` (no `.env.local`
      # on a runner) emits NO identity-provider code at all. Pointing the control
      # at that `dist` fails all 7 markers and reds the gate for a reason that has
      # nothing to do with the local bundle. `build:marker-control` sets the two
      # env vars that keep the provider in the graph and writes to its own outDir.
      # Without this control, "no hits" is a hope rather than a result: a marker
      # list that stopped matching anything would pass silently forever.
      # `verify:closure` composes the source guard, local build, marker-control
      # build and emitted scanner in that order; CI runs the same public command
      # a reviewer runs locally instead of restating its internals here.
      - name: Verify local renderer product boundary
        working-directory: packages/claxedo-app
        run: bun run verify:closure

      - name: Install performance browser
        working-directory: packages/claxedo-app/perf-harness
        run: bunx playwright install chromium

      - name: Run paired disabled and profiler-enabled app flows
        working-directory: packages/claxedo-app/perf-harness
        env:
          CLAXEDO_PERF_APP_SCRIPT: serve
          # The diagnostics gate requires request/resource attribution for the
          # user flows it evaluates. Keep GitHub and the Crabbox diagnostics
          # lane on the same evidence contract.
          CLAXEDO_PERF_CAUSAL: "1"
          # Absolute 60 Hz renderer-task limits remain strict. This headroom
          # applies only to the paired diagnostics-overhead delta, whose two
          # sequential samples are noisy on shared runners.
          CLAXEDO_PERF_HEADROOM: "1.0"
        run: bun run run:all

      - name: Run real-child diagnostics overhead smoke
        working-directory: packages/claxedo-desktop
        env:
          CLAXEDO_DIAGNOSTICS_SMOKE_OUTPUT: .artifacts/diagnostics-source-linux.json
        run: |
          mkdir -p .artifacts
          # The smoke's probe tree (bun child + metrics worker + pidusage) runs
          # against the runner's default 1024-fd soft limit and has hit EMFILE
          # at Bun.spawn; raise to the hard limit for this step only.
          ulimit -n "$(ulimit -Hn)" || true
          echo "fd soft limit: $(ulimit -n)"
          bun run smoke:diagnostics

      - name: Upload diagnostics evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-source-linux-${{ github.run_attempt }}
          path: packages/claxedo-desktop/.artifacts/diagnostics-source-linux.json
          if-no-files-found: error
          retention-days: 14

  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    env:
      # Consumed by the Linux-only mermaid verification steps below; inert on
      # the Windows leg, which skips them.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      # Repo-root guard, not a package suite, so it has no turbo task. Linux
      # only: it reads Markdown off disk and is OS-independent, so running it
      # again on the Windows leg buys nothing.
      - name: Check documentation links
        if: runner.os == 'Linux'
        run: bun run docs:check-links

      # session-ui's mermaid path CANNOT be unit tested, so it rides here rather
      # than in `bun turbo test`: `bun test` has no DOM, happy-dom's HTML parser
      # drops every child of an <svg> while its XML parser makes DOMPurify a
      # no-op (see the header of markdown-svg-sanitize.test.ts -- both failure
      # modes produce a GREEN test that checked nothing), and markdown.tsx only
      # loads inside a Vite graph at all, because markdown-worker.ts imports
      # `./markdown-shiki.worker.ts?worker&url`. So these are real-Chromium
      # scripts. They run before the build and the 35-minute test step so a
      # mermaid regression fails fast, and Linux-only for the same reason as the
      # docs check above. Roughly 2-3 minutes with a warm browser cache.
      #
      # The pair is deliberate and neither half covers the other: the sanitizer
      # script proves mermaid's SVG is filtered, the wiring script proves the
      # renderer is reached at all. `renderMermaidBlocks` was dead code for its
      # entire life -- no diagram ever rendered -- and the sanitizer suite stayed
      # green the whole time, because a sanitizer cannot notice that nothing
      # calls it.
      - name: Read Playwright version
        if: runner.os == 'Linux'
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same key as the e2e jobs below, so this shares their cache entry.
      - name: Cache Playwright browsers
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        working-directory: packages/claxedo-app
        run: npx playwright install chromium

      # No `bun turbo build` needed: everything these two import
      # (@opencode-ai/ui, /core, /sdk) is exported from source, not dist.
      - name: Verify mermaid rendering (sanitizer + wiring)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        working-directory: packages/session-ui
        run: bun run verify:mermaid

      # packages/*/dist is gitignored and several @claxedo packages resolve each
      # other through their dist exports, so the suites that import them need
      # these built first. turbo.json's generic `test` task deliberately does
      # NOT use `dependsOn: ["^build"]` to get this -- that edge reaches the
      # repo-wide-broken `opencode#build` (see the comment in turbo.json) -- so
      # the build is scoped explicitly here instead. Same list the diagnostics
      # and e2e jobs below use, plus typecheck.yml and release-claxedo.yml --
      # `grep -rn 'filter=@claxedo/agent-event-runtime' .github/workflows/`
      # finds every copy; keep them in sync.
      - name: Build dist-resolved workspace packages
        run: >-
          bun turbo build
          --filter=@claxedo/agent-event-runtime
          --filter=@claxedo/agent-extensions
          --filter=@claxedo/agent-sdk-runtime
          --filter=@claxedo/channels
          --filter=@claxedo/connections
          --filter=@claxedo/mcp
          --filter=@claxedo/sandbox-contract
          --filter=@claxedo/sandbox-manager
          --filter=@claxedo/wakes
          --filter=@claxedo/workgraph
          --filter=@claxedo/workspace-relay-protocol
          --filter=@claxedo/workspace-relay
          --filter=@claxedo/workspace-runtime

      # The app's emitted boundary runs in `diagnostics`, where the two Vite
      # builds already lived. These four are source/package checks and are fast;
      # run each product's public command so a future gate added to the shared
      # command table is gated here automatically.
      - name: Verify product package boundaries
        if: runner.os == 'Linux'
        run: |
          bun run --cwd packages/claxedo-local-server verify:closure
          bun run --cwd packages/claxedo-host-connector verify:closure
          bun run --cwd packages/claxedo-server verify:closure
          bun run --cwd packages/claxedo-desktop verify:closure

      # `bun turbo test` used to be a near-no-op: turbo.json declared only five
      # package-scoped `#test` entries, and turbo runs nothing for a package it
      # has no entry for, so 22 packages with real suites -- claxedo-server's
      # 236 files / 2386 tests among them -- never gated a PR. turbo.json now
      # declares ONE generic `test` task, so this command runs every package
      # that has a `test` script, including ones added later.
      #
      # 35 min, up from 20: claxedo-server alone is ~4.5 min wall clock on a
      # fast dev machine with `fileParallelism: false` (236 files serialized),
      # and a 2-core runner is materially slower. If the observed wall clock
      # ever crowds this ceiling, split claxedo-server into its own job rather
      # than raising the number again -- but that job must then be added to
      # branch protection, or it runs without gating anything.
      #
      # `--concurrency=2` matches the runner's core count and is load-bearing,
      # not tuning. Turbo defaults to 10 parallel tasks; several newly-wired
      # suites assert on wall-clock behaviour (wakes' timer coalescing,
      # workgraph's single-concurrent-winner effect lease, workspace-runtime's
      # PTY byte forwarding) and fail their 5s timeouts when starved of CPU.
      # Measured: at 21-way parallelism on a fast many-core dev machine those
      # three went red; serialized on the same machine, all three pass. A
      # 2-core runner at concurrency 10 is strictly worse, and oversubscribing
      # two cores buys no wall clock anyway.
      - name: Run unit tests
        timeout-minutes: 35
        run: bun turbo test --concurrency=2
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Publish unit reports
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          # `junit*.xml`, not `junit.xml`: several packages run more than one
          # runner and write one report each -- @claxedo/app emits `junit.xml`
          # (bun) plus `junit-vitest.xml` (Solid component renders), and
          # @claxedo/workspace-relay emits `junit-bun-adapter.xml` /
          # `junit-workerd.xml`. Those suites already gate the job through their
          # exit code; the narrower glob only meant their results were missing
          # from the published check.
          # Second glob catches the nested workspace package (packages/sdk/js).
          report_paths: |
            packages/*/.artifacts/unit/junit*.xml
            packages/*/*/.artifacts/unit/junit*.xml
          check_name: "unit results (${{ matrix.settings.name }})"
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-${{ matrix.settings.name }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/*/.artifacts/unit/junit.xml
            packages/*/*/.artifacts/unit/junit.xml

  e2e-build:
    # Build every reusable input in one job: the production workspace exports,
    # then one exact app artifact for each build-time auth composition. Keeping
    # this in one job avoids adding another setup-dominated dependency stage.
    name: e2e reusable builds
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Build dist-resolved workspace packages
        run: >-
          bun turbo build
          --filter=@claxedo/agent-event-runtime
          --filter=@claxedo/agent-extensions
          --filter=@claxedo/agent-sdk-runtime
          --filter=@claxedo/channels
          --filter=@claxedo/connections
          --filter=@claxedo/mcp
          --filter=@claxedo/sandbox-contract
          --filter=@claxedo/sandbox-manager
          --filter=@claxedo/wakes
          --filter=@claxedo/workgraph
          --filter=@claxedo/workspace-relay-protocol
          --filter=@claxedo/workspace-relay
          --filter=@claxedo/workspace-runtime

      - name: Upload reusable workspace dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claxedo-e2e-workspace-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            packages/agent-event-runtime/dist
            packages/agent-extensions/dist
            packages/agent-sdk-runtime/dist
            packages/claxedo-channels/dist
            packages/claxedo-connections/dist
            packages/claxedo-mcp/dist
            packages/sandbox-contract/dist
            packages/sandbox-manager/dist
            packages/wakes/dist
            packages/workgraph/dist
            packages/workspace-relay-protocol/dist
            packages/workspace-relay/dist
            packages/workspace-runtime/dist
          if-no-files-found: error
          retention-days: 1

      # Auth mode is a build-time composition boundary. Upload the first build
      # before the second replaces dist/, and bind each manifest to this commit.
      - name: Build reusable E2E app (test-user)
        working-directory: packages/claxedo-app
        run: bun run build:e2e
        env:
          CLAXEDO_E2E_AUTH_MODE: test-user
          VITE_CLAXEDO_SERVER_URL: http://127.0.0.1:3001

      - name: Upload reusable E2E app (test-user)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claxedo-app-e2e-test-user-${{ github.sha }}-${{ github.run_attempt }}
          path: packages/claxedo-app/dist
          if-no-files-found: error
          retention-days: 1

      - name: Build reusable E2E app (local-unsigned)
        working-directory: packages/claxedo-app
        run: bun run build:e2e
        env:
          CLAXEDO_E2E_AUTH_MODE: local-unsigned
          VITE_CLAXEDO_SERVER_URL: http://127.0.0.1:3001

      - name: Upload reusable E2E app (local-unsigned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claxedo-app-e2e-local-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: packages/claxedo-app/dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    # Six shards per auth mode keep each browser leg bounded while avoiding the
    # old setup-dominated 24-job matrix. Measured on 2026-08-27, the 24 jobs used
    # 109 runner-minutes, with 48 minutes spent before their Playwright steps.
    # The app build is now owned by e2e-build above and reused by every shard.
    name: e2e (linux ${{ matrix.auth-mode }}, ${{ matrix.shard }}/6)
    needs: e2e-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        auth-mode: [test-user, local-unsigned]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      # Test discovery imports the same production dist/ exports as the Vite
      # build. Restore the exact closure produced once by e2e-build.
      - name: Download reusable workspace dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: claxedo-e2e-workspace-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: packages

      - name: Install Playwright Chromium
        working-directory: packages/claxedo-app
        run: npx playwright install chromium

      - name: Download reusable E2E app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: claxedo-app-e2e-${{ matrix.auth-mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: packages/claxedo-app/dist

      # claxedo-app's Playwright suite (packages/claxedo-app/e2e/playwright): the
      # @core-tagged specs run on every PR in these shards. Tier R (real backend +
      # real harness binaries against a scripted model endpoint) runs as the
      # separate `e2e-tier-real` job below. Tier L (live real-credential specs)
      # runs in NO CI lane — it is local/manual only, by design: it needs real
      # provider credentials. Do not describe it as "nightly" here unless a
      # scheduled workflow actually exists.
      - name: Run claxedo-app e2e core suite (${{ matrix.auth-mode }}, shard ${{ matrix.shard }}/6)
        working-directory: packages/claxedo-app
        timeout-minutes: 30
        run: bun run test:e2e:core:base -- --shard=${{ matrix.shard }}/6
        env:
          # Preview the exact auth-mode artifact downloaded above. `preview`
          # refuses to rebuild or serve an artifact whose manifest does not
          # match this mode and commit.
          CLAXEDO_E2E_SERVE_MODE: preview
          # Every watched browser flow runs twice: once with the historical
          # synthetic Test User and once as a loopback visitor with no user.
          # playwright.config.ts owns the corresponding Vite auth composition.
          CLAXEDO_E2E_AUTH_MODE: ${{ matrix.auth-mode }}
          # Videos of passing tests bloat shard artifacts; failures keep theirs.
          PLAYWRIGHT_VIDEO: "0"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-linux-${{ matrix.auth-mode }}-shard${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/claxedo-app/e2e/junit-*.xml
            packages/claxedo-app/e2e/playwright/test-results
            packages/claxedo-app/e2e/playwright/report

  e2e-workgraph:
    name: e2e (workgraph-real, ${{ matrix.auth-mode }})
    strategy:
      fail-fast: false
      matrix:
        auth-mode: [test-user, local-unsigned]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      CLAXEDO_E2E_AUTH_MODE: ${{ matrix.auth-mode }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Build dist-resolved workspace packages
        run: >-
          bun turbo build
          --filter=@claxedo/agent-event-runtime
          --filter=@claxedo/agent-extensions
          --filter=@claxedo/agent-sdk-runtime
          --filter=@claxedo/channels
          --filter=@claxedo/connections
          --filter=@claxedo/mcp
          --filter=@claxedo/sandbox-contract
          --filter=@claxedo/sandbox-manager
          --filter=@claxedo/wakes
          --filter=@claxedo/workgraph
          --filter=@claxedo/workspace-relay-protocol
          --filter=@claxedo/workspace-relay
          --filter=@claxedo/workspace-runtime

      - name: Install Playwright Chromium
        working-directory: packages/claxedo-app
        run: npx playwright install chromium

      - name: Run workgraph-real e2e
        working-directory: packages/claxedo-app
        timeout-minutes: 30
        run: bun run test:e2e:workgraph
        env:
          CLAXEDO_E2E_SERVE_MODE: build-preview

      - name: Run onboarding-enabled e2e
        working-directory: packages/claxedo-app
        timeout-minutes: 15
        run: bun run test:e2e:onboarding
        env:
          CLAXEDO_E2E_SERVE_MODE: build-preview
          PLAYWRIGHT_VIDEO: "0"
          VITE_AUTH_ENABLED: "true"
          VITE_CLAXEDO_SERVER_URL: "http://127.0.0.1:3001"
          VITE_CLAXEDO_E2E: "1"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-workgraph-real-${{ matrix.auth-mode }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/claxedo-app/e2e/playwright/test-results
            packages/claxedo-app/e2e/playwright/report

  # Tier R: real claxedo-server + real embedded engine + real harness binaries,
  # with ONLY the model endpoint scripted (e2e/helpers/scripted-model-server.ts).
  # Its own job for the same reason as e2e-workgraph: the app build bakes
  # VITE_CLAXEDO_SERVER_URL for this lane's backend port (4317), so it cannot
  # share a shard's build. Hermetic — the harness CLIs are installed but never
  # authenticate; the scripted endpoint is the only network the model path sees.
  e2e-tier-real:
    name: e2e (tier-real)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      # The claude/codex CLIs the native-SDK scenarios spawn. No credentials —
      # the scripted endpoint answers everything, so these never authenticate.
      # The ACP scenarios use the workspace's own @agentclientprotocol wrapper
      # packages (already installed by bun install above).
      - name: Install harness CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Build dist-resolved workspace packages
        run: >-
          bun turbo build
          --filter=@claxedo/agent-event-runtime
          --filter=@claxedo/agent-extensions
          --filter=@claxedo/agent-sdk-runtime
          --filter=@claxedo/channels
          --filter=@claxedo/connections
          --filter=@claxedo/mcp
          --filter=@claxedo/sandbox-contract
          --filter=@claxedo/sandbox-manager
          --filter=@claxedo/wakes
          --filter=@claxedo/workgraph
          --filter=@claxedo/workspace-relay-protocol
          --filter=@claxedo/workspace-relay
          --filter=@claxedo/workspace-runtime

      # The embedded engine is a BUILT artifact: claxedo-server loads it via
      # opencode/node-embed -> packages/opencode/dist/node/node.js, which is
      # gitignored — a fresh runner has no engine, the server's engine surface
      # never comes up, and the opencode scenario dies at its first
      # engine-dependent assertion (the scripted model absent from the picker,
      # because the model catalog is served by the engine). Local runs never
      # hit this because a dev machine has a dist/node from earlier work.
      # build:node, never bare `build`: the full build target deletes
      # dist/node and strips node-pty from package.json as a side effect.
      - name: Build embedded engine (node)
        working-directory: packages/opencode
        run: bun run build:node

      - name: Install Playwright Chromium
        working-directory: packages/claxedo-app
        run: npx playwright install chromium

      - name: Build tier-real E2E app once
        working-directory: packages/claxedo-app
        run: bun run build:e2e
        env:
          VITE_CLAXEDO_SERVER_URL: http://127.0.0.1:4317

      # One Playwright invocation PER SCENARIO. The cross-scenario coupling is
      # FIXED (seedDefaultHarness makes hydration and the UI switch agree; full
      # runs are reproducible), but per-scenario isolation stays: it is the
      # configuration every scenario was verified under, and it means one red
      # scenario names itself instead of poisoning the run.
      #
      # ALL SIX SCENARIOS ARE ON THE GATE. There is no known-red list any more:
      # every defect the tier surfaced has been fixed and its scenario
      # graduated, which was always the point — a blocking job that is red on
      # every PR for known reasons trains people to ignore it, so a defect
      # graduating to the gate is the definition of fixed.
      #
      # What the tier caught, in the order the scenarios graduated:
      #   codex-acp    — the scripted endpoint now streams the full output_text
      #                  delta sequence, the only shape that makes `codex
      #                  app-server` emit the `item/agentMessage/delta` the ACP
      #                  wrapper converts to assistant text.
      #   opencode     — a reply arriving under two ids rendered as two
      #                  messages (client store, `assistantTurnIndex`), and the
      #                  scenario had been silently running on the anthropic
      #                  default rather than the scripted model — caught only by
      #                  the per-dialect counters.
      #   claude-sdk   — the session busy lock was released when the drain
      #                  finished rather than when the turn settled, so a prompt
      #                  arriving inside that ~515ms tail was refused with
      #                  "Session is already processing a message". One run
      #                  missed the release by a millisecond.
      #
      # Per-scenario invocation stays regardless: it is the configuration every
      # scenario was verified under, and it means one red scenario names itself
      # instead of poisoning the run.
      - name: Run tier-real e2e (gate — all scenarios)
        working-directory: packages/claxedo-app
        timeout-minutes: 30
        env:
          CLAXEDO_E2E_SERVE_MODE: preview
          PLAYWRIGHT_VIDEO: "0"
        run: |
          set -euo pipefail
          # The step above builds once. Each isolated Playwright invocation
          # starts a preview of that same verified artifact without rebuilding.
          for scenario in "behaviors 1,6,9" "behaviors 2,6,8,9" "behaviors 3,6,8,9" "behaviors 4,6,8,9" "behaviors 5,6,8,9" "behavior 7"; do
            echo "=== Tier R gate scenario: ${scenario} ==="
            bun run test:e2e:real -- --grep "${scenario}"
          done

      # These specs own their real hosted-node/relay fixtures and production
      # web builds, so the config-level webServer must stay disabled. Run them
      # together on one worker: their fixed port blocks and output directories
      # are distinct, but serial execution avoids concurrent Vite builds
      # starving the 4-vCPU runner and keeps one combined Playwright report.
      - name: Run signed web relay e2e (cloud + user-hosted)
        working-directory: packages/claxedo-app
        timeout-minutes: 60
        env:
          CLAXEDO_E2E_SUITE: core
          CLAXEDO_TIER_REAL_E2E: "1"
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_VIDEO: "0"
        run: >-
          npx playwright test
          --config playwright.config.ts
          e2e/playwright/web-signed-cloud.spec.ts
          e2e/playwright/web-signed-userhosted.spec.ts
          --workers=1

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-tier-real-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/claxedo-app/e2e/playwright/test-results
            packages/claxedo-app/e2e/playwright/report

  # `desktop-unsigned-embedded` (Phase 2 of docs/plans/2026-08-06-001-test-full-
  # matrix-real-e2e-plan.md): the ONLY lane that runs the PACKAGED Electron app,
  # whose renderer is a `file://` document. Every other job in this file points
  # a browser at an `http://localhost` dev/preview server, where
  # `window.location.protocol` is `https?:` and the whole `file://` bug class
  # (four defects shipped to users in v0.0.65 -- see the plan's coverage table)
  # is structurally undetectable. This job is what closes that hole.
  #
  # macOS-only, and that is an accepted gap, not an oversight: the `file://`
  # defect class follows from `win.loadFile()` vs `win.loadURL()` in
  # packages/claxedo-desktop/src/main/windows.ts:177-186, which every platform
  # shares -- it is not a macOS-specific code path -- so a mac-only lane still
  # catches all four shipped defects (1, 3, 4 directly; 5/6 via the D2
  # scenario). Linux would need `xvfb-run` in front of the packaged binary,
  # the same way release-gates.yml's packaged diagnostics smoke already does
  # for Linux; that is a follow-up, not required to close the gap this job
  # exists for.
  e2e-desktop:
    name: e2e (desktop packaged lifecycle)
    runs-on: macos-15
    env:
      # electron-vite runs under Node, whose default ~2GB old-space does not
      # fit the renderer bundle -- this is the SAME OOM release-claxedo.yml's
      # mac legs hit ("both OOM-killed in the first v0.0.65 build"; see its
      # identical job-level NODE_OPTIONS and comment). Job-level, not
      # step-level: `bun run build` here is `scripts/build.ts`, which spawns
      # its own rebuild as a child process, and release-claxedo.yml's comment
      # records that a step-level var did not reach that child -- the OOM
      # just moved there.
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the other e2e jobs' pin in this file (Playwright 1.59 hangs
          # extracting Chromium under 24.16). This job never extracts a
          # Playwright browser (see the "Run desktop e2e" step below), but
          # there is no reason to diverge from the version every other e2e job
          # here already runs on.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      # The packaged desktop matrix exercises the real Claude harness through
      # a scripted endpoint. The CLI must be present even though the scenario
      # does not require user credentials.
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.150

      # Same scoped list as the e2e/e2e-workgraph/e2e-tier-real jobs above --
      # packages/*/dist is gitignored and the desktop build resolves these
      # @claxedo/* workspace packages through their dist exports.
      - name: Build dist-resolved workspace packages
        run: >-
          bun turbo build
          --filter=@claxedo/agent-event-runtime
          --filter=@claxedo/agent-extensions
          --filter=@claxedo/agent-sdk-runtime
          --filter=@claxedo/channels
          --filter=@claxedo/connections
          --filter=@claxedo/mcp
          --filter=@claxedo/sandbox-contract
          --filter=@claxedo/sandbox-manager
          --filter=@claxedo/wakes
          --filter=@claxedo/workgraph
          --filter=@claxedo/workspace-relay-protocol
          --filter=@claxedo/workspace-relay
          --filter=@claxedo/workspace-runtime

      # The signed desktop fixtures launch claxedo-server under Node. Its
      # self-hosted composition imports @claxedo/local-server's production
      # export, which is dist/self-hosted-execution.js (the `bun` condition
      # points at source only for Bun-owned entrypoints). Build that canonical
      # package artifact before Playwright starts; a fresh checkout has no
      # ignored dist/ tree to resolve incidentally.
      - name: Build local-server fixture export
        run: bun run --cwd packages/claxedo-local-server build

      # Builds the signed-capable packaged app ONCE for the whole job; every
      # unsigned scenario in desktop-unsigned-embedded.spec.ts launches a fresh process from this
      # same binary (e2e/helpers/electron-app.ts's launchPackagedApp), not a
      # fresh build. `--dir` skips DMG assembly and notarisation (the full
      # `package:mac` path is ~5 min / 1.4 GB) while still producing an
      # asar-packed app whose renderer loads over `file://` -- asar is never
      # disabled in electron-builder.config.ts, so packing, and therefore the
      # bug class this lane exists to catch, is independent of the --dir
      # target. This is the exact command electron-app.ts's own GATING error
      # names when no packaged binary is found. Measured 2026-08-06: 42s / 403 MB.
      - name: Build packaged desktop app (--dir, signed-capable)
        working-directory: packages/claxedo-desktop
        env:
          VITE_AUTH_ENABLED: "true"
        run: |
          bun run build
          npx electron-builder --dir --config electron-builder.config.ts

      # No Playwright browser install here, unlike every e2e job above: this
      # spec's only Playwright entry point is `_electron.launch()`
      # (e2e/helpers/electron-app.ts), which drives the packaged binary's OWN
      # bundled Chromium and never touches Playwright's `page`/`context`/
      # `browser` fixtures or a downloaded browser. `test:e2e:core:base`'s
      # `--grep-invert "@workgraph-real|@tier-real"` already carves this spec
      # (tagged `@tier-real @surface-desktop`) out of the sharded PR lane, so
      # it only ever runs here.
      - name: Run desktop e2e (unsigned startup and embedded execution)
        working-directory: packages/claxedo-app
        timeout-minutes: 30
        env:
          # No web app is under test in this lane -- the packaged renderer is
          # its own file:// document talking to its own embedded server -- so
          # playwright.config.ts's default webServer (`bun run dev`) would
          # boot a vite dev server that nothing in this spec ever navigates
          # to. Skip it rather than pay for it.
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_VIDEO: "0"
        run: bun run test:e2e:desktop

      - name: Run desktop e2e (signed account and Host Connector lifecycle)
        working-directory: packages/claxedo-app
        timeout-minutes: 30
        env:
          PLAYWRIGHT_VIDEO: "0"
        run: bun run test:e2e:desktop:real

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-desktop-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/claxedo-app/e2e/playwright/test-results
            packages/claxedo-app/e2e/playwright/report

  e2e-workgraph-journey:
    name: e2e (workgraph-journey)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Build dist-resolved workspace packages
        run: >-
          bun turbo build
          --filter=@claxedo/agent-event-runtime
          --filter=@claxedo/agent-extensions
          --filter=@claxedo/agent-sdk-runtime
          --filter=@claxedo/channels
          --filter=@claxedo/connections
          --filter=@claxedo/mcp
          --filter=@claxedo/sandbox-contract
          --filter=@claxedo/sandbox-manager
          --filter=@claxedo/wakes
          --filter=@claxedo/workgraph
          --filter=@claxedo/workspace-relay-protocol
          --filter=@claxedo/workspace-relay
          --filter=@claxedo/workspace-runtime

      - name: Run headless WorkGraph journey
        working-directory: packages/claxedo-app
        timeout-minutes: 30
        run: bun run test:e2e:journey
