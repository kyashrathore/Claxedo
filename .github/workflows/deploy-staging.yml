name: deploy-staging

# Everything merged to `staging` ships from here: control plane, relay, sandbox
# image. The browser app is not a job — the control-plane deploy publishes it
# (deploy-user-cloudflare.ts). The desktop app is not either — it is
# tag-driven (`claxedo-v*` -> release-claxedo.yml).

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      components:
        description: "Component to (re)deploy"
        required: false
        default: all
        type: choice
        options:
          - all
          - control-plane
          - relay
          - sandbox-image

# Shared with deploy-claxedo-app-staging.yml: one Claxedo cloud deploy at a
# time, and a queued run waits rather than being cancelled mid-deploy.
concurrency:
  group: claxedo-cloud-deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  plan:
    name: select components
    runs-on: ubuntu-latest
    # The sandbox driver is a staging environment variable, readable only from
    # a job bound to that environment.
    environment: staging
    outputs:
      control_plane: ${{ steps.select.outputs.control_plane }}
      relay: ${{ steps.select.outputs.relay }}
      sandbox_image: ${{ steps.select.outputs.sandbox_image }}
      boat_image: ${{ steps.select.outputs.boat_image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # The repository's changed-file policy owns which surfaces a diff reaches;
      # `sandbox_image` is one of its outputs. A dispatch has no base commit, so
      # it selects the ~4.5 GB image build — pick one component by name to avoid
      # that.
      - name: Select affected surfaces
        id: changed
        uses: ./.github/actions/detect-ci-changes
        with:
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          force-full: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Select components
        id: select
        env:
          REQUESTED: ${{ inputs.components || 'all' }}
          SANDBOX_CHANGED: ${{ steps.changed.outputs.sandbox_image }}
          SANDBOX_DRIVER: ${{ vars.CLAXEDO_STAGING_SANDBOX_DRIVER }}
        run: node script/deploy-components.mjs

  gate:
    name: lint, typecheck, CI policy, architecture ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # typecheck.yml runs these same commands behind the affected-surface
      # selector. A deploy gate takes the whole repository instead: the branch
      # being released is what has to be green, not the diff that reached it.
      # Type-aware lint resolves @claxedo/* through dist/ for files outside a
      # tsconfig; see typecheck.yml.
      - name: Build dist-resolved workspace packages
        run: bun run build:packages

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun typecheck

      - name: Run CI gate-selection policy tests
        run: bun run test:ci-policy

      - name: Run architecture ratchets
        run: bun run test:architecture-ratchets

  unit:
    name: CI suite
    uses: ./.github/workflows/test.yml
    with:
      linux-unit-only: true
    secrets: inherit

  # A Boat control plane starts sandboxes from CLAXEDO_SANDBOX_IMAGE, so it
  # deploys with the image this checkout builds. The tag is content-addressed:
  # a registry that holds it holds this build, and only a missing one is pushed.
  boat-image:
    name: boat sandbox image
    needs: [plan, gate, unit]
    if: ${{ !cancelled() && needs.plan.outputs.boat_image == 'true' && needs.gate.result == 'success' && needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Build sandbox packages
        run: bun run build:packages

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Publish the image this checkout builds
        id: publish
        run: |
          set -euo pipefail
          bun run --cwd packages/claxedo-server sandbox:image --agent-plugins --push-if-missing
          echo "image=$(jq -r .imageTag packages/claxedo-server/scripts/sandbox/.build/build-info.json)" >> "$GITHUB_OUTPUT"

  control-plane:
    name: control plane (Better Auth + D1)
    needs: [plan, gate, unit, boat-image]
    if: ${{ !cancelled() && needs.plan.outputs.control_plane == 'true' && needs.gate.result == 'success' && needs.unit.result == 'success' && (needs.plan.outputs.boat_image != 'true' || needs.boat-image.result == 'success') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CLAXEDO_AUTH_INTROSPECTION_SECRET: ${{ secrets.CLAXEDO_AUTH_INTROSPECTION_SECRET }}
      # Staging keeps the Worker names its Durable Object namespace and custom
      # domains already live on.
      CLAXEDO_WORKER_NAME: claxedo-user-deployed-locked-staging
      CLAXEDO_APP_WORKER_NAME: claxedo-user-deployed-app-staging
      # The relay's staging environment binds SESSION_HOST to this script name.
      CLAXEDO_SESSION_HOST_WORKER_NAME: claxedo-session-host-staging
      CLAXEDO_AGENT_PLUGINS_BUCKET: claxedo-agent-plugins-staging
      CLAXEDO_SANDBOX_POSTURE: full-hosted
      CLAXEDO_SANDBOX_DRIVER: ${{ vars.CLAXEDO_STAGING_SANDBOX_DRIVER }}
      CLAXEDO_AUTH_METHODS: ${{ vars.CLAXEDO_AUTH_METHODS }}
      GITHUB_CLIENT_ID: ${{ vars.CLAXEDO_GITHUB_CLIENT_ID }}
      # The GitHub App the GitHub connection's device sign-in runs on. Optional:
      # unset, staging connects GitHub by pasted token only.
      CLAXEDO_INTEGRATION_GITHUB_CLIENT_ID: ${{ vars.CLAXEDO_INTEGRATION_GITHUB_CLIENT_ID }}
      CLAXEDO_INTEGRATION_GITHUB_CLIENT_SECRET: ${{ secrets.CLAXEDO_INTEGRATION_GITHUB_CLIENT_SECRET }}
      # Product telemetry. Unset or `off`, the Worker sends nothing; `on`
      # requires the PostHog project key.
      CLAXEDO_TELEMETRY_MODE: ${{ vars.CLAXEDO_STAGING_TELEMETRY_MODE }}
      CLAXEDO_POSTHOG_HOST: ${{ vars.CLAXEDO_STAGING_POSTHOG_HOST }}
      CLAXEDO_POSTHOG_KEY: ${{ secrets.CLAXEDO_POSTHOG_KEY }}
      CLAXEDO_USER_DEPLOYED_ORGANIZATION_ID: ${{ vars.CLAXEDO_USER_DEPLOYED_ORGANIZATION_ID }}
      CLAXEDO_USER_DEPLOYED_ORGANIZATION_NAME: ${{ vars.CLAXEDO_USER_DEPLOYED_ORGANIZATION_NAME }}
      CLAXEDO_DEPLOYMENT_ID: ${{ vars.CLAXEDO_STAGING_DEPLOYMENT_ID }}
      CLAXEDO_API_ORIGIN: ${{ vars.CLAXEDO_STAGING_API_ORIGIN }}
      CLAXEDO_APP_ORIGIN: ${{ vars.CLAXEDO_STAGING_APP_ORIGIN }}
      CLAXEDO_WORKSPACE_RELAY_URL: ${{ vars.CLAXEDO_STAGING_WORKSPACE_RELAY_URL }}
      CLAXEDO_AUTH_D1_DATABASE_NAME: ${{ vars.CLAXEDO_STAGING_AUTH_D1_DATABASE_NAME }}
      CLAXEDO_CONTROL_PLANE_D1_DATABASE_NAME: ${{ vars.CLAXEDO_STAGING_CONTROL_PLANE_D1_DATABASE_NAME }}
      CLAXEDO_SANDBOX_WORKER_URL: ${{ vars.CLAXEDO_STAGING_SANDBOX_DRIVER == 'cloudflare' && vars.CLAXEDO_STAGING_SANDBOX_WORKER_URL || '' }}
      CLOUDFLARE_SANDBOX_IDLE_STOP_TOKEN: ${{ vars.CLAXEDO_STAGING_SANDBOX_DRIVER == 'cloudflare' && secrets.CLAXEDO_SANDBOX_IDLE_STOP_TOKEN || '' }}
      CLOUDFLARE_SANDBOX_API_TOKEN: ${{ vars.CLAXEDO_STAGING_SANDBOX_DRIVER == 'cloudflare' && secrets.CLOUDFLARE_SANDBOX_API_TOKEN || '' }}
      CLAXEDO_SANDBOX_IMAGE: ${{ needs.boat-image.outputs.image }}
      BOAT_API_KEY: ${{ vars.CLAXEDO_STAGING_SANDBOX_DRIVER == 'boat' && secrets.BOAT_API_KEY || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Verify the deploy inputs are configured
        run: |
          set -euo pipefail
          case "$CLAXEDO_SANDBOX_DRIVER" in
            cloudflare) driver_inputs="CLAXEDO_SANDBOX_WORKER_URL CLOUDFLARE_SANDBOX_IDLE_STOP_TOKEN" ;;
            boat) driver_inputs="CLAXEDO_SANDBOX_IMAGE BOAT_API_KEY" ;;
            *) echo "::error::CLAXEDO_STAGING_SANDBOX_DRIVER must be set to cloudflare or boat in the staging environment (got '$CLAXEDO_SANDBOX_DRIVER')"; exit 1 ;;
          esac
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETTER_AUTH_SECRET \
            CLAXEDO_AUTH_INTROSPECTION_SECRET CLAXEDO_AUTH_METHODS GITHUB_CLIENT_ID \
            CLAXEDO_USER_DEPLOYED_ORGANIZATION_ID CLAXEDO_USER_DEPLOYED_ORGANIZATION_NAME \
            CLAXEDO_DEPLOYMENT_ID CLAXEDO_API_ORIGIN CLAXEDO_APP_ORIGIN CLAXEDO_WORKSPACE_RELAY_URL \
            CLAXEDO_AUTH_D1_DATABASE_NAME CLAXEDO_CONTROL_PLANE_D1_DATABASE_NAME $driver_inputs; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured in the staging environment"; exit 1; }
          done

      # The deploy builds the browser app, which consumes the @claxedo
      # workspace packages as their published dist (script/published-exports-plugin.ts).
      # A fresh checkout has none, and Vite fails to resolve @claxedo/helpers.
      - name: Build dist-resolved workspace packages
        run: bun run build:packages

      - name: Print the deploy plan and bundle the Worker offline
        working-directory: packages/claxedo-server
        run: bun run deploy:user-cloudflare -- --agent-plugins --dry-run

      - name: Deploy the control plane and the app
        working-directory: packages/claxedo-server
        run: bun run deploy:user-cloudflare -- --agent-plugins

  # The relay is the Durable Object Worker (packages/workspace-relay/src/worker.ts)
  # that the control plane's CLAXEDO_WORKSPACE_RELAY_URL names.
  relay:
    name: workspace relay (Cloudflare Durable Object)
    needs: [plan, gate, unit, control-plane]
    if: ${{ !cancelled() && needs.plan.outputs.relay == 'true' && needs.gate.result == 'success' && needs.unit.result == 'success' && needs.control-plane.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLAXEDO_RELAY_WORKER_NAME: ${{ vars.CLAXEDO_STAGING_RELAY_WORKER_NAME }}
      CLAXEDO_RELAY_URL: ${{ vars.CLAXEDO_STAGING_WORKSPACE_RELAY_URL }}
      CLAXEDO_RELAY_CENTRAL_URL: ${{ vars.CLAXEDO_STAGING_API_ORIGIN }}
      CLAXEDO_RELAY_APP_ORIGINS: ${{ vars.CLAXEDO_STAGING_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Verify the relay inputs are configured
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLAXEDO_RELAY_WORKER_NAME \
            CLAXEDO_RELAY_URL CLAXEDO_RELAY_CENTRAL_URL CLAXEDO_RELAY_APP_ORIGINS; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured in the staging environment"; exit 1; }
          done

      # wrangler bundles the worker, which imports @claxedo/* through their
      # published dist. A fresh checkout has none, so the bundle cannot resolve
      # @claxedo/helpers/string.
      - name: Build dist-resolved workspace packages
        run: bun run build:packages

      - name: Deploy the relay Worker
        working-directory: packages/workspace-relay
        run: ./node_modules/.bin/tsx scripts/deploy-cloudflare.ts

  sandbox-image:
    name: cloudflare sandbox worker
    needs: [plan, gate, unit, control-plane, relay]
    if: ${{ !cancelled() && needs.plan.outputs.sandbox_image == 'true' && needs.gate.result == 'success' && needs.unit.result == 'success' && needs.control-plane.result != 'failure' && needs.relay.result != 'failure' }}
    uses: ./.github/workflows/deploy-cloudflare-sandbox-worker.yml
    with:
      deploy_worker: true
      agent_plugins: true
    secrets: inherit

  result:
    name: staging deploy result
    if: always()
    needs: [plan, gate, unit, boat-image, control-plane, relay, sandbox-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected component to have deployed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          CONTROL_PLANE_SELECTED: ${{ needs.plan.outputs.control_plane }}
          CONTROL_PLANE_RESULT: ${{ needs.control-plane.result }}
          RELAY_SELECTED: ${{ needs.plan.outputs.relay }}
          RELAY_RESULT: ${{ needs.relay.result }}
          SANDBOX_SELECTED: ${{ needs.plan.outputs.sandbox_image }}
          SANDBOX_RESULT: ${{ needs.sandbox-image.result }}
          BOAT_IMAGE_SELECTED: ${{ needs.plan.outputs.boat_image }}
          BOAT_IMAGE_RESULT: ${{ needs.boat-image.result }}
        run: |
          set -uo pipefail
          failed=0
          require() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 concluded: $2"
              failed=1
            fi
          }
          require "Component selection" "$PLAN_RESULT"
          require "Lint/typecheck/ratchets gate" "$GATE_RESULT"
          require "CI suite" "$UNIT_RESULT"
          [ "$CONTROL_PLANE_SELECTED" = "true" ] && require "Control plane" "$CONTROL_PLANE_RESULT"
          [ "$RELAY_SELECTED" = "true" ] && require "Relay" "$RELAY_RESULT"
          [ "$SANDBOX_SELECTED" = "true" ] && require "Sandbox image" "$SANDBOX_RESULT"
          [ "$BOAT_IMAGE_SELECTED" = "true" ] && require "Boat sandbox image" "$BOAT_IMAGE_RESULT"
          exit "$failed"
