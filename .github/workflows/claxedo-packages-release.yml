name: claxedo-packages-release

# Publishes the public `@claxedo/*` packages at the versions the repo declares.
#
# One publisher: packages/claxedo-server/scripts/release/publish-claxedo-packages.ts.
# It reads each version from its package.json (a release is a reviewed
# version-bump commit, never a number typed into a form), materializes the
# repo's `workspace:*` sibling pins into exact versions only inside the packed
# tarball, and refuses to run while any already-published version has
# unreleased changes behind it (check-published-versions.ts).
#
# On every push to `dev` and every PR that touches a public package or the
# release tooling, the dry-run job builds, packs and inspects every tarball —
# the same gates the publish runs — without publishing anything.

on:
  push:
    branches:
      - dev
    paths:
      - "packages/agent-event-runtime/**"
      - "packages/agent-runtime-contract/**"
      - "packages/agent-sdk-runtime/**"
      - "packages/claxedo-channels/**"
      - "packages/claxedo-connections/**"
      - "packages/claxedo-helpers/**"
      - "packages/cli/**"
      - "packages/sandbox-contract/**"
      - "packages/sandbox-manager/**"
      - "packages/wakes/**"
      - "packages/workspace-relay-protocol/**"
      - "packages/workspace-relay/**"
      - "packages/workspace-runtime/**"
      - "packages/claxedo-server/scripts/release/**"
      - ".github/workflows/claxedo-packages-release.yml"
  pull_request:
    paths:
      - "packages/agent-event-runtime/**"
      - "packages/agent-runtime-contract/**"
      - "packages/agent-sdk-runtime/**"
      - "packages/claxedo-channels/**"
      - "packages/claxedo-connections/**"
      - "packages/claxedo-helpers/**"
      - "packages/cli/**"
      - "packages/sandbox-contract/**"
      - "packages/sandbox-manager/**"
      - "packages/wakes/**"
      - "packages/workspace-relay-protocol/**"
      - "packages/workspace-relay/**"
      - "packages/workspace-runtime/**"
      - "packages/claxedo-server/scripts/release/**"
      - ".github/workflows/claxedo-packages-release.yml"
  workflow_dispatch:
    inputs:
      track:
        description: "Which packages to publish"
        required: false
        default: all
        type: choice
        options:
          - all # every public @claxedo/* package
          - helpers # helpers
          - runtime # agent-runtime-contract, workspace-relay-protocol, sandbox-contract, agent-event-runtime, sandbox-manager, agent-sdk-runtime, workspace-relay, workspace-runtime
          - apps # channels, connections
          - wakes
          - cli # cli
      npm_tag:
        description: "npm dist-tag"
        required: false
        default: latest
        type: string
      dry_run:
        description: "Run every gate but do not publish"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  dry-run:
    name: publish dry run
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # check-published-versions.ts walks history for the commit that set
          # each package's version.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # The cli bundles the private @claxedo/host-connector, which the publisher
      # never builds, and esbuild resolves it through dist/.
      - name: Build dist-resolved workspace packages
        run: bun run build:packages

      - name: Unit-test the release tooling
        working-directory: packages/claxedo-server
        run: node ./node_modules/vitest/vitest.mjs run scripts/release/tests

      - name: Build, pack and inspect every tarball
        working-directory: packages/claxedo-server
        run: bun run release:packages --track all --dry-run

  publish:
    name: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          scope: "@claxedo"

      - name: Build dist-resolved workspace packages
        run: bun run build:packages

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          bun run --cwd packages/claxedo-server release:packages
          --track "${{ inputs.track }}"
          --tag "${{ inputs.npm_tag }}"
          ${{ inputs.dry_run && '--dry-run' || '' }}
