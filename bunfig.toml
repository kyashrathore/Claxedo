[install]
exact = true
# Only install newly resolved package versions published at least 3 days ago.
# This gate protects *adoption* of a brand-new (possibly compromised) version.
# It is deliberately NOT applied to release builds: release-claxedo.yml installs
# with `--frozen-lockfile --minimum-release-age=0`, because a tag build adopts
# nothing new -- it rebuilds the exact, already-reviewed, integrity-hashed graph
# in bun.lock. Age-gating there adds no protection and makes releases fail based
# on wall-clock time (claxedo-v0.0.63 died exactly this way: electron@43.2.0 was
# 2.57 days old, 10h short of the 3-day cutoff).
minimumReleaseAge = 259200
# electron: exact-pinned and integrity-hashed in bun.lock, and its releases are
# overwhelmingly Chromium security rollups -- delaying adoption by 3 days trades
# a *certain* known-CVE exposure window for a hypothetical supply-chain one. Its
# whole toolchain (electron-builder, app-builder-lib, dmg-builder,
# electron-publish) is already excluded below; `electron` itself was an
# oversight. Bump ONLY by editing the exact pin, which is a reviewed change.
# tokentracker-cli: exact-pinned + security-audited (see claxedo-server
# src/server-usage-limits.ts header); it publishes ~daily so the age gate would
# always lag the audited pin. Bump ONLY to a re-audited version (tarball-diff
# against the previous pin).
# @claxedo/* is first-party: we trust our own publishes and launch-day
# releases must be installable immediately, not after the cooldown.
# solid-js/@solidjs/*: the session-app package (dual-target slice) rides the
# Solid 2.0 release-candidate line by owner decision (docs/plans/
# native-sdk-port/03, U11). RCs are re-published faster than the cooldown;
# versions stay exact-pinned in that package, so adoption is still a reviewed
# diff — the age gate only ever delayed the pinned RC we already chose.
minimumReleaseAgeExcludes = ["@claxedo/*", "solid-js", "@solidjs/web", "@solidjs/vite-plugin", "@solidjs/signals", "babel-preset-solid", "babel-plugin-jsx-dom-expressions", "dom-expressions", "@dom-expressions/*", "@dom-expressions/babel-plugin-jsx", "electron", "tokentracker-cli", "@ai-sdk/amazon-bedrock", "@ai-sdk/anthropic", "@agentclientprotocol/sdk", "@opentui/core", "@opentui/core-darwin-arm64", "@opentui/core-darwin-x64", "@opentui/core-linux-arm64", "@opentui/core-linux-arm64-musl", "@opentui/core-linux-x64", "@opentui/core-linux-x64-musl", "@opentui/core-win32-arm64", "@opentui/core-win32-x64", "@opentui/keymap", "@opentui/solid", "opentui-spinner", "gitlab-ai-provider", "opencode-gitlab-auth", "@ff-labs/fff-node", "@ff-labs/fff-bun", "@ff-labs/fff-bin-darwin-arm64", "@ff-labs/fff-bin-darwin-x64", "@ff-labs/fff-bin-linux-arm64-gnu", "@ff-labs/fff-bin-linux-arm64-musl", "@ff-labs/fff-bin-linux-x64-gnu", "@ff-labs/fff-bin-linux-x64-musl", "@ff-labs/fff-bin-win32-arm64", "@ff-labs/fff-bin-win32-x64", "@pierre/diffs", "@pierre/theming", "app-builder-lib", "dmg-builder", "electron-builder", "electron-publish"]

[test]
root = "./do-not-run-tests-from-root"
