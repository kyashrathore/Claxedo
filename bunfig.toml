[install]
exact = true
# Only install newly resolved package versions published at least 3 days ago.
# This gate protects *adoption* of a brand-new (possibly compromised) version.
# It is deliberately NOT applied to release builds: release-claxedo.yml installs
# with `--frozen-lockfile --minimum-release-age=0`, because a tag build adopts
# nothing new -- it rebuilds the exact, already-reviewed, integrity-hashed graph
# in bun.lock. Age-gating there adds no protection and makes releases fail based
# on wall-clock time (claxedo-v0.0.63 died exactly this way: electron@43.2.0 was
# 2.57 days old, 10h short of the 3-day cutoff).
minimumReleaseAge = 259200
# electron: exact-pinned and integrity-hashed in bun.lock, and its releases are
# overwhelmingly Chromium security rollups -- delaying adoption by 3 days trades
# a *certain* known-CVE exposure window for a hypothetical supply-chain one. Its
# whole toolchain (electron-builder, app-builder-lib, dmg-builder,
# electron-publish) is already excluded below; `electron` itself was an
# oversight. Bump ONLY by editing the exact pin, which is a reviewed change.
# tokentracker-cli: exact-pinned + security-audited; it publishes ~daily so the
# age gate would always lag the audited pin. Library-only — its CLI paths carry
# an `npx --yes` self-update and a localhost dashboard that must not ship. The
# full constraints, including which credential files its limits probe rewrites,
# are in claxedo-local-server's token-tracker-usage-limits.ts. Bump ONLY to a
# re-audited version (tarball-diff against the previous pin).
# Harness SDKs and CLIs (ACP SDK, Claude Agent SDK, Codex, Cursor SDK, and the
# per-platform packages each publishes in the same release): their releases
# carry the protocol changes Claxedo must track the day they ship, so the owner
# exempted them on 2026-09-30. Codex's platform binaries are versions of
# `@openai/codex` itself. Pi (pi-durable, its pi-ai model and pi-mcp clients,
# chord, and pi-telemetry, which pi-ai requires) joined on 2026-10-03: Pi runs
# in process on pi-durable, so its releases are the harness itself. Bump ONLY
# by editing the exact pin.
# @claxedo/* is first-party: we trust our own publishes and launch-day
# releases must be installable immediately, not after the cooldown.
minimumReleaseAgeExcludes = ["@claxedo/*", "electron", "tokentracker-cli", "@ai-sdk/amazon-bedrock", "@ai-sdk/anthropic", "@agentclientprotocol/sdk", "@anthropic-ai/claude-agent-sdk", "@anthropic-ai/claude-agent-sdk-darwin-arm64", "@anthropic-ai/claude-agent-sdk-darwin-x64", "@anthropic-ai/claude-agent-sdk-linux-arm64", "@anthropic-ai/claude-agent-sdk-linux-arm64-musl", "@anthropic-ai/claude-agent-sdk-linux-x64", "@anthropic-ai/claude-agent-sdk-linux-x64-musl", "@anthropic-ai/claude-agent-sdk-win32-arm64", "@anthropic-ai/claude-agent-sdk-win32-x64", "@openai/codex", "@earendil-works/pi-durable", "@earendil-works/pi-ai", "@earendil-works/pi-mcp", "@earendil-works/chord", "@earendil-works/pi-telemetry", "@cursor/sdk", "@cursor/sdk-darwin-arm64", "@cursor/sdk-darwin-x64", "@cursor/sdk-linux-arm64", "@cursor/sdk-linux-x64", "@cursor/sdk-win32-x64", "@opentui/core", "@opentui/core-darwin-arm64", "@opentui/core-darwin-x64", "@opentui/core-linux-arm64", "@opentui/core-linux-arm64-musl", "@opentui/core-linux-x64", "@opentui/core-linux-x64-musl", "@opentui/core-win32-arm64", "@opentui/core-win32-x64", "gitlab-ai-provider", "opencode-gitlab-auth", "@ff-labs/fff-node", "@ff-labs/fff-bun", "@ff-labs/fff-bin-darwin-arm64", "@ff-labs/fff-bin-darwin-x64", "@ff-labs/fff-bin-linux-arm64-gnu", "@ff-labs/fff-bin-linux-arm64-musl", "@ff-labs/fff-bin-linux-x64-gnu", "@ff-labs/fff-bin-linux-x64-musl", "@ff-labs/fff-bin-win32-arm64", "@ff-labs/fff-bin-win32-x64", "@pierre/diffs", "@pierre/theming", "app-builder-lib", "dmg-builder", "electron-builder", "electron-publish"]

[test]
root = "./do-not-run-tests-from-root"
