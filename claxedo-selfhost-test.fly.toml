# Generated by `claxedo deploy`. Safe to edit and re-deploy with:
#   fly deploy -c claxedo-selfhost-test.fly.toml
app = "claxedo-selfhost-test"
primary_region = "sin"

[build]
  dockerfile = "packages/claxedo-server/Dockerfile"

[env]
  CLAXEDO_SERVER_HOST = "0.0.0.0"
  CLAXEDO_SERVER_PORT = "3001"
  CLAXEDO_DATA_DIR = "/data"

[mounts]
  source = "claxedo_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/claxedo/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
