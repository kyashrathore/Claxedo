<html lang="en">

<style>
:root{color-scheme:dark;--bg:#111110;--side:#151514;--raised:#1c1c1a;--line:#292927;--muted:#92928a;--text:#deded8;--strong:#f4f4ed;--green:#a5c9ad;--amber:#dfbf83;--red:#df9b92}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 10px}button:hover{background:#262624}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}a{color:inherit}h1,h2,h3,p{margin:0}h1{font-size:25px;font-weight:550;letter-spacing:-.7px}h2{font-size:16px;font-weight:550}h3{font-size:12px;font-weight:500;color:var(--muted)}.muted{color:var(--muted)}.small{font-size:11px}.mono{font-variant-numeric:tabular-nums}.primary{background:#e4e4db;color:#20201d;border-color:#e4e4db;font-weight:550}.primary:hover{background:#fafaf1}.outline{border-color:#3a3a35}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.spacer{flex:1}.icon{width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.review{height:34px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:9px;font-size:11px;color:var(--muted);background:#191a17}.review b{color:#becbb5;font-weight:500}.review button{font-size:11px;padding:3px 7px}.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 34px)}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:23px 14px;display:flex;flex-direction:column;gap:22px}.brand{font-size:16px;font-weight:600;letter-spacing:-.5px;padding:0 10px}.brandmark{color:#a6b9a0;letter-spacing:-3px;margin-right:10px}.nav{display:grid;gap:4px}.nav button{text-align:left;display:flex;gap:10px;align-items:center;padding:9px 10px}.nav .selected{background:#282824;color:var(--strong)}.project{padding:7px 10px;color:var(--muted);font-size:12px}.section-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#73736c;padding:0 10px;margin-bottom:8px}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px 0;display:flex;align-items:center;gap:10px}.avatar{display:grid;place-items:center;width:28px;height:28px;background:#30332b;border-radius:50%;font-size:11px;color:#c8d5be}.main{min-width:0}.topbar{height:55px;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;gap:8px}.crumb{color:var(--muted);font-size:12px}.page{padding:38px 40px;max-width:1500px;margin:auto}.page-intro{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.6}.tabs{display:flex;gap:23px;border-bottom:1px solid var(--line);margin-top:28px}.tabs button{border-radius:0;padding:13px 0;border-bottom:2px solid transparent;color:var(--muted)}.tabs button.active{border-bottom-color:var(--strong);color:var(--strong)}.count{font-size:11px;color:var(--muted);margin-left:7px}.toolbar{display:flex;align-items:center;gap:9px;margin:20px 0}.search{border:1px solid var(--line);background:transparent;padding:8px 11px;border-radius:6px;color:var(--text);width:240px}.filter{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:7px}.seg{display:inline-flex;background:#191917;border:1px solid var(--line);padding:3px;border-radius:7px}.seg button{padding:5px 10px;font-size:12px;color:var(--muted)}.seg button.active{background:#30302b;color:var(--strong)}.table-head{display:grid;grid-template-columns:minmax(230px,1.6fr) 1fr 1fr 34px;gap:14px;padding:12px 15px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}.task-row{width:100%;display:grid;grid-template-columns:minmax(230px,1.6fr) 1fr 1fr 34px;gap:14px;text-align:left;align-items:center;padding:18px 15px;border-radius:0;border-bottom:1px solid #232321;min-height:77px}.task-name{font-weight:500;font-size:13px;color:var(--strong)}.subline{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}.state{font-size:12px;display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;background:currentColor;border-radius:50%;display:inline-block;flex:none}.task-row .arrow{color:#64645e;opacity:0}.task-row:hover .arrow{opacity:1}.group-label{display:flex;align-items:center;gap:9px;padding:25px 15px 10px;color:var(--muted);font-size:12px}.once-row{grid-template-columns:minmax(220px,1.6fr) 1fr 1fr 34px;min-height:64px;padding-top:12px;padding-bottom:12px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.board-column{border-radius:8px;background:#161614;padding:12px;min-height:250px}.board-card{width:100%;text-align:left;background:#20201c;border:1px solid #30302a;padding:15px;margin-top:12px;line-height:1.6}.board-card:hover{background:#292923}.empty{padding:50px;text-align:center;color:var(--muted)}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 266px;min-height:calc(100vh - 89px)}.detail-main{padding:40px;min-width:0}.detail-title{max-width:750px;line-height:1.25}.task-id{color:var(--muted);font-size:11px;margin-bottom:13px}.detail-summary{margin:14px 0 24px;max-width:660px;color:var(--muted);line-height:1.7}.banner{display:flex;align-items:center;gap:11px;padding:14px 16px;border:1px solid #343c30;background:#1a2019;border-radius:8px;line-height:1.6;color:#becfb8}.banner.attention{background:#252017;border-color:#493a25;color:var(--amber)}.banner.neutral{background:#1b1b18;border-color:var(--line);color:var(--muted)}.rail{border-left:1px solid var(--line);padding:30px 23px}.prop{padding:14px 0;border-bottom:1px solid #242422}.prop label{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}.prop-value{line-height:1.7}.prop button{padding:4px 0;text-align:left}.rail-actions{margin-top:20px;display:grid;gap:8px}.rail-actions button{width:100%}.run-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;width:100%;text-align:left;align-items:start;border-radius:0;border-bottom:1px solid var(--line);padding:20px 4px}.run-symbol{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#20271f;color:var(--green);font-size:12px}.run-symbol.failed{background:#32241f;color:var(--red)}.run-symbol.running{background:#28291d;color:var(--amber)}.run-outcome{font-size:13px;color:var(--text);margin-bottom:7px}.run-meta{color:var(--muted);font-size:11px;line-height:1.6}.run-time{font-size:11px;color:var(--muted);padding-top:4px}.instructions{padding:25px 0;max-width:670px;font-size:14px;line-height:1.9;color:#c3c3b9}.instructions h3{color:var(--strong);font-size:13px;margin:24px 0 8px}.instructions ol{padding-left:20px}.instruction-actions{display:flex;justify-content:flex-end;padding-top:15px}.result{max-width:740px;margin:0 auto;padding:38px 12px}.result h1{font-size:23px}.result-meta{display:flex;gap:18px;margin-top:13px;color:var(--muted);font-size:12px}.result-body{padding:28px 0;line-height:1.85;font-size:14px}.result-body h2{margin:24px 0 12px}.finding{padding:15px 0;border-bottom:1px solid var(--line)}.finding strong{font-size:13px;font-weight:500}.finding p{color:var(--muted);font-size:13px}.artifact{padding:15px;border:1px solid var(--line);border-radius:8px;margin:22px 0}.transcript{border:1px solid var(--line);border-radius:8px;padding:15px;line-height:1.8;margin-top:20px;color:var(--muted);font-size:12px}.transcript summary{cursor:pointer;color:var(--text)}dialog{background:#1b1b18;color:var(--text);border:1px solid #3b3b34;border-radius:12px;padding:0;width:min(560px,calc(100vw - 32px));max-height:90vh;box-shadow:0 25px 100px #0008}dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}.modal-head{padding:23px 25px 15px;display:flex;align-items:center;justify-content:space-between}.modal-body{padding:5px 25px 25px}.field{margin-top:20px}.field label{display:block;margin-bottom:8px;color:#bebeb4;font-size:12px}.field input,.field textarea,.field select{width:100%;color:var(--text);background:#141411;border:1px solid #36362e;border-radius:6px;padding:10px 11px}.field textarea{resize:vertical;line-height:1.6;min-height:90px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.helper{font-size:11px;line-height:1.6;color:var(--muted);margin-top:9px}.schedule-box{margin-top:18px;border-top:1px solid var(--line);padding-top:3px}.preview{margin-top:17px;background:#24271f;border:1px solid #363e2d;border-radius:6px;padding:11px;color:#c6d1b9;font-size:12px;line-height:1.6}.modal-footer{display:flex;justify-content:flex-end;gap:9px;padding:15px 25px;border-top:1px solid var(--line)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#e0e4d7;color:#24271f;border-radius:8px;box-shadow:0 8px 30px #0007;font-size:12px;z-index:20}.hidden{display:none!important}.intro-note{border-left:2px solid #565b49;padding:0 0 0 14px;line-height:1.7;color:var(--muted);font-size:12px;margin-top:35px;max-width:650px}.editor{width:100%;min-height:220px;background:#171714;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:15px;font:inherit;line-height:1.8} @media(min-width:1500px){.page{padding-top:50px}.detail-main{padding:48px 60px}}@media(max-width:1000px){.shell{grid-template-columns:170px 1fr}.page,.detail-main{padding:25px}.detail-layout{grid-template-columns:minmax(0,1fr) 225px}.rail{padding:25px 17px}.task-row,.table-head{grid-template-columns:minmax(170px,1.4fr) 1fr 1fr 15px;gap:8px}.board{grid-template-columns:1fr}}@media(max-width:760px){.sidebar{display:none}.shell{display:block}.detail-layout{display:flex;flex-direction:column}.rail{border-left:0;border-top:1px solid var(--line)}.task-row,.table-head{grid-template-columns:minmax(150px,1.5fr) 1fr 15px}.task-row> :nth-child(3),.table-head> :nth-child(3){display:none}.page,.detail-main{padding:22px 18px}.topbar{padding:0 16px}.search{width:170px}.review{font-size:10px}.review .review-help{display:none}.fields{grid-template-columns:1fr}.result{padding:25px 18px}.result-meta{flex-wrap:wrap}.toolbar{flex-wrap:wrap}}
.board{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="review"><b>DESIGN REVIEW</b><span>Tasks · One-time & recurring</span><span class="spacer"></span><span class="review-help">Interactive sample · changes stay in this tab</span><button id="reset">Reset demo ↺</button></div>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">▦</span>claxedo</div><div class="nav"><button class="selected" data-action="home"><span class="icon">☷</span>Tasks</button></div><div><div class="section-label">Projects</div><div class="project">⌄ &nbsp; opencode</div><div class="project small" style="padding-left:28px">Design task automations</div><div class="project">› &nbsp; website</div><div class="project">› &nbsp; experiments</div></div><div class="sidebar-bottom"><div class="avatar">YS</div><div><div class="small">Yashvardhan</div><div class="muted small" style="margin-top:4px">Signed in</div></div><span class="spacer"></span><span class="muted">⌄</span></div></aside><main class="main" id="app"></main></div>
<dialog id="dialog"></dialog><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const initial=[
{id:41,type:'recurring',title:'Daily issue triage',description:'Review new GitHub issues, find duplicates, and suggest priorities. Leave a report for me to review before changing anything.',schedule:'Weekdays',time:'09:00',timezone:'Asia/Kolkata',preset:'Cloud review',project:'opencode',paused:false,runs:[{id:1,date:'Today, 9:00 AM',title:'4 issues need review',state:'succeeded',duration:'2m 34s',trigger:'Scheduled'},{id:2,date:'Yesterday, 9:00 AM',title:'No new issues',state:'succeeded',duration:'48s',trigger:'Scheduled'},{id:3,date:'Fri, Sep 18 · 9:00 AM',title:'GitHub access expired',state:'failed',duration:'12s',trigger:'Scheduled'}]},
{id:42,type:'recurring',title:'Dependency check',description:'Check for dependency updates and known vulnerabilities. Prepare a summary with recommended upgrades. Do not change lockfiles.',schedule:'Weekly on Monday',time:'10:00',timezone:'Asia/Kolkata',preset:'Cloud review',project:'opencode',paused:false,runs:[{id:4,date:'Today, 10:00 AM',title:'Checking 12 packages…',state:'running',duration:'1m 12s',trigger:'Manual'}]},
{id:43,type:'recurring',title:'Weekly release summary',description:'Summarize merged pull requests into a release note draft. Group changes by user-visible behavior and link the source pull requests.',schedule:'Weekly on Friday',time:'16:00',timezone:'Asia/Kolkata',preset:'Cloud writer',project:'opencode',paused:true,runs:[{id:5,date:'Fri, Sep 18 · 4:00 PM',title:'Release draft is ready',state:'succeeded',duration:'3m 09s',trigger:'Scheduled'}]},
{id:44,type:'recurring',title:'Website health check',description:'Check the public website for broken links and slow pages. Report only new failures and recoveries.',schedule:'Daily',time:'08:00',timezone:'Asia/Kolkata',preset:'Cloud review',project:'website',paused:false,runs:[{id:6,date:'Today, 8:00 AM',title:'All 24 pages are healthy',state:'succeeded',duration:'1m 08s',trigger:'Scheduled'}]},
{id:38,type:'once',title:'Fix authentication retry',description:'Fix the retry behavior when a provider session expires. Preserve the original request and show a clear recovery action.',preset:'Cloud review',project:'opencode',status:'needs',runs:[{id:7,date:'Today, 10:42 AM',title:'Approve the proposed change',state:'needs',duration:'4m 18s',trigger:'Manual'}]},
{id:39,type:'once',title:'Update onboarding',description:'Improve the first-run setup instructions and verify the signed-in onboarding path.',preset:'Cloud writer',project:'opencode',status:'running',runs:[{id:8,date:'Today, 11:15 AM',title:'Updating setup instructions…',state:'running',duration:'2m 03s',trigger:'Manual'}]},
{id:40,type:'once',title:'Investigate slow startup',description:'Measure desktop startup, identify the largest delay, and propose a focused fix with evidence.',preset:'Cloud review',project:'opencode',status:'ready',runs:[]},
{id:37,type:'once',title:'Improve empty states',description:'Add clear next actions to the empty project and session views.',preset:'Cloud writer',project:'website',status:'done',runs:[{id:9,date:'Yesterday, 3:20 PM',title:'Empty states updated and verified',state:'succeeded',duration:'5m 41s',trigger:'Manual'}]}
];
initial.forEach(t=>t.runs.forEach(r=>r.instructions=t.description));
let tasks=structuredClone(initial),type='recurring',page='list',selected=null,detailTab='runs',view='list',query='',project='all',runId=null,toastTimer;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getTask=()=>tasks.find(t=>t.id===selected);const statusNames={ready:'Ready',needs:'Needs your input',running:'Running',done:'Done'};
function clock(t){let[h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function schedule(t){return `${t.schedule} · ${clock(t.time)}`}
function next(t){return t.schedule==='Weekly on Friday'?`Friday at ${clock(t.time)}`:`Tomorrow at ${clock(t.time)}`}
function stateText(t){if(t.runs[0]?.state==='running')return 'Running now';if(t.runs[0]?.state==='needs')return 'Needs your input';return t.type==='recurring'?(t.paused?'Paused':next(t)):statusNames[t.status]}
function stateClass(t){return ['running','needs'].includes(t.runs[0]?.state)?'amber':t.status==='done'?'green':'muted'}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function topbar(detail=false){return `<div class="topbar"><button data-action="home" class="crumb">Tasks</button>${detail?`<span class="muted">/</span><span class="crumb">${esc(getTask().project)}</span><span class="muted">/</span><span class="small">TASK-${selected}</span>`:'<span class="muted small">/ &nbsp; All projects</span>'}<span class="spacer"></span>${detail?'<button class="outline" data-action="new">＋ New task</button>':''}</div>`}
function render(){if(page==='list')renderList();else if(page==='detail')renderDetail();else renderRun()}
function renderList(){const list=tasks.filter(t=>t.type===type&&(project==='all'||t.project===project)&&t.title.toLowerCase().includes(query.toLowerCase()));$('#app').innerHTML=topbar()+`<section class="page"><div class="row between"><h1>Tasks</h1><button class="primary" data-action="new">＋ New task</button></div><p class="page-intro">${type==='recurring'?'Work that keeps happening. Each run has its own result.':'Work with a finish line. Pick it up, review it, and get it done.'}</p><div class="tabs" role="tablist" aria-label="Task type"><button role="tab" aria-selected="${type==='once'}" class="${type==='once'?'active':''}" data-type="once">One-time<span class="count">${tasks.filter(t=>t.type==='once').length}</span></button><button role="tab" aria-selected="${type==='recurring'}" class="${type==='recurring'?'active':''}" data-type="recurring">Recurring<span class="count">${tasks.filter(t=>t.type==='recurring').length}</span></button></div><div class="toolbar"><input id="search" class="search" aria-label="Find a task" placeholder="Find a task…" value="${esc(query)}"><select id="project" class="filter" aria-label="Filter by project"><option value="all">All projects</option><option value="opencode" ${project==='opencode'?'selected':''}>opencode</option><option value="website" ${project==='website'?'selected':''}>website</option></select><span class="spacer"></span>${type==='once'?`<div class="seg" aria-label="View"><button data-view="list" class="${view==='list'?'active':''}">List</button><button data-view="board" class="${view==='board'?'active':''}">Board</button></div>`:'<span class="small muted">Asia/Kolkata · UTC+5:30</span>'}</div><div id="rows">${listMarkup(list)}</div></section>`;$('#search').addEventListener('input',e=>{query=e.target.value;$('#rows').innerHTML=listMarkup(tasks.filter(t=>t.type===type&&(project==='all'||t.project===project)&&t.title.toLowerCase().includes(query.toLowerCase())))});$('#project').onchange=e=>{project=e.target.value;render()}}
function listMarkup(list){if(!list.length)return '<div class="empty">No tasks match this view.</div>';if(type==='recurring')return `<div class="table-head"><span>Task / Schedule</span><span>Next run</span><span>Latest result</span><span></span></div>`+list.map(t=>`<button class="task-row" data-open="${t.id}"><span><span class="task-name">${esc(t.title)}</span><div class="subline">${esc(schedule(t))} &nbsp; · &nbsp; ${esc(t.project)}</div></span><span class="state ${stateClass(t)}">${['running','needs'].includes(t.runs[0]?.state)?'<span class="dot"></span>':''}${esc(stateText(t))}</span><span class="small ${t.runs[0]?.state==='failed'?'red':'muted'}">${esc(t.runs[0]?.title||'No runs yet')}</span><span class="arrow">↗</span></button>`).join('');const groups=[['needs','Needs your input'],['running','In progress'],['ready','Ready'],['done','Done']];if(view==='board')return `<div class="board">${groups.filter(([k])=>list.some(t=>t.status===k)).map(([k,label])=>`<section class="board-column"><h3>${label} <span class="count">${list.filter(t=>t.status===k).length}</span></h3>${list.filter(t=>t.status===k).map(t=>`<button class="board-card" data-open="${t.id}"><span class="small muted">TASK-${t.id}</span><div>${esc(t.title)}</div><div class="subline">${esc(t.project)} · ${t.runs.length} run${t.runs.length===1?'':'s'}</div></button>`).join('')}</section>`).join('')}</div>`;return groups.map(([k,label])=>{const items=list.filter(t=>t.status===k);return items.length?`<div class="group-label">${label}<span class="count">${items.length}</span></div>`+items.map(t=>`<button class="task-row once-row" data-open="${t.id}"><span class="row"><span class="icon ${k==='done'?'green':k==='needs'?'amber':''}">${k==='done'?'✓':k==='needs'?'!':k==='running'?'◐':'○'}</span><span class="task-name">${esc(t.title)}</span></span><span class="small muted">${esc(t.project)} · TASK-${t.id}</span><span class="small muted">${t.runs.length?t.runs.length+' run'+(t.runs.length===1?'':'s'):'Not started'}</span><span class="arrow">↗</span></button>`).join(''):''}).join('')}
function renderDetail(){const t=getTask(),active=t.runs[0]?.state==='running',needs=t.runs[0]?.state==='needs';$('#app').innerHTML=topbar(true)+`<div class="detail-layout"><section class="detail-main"><div class="task-id">TASK-${t.id}</div><div class="row between" style="align-items:flex-start"><h1 class="detail-title">${esc(t.title)}</h1></div><p class="detail-summary">${esc(t.description)}</p>${needs?`<div class="banner attention"><span>!</span><div><b>Your input is needed</b><div class="small">The latest run is waiting for your review.</div></div><span class="spacer"></span><button class="outline" data-run="${t.runs[0].id}">Review</button></div>`:active?`<div class="banner"><span>◐</span><div><b>${esc(t.runs[0].title)}</b><div class="small">Started just now · You can leave this page.</div></div><span class="spacer"></span><button class="outline" data-run="${t.runs[0].id}">Open run</button></div>`:t.type==='recurring'?`<div class="banner ${t.paused?'neutral':''}"><span>${t.paused?'Ⅱ':'↻'}</span><div><b>${t.paused?'Schedule paused':'Next run '+esc(next(t))}</b><div class="small">${t.paused?'Past results are still available.':esc(t.timezone)+' · Runs even when Claxedo is closed.'}</div></div><span class="spacer"></span><button class="outline" data-action="${t.paused?'pause':'schedule'}">${t.paused?'Resume':'Edit schedule'}</button></div>`:t.status==='done'?'<div class="banner"><span>✓</span><div><b>Task completed</b><div class="small">The result and execution history are available below.</div></div></div>':'<div class="banner neutral"><span>○</span><div>Ready to run<div class="small">Start this task when you are ready.</div></div></div>'}<div class="tabs" role="tablist" aria-label="Task content"><button role="tab" aria-selected="${detailTab==='instructions'}" data-detail="instructions" class="${detailTab==='instructions'?'active':''}">Instructions</button><button role="tab" aria-selected="${detailTab==='runs'}" data-detail="runs" class="${detailTab==='runs'?'active':''}">Runs<span class="count">${t.runs.length}</span></button></div>${detailTab==='runs'?runList(t):`<div class="instructions"><p>${esc(t.description)}</p><h3>Expected result</h3><p>${t.type==='recurring'?'A concise report of what changed, with source links. Explicitly report when there is nothing new.':'A completed change with verification evidence and a summary of any remaining work.'}</p><h3>Working boundaries</h3><p>Read the current sources. Ask before publishing, merging, or changing external records. If access is unavailable, report the blocker.</p><div class="instruction-actions"><button class="outline" data-action="edit">Edit instructions</button></div></div>`}</section><aside class="rail"><h3>Properties</h3><div class="prop"><label>Type</label><div class="prop-value">${t.type==='recurring'?'↻ &nbsp; Recurring':'○ &nbsp; One-time'}</div></div><div class="prop"><label>Project</label><div class="prop-value">▱ &nbsp; ${esc(t.project)}</div></div><div class="prop"><label>Run with</label><div class="prop-value">${esc(t.preset)}</div><div class="helper">Cloud workspace · Isolated per run</div></div>${t.type==='recurring'?`<div class="prop"><label>Schedule</label><button data-action="schedule">${esc(t.schedule)}<br>${clock(t.time)} &nbsp; <span class="muted">✎</span></button><div class="helper">${esc(t.timezone)}</div></div>`:''}<div class="rail-actions"><button class="primary" data-action="run-now" ${active?'disabled':''}>${active?'Running…':t.status==='done'?'Run again':'▷ Run now'}</button>${t.type==='recurring'?`<button class="outline" data-action="pause">${t.paused?'Resume schedule':'Pause schedule'}</button>`:''}</div><p class="helper" style="margin-top:15px">${t.type==='recurring'?'Run now starts an extra run. It does not change the schedule.':'Each run keeps its own result and conversation.'}</p>${t.paused&&active?'<p class="helper amber">Schedule paused. The current run continues.</p>':''}</aside></div>`}
function runList(t){return t.runs.length?t.runs.map(r=>`<button class="run-row" data-run="${r.id}"><span class="run-symbol ${r.state}">${r.state==='failed'?'!':r.state==='running'?'◐':r.state==='needs'?'!':r.state==='cancelled'?'−':'✓'}</span><span><div class="run-outcome">${esc(r.title)}</div><div class="run-meta">${esc(r.date)} &nbsp; · &nbsp; ${r.trigger} &nbsp; · &nbsp; ${r.duration}</div></span><span class="run-time">${r.state==='needs'?'Review →':'Open →'}</span></button>`).join(''):'<div class="empty">No runs yet. Start the task to see its result here.</div>'}
function renderRun(){const t=getTask(),r=t.runs.find(r=>r.id===runId);$('#app').innerHTML=topbar(true)+`<div class="result"><button class="crumb" data-action="back-detail" style="padding-left:0;margin-bottom:25px">← ${esc(t.title)}</button><div class="row between"><span class="state ${r.state==='failed'?'red':r.state==='running'||r.state==='needs'?'amber':'green'}"><span class="dot"></span>${({succeeded:'Completed',failed:'Failed',running:'Running',needs:'Needs your input',cancelled:'Cancelled'})[r.state]}</span><span class="muted small">Run #${r.id}</span></div><h1 style="margin-top:18px">${esc(r.title)}</h1><div class="result-meta"><span>${esc(r.date)}</span><span>${r.trigger}</span><span>${r.duration}</span><span>${esc(t.preset)}</span></div><div class="result-body">${r.state==='running'?'<p>The agent is working in its cloud workspace. Progress and tool activity appear here.</p><div class="transcript">✓ Workspace prepared<br>✓ Instructions loaded<br>◐ Reading project sources</div><div class="row" style="margin-top:25px"><button class="outline" data-action="cancel-run">Cancel run</button><button class="outline" data-action="finish-run">Simulate completion</button></div><p class="helper">Design review control: simulate the result to explore the next state.</p>':r.state==='needs'?'<p>The proposed fix is ready. Review the change before approving the next step.</p><div class="artifact">▤ &nbsp; Retry behavior proposal<br><span class="muted small">Preserve the request and retry after credential refresh.</span></div><button class="primary" data-action="approve">Approve and continue</button>':r.state==='failed'?'<p>The GitHub connection expired before any issues could be read. No external records were changed.</p><div class="banner attention">Reconnect GitHub in Connections, then retry this run.</div><button style="margin-top:20px" class="outline" data-action="reconnect">View connection requirement</button>':r.state==='cancelled'?'<p>This run was cancelled. Its partial activity remains available in the transcript.</p>':r.title==='No new issues'?'<p>No new issues were found since the previous successful check. No action is needed.</p>':t.id===41?'<p>Reviewed 12 new issues. Four deserve your attention; the rest are already tracked or need more information.</p><h2>Suggested triage</h2><div class="finding"><strong>#284 · Session reconnect loses queued prompt</strong><p>Possible regression. Suggested priority: High. Reproduce after a brief network interruption.</p></div><div class="finding"><strong>#281 and #279 · Duplicate loading indicator reports</strong><p>Likely the same underlying issue. Review before linking or closing either report.</p></div><div class="finding"><strong>#277 · Cloud setup needs a clearer next step</strong><p>Suggested priority: Normal. The first-run screen does not explain the missing connection.</p></div><div class="artifact">▤ &nbsp; Issue triage report.md <span class="muted small">· 4 findings</span></div><p class="muted small">No issues were modified. These are recommendations for your review.</p>':'<p>The requested work is complete. The result is saved with this run for later review.</p><div class="artifact">▤ &nbsp; '+esc(t.title)+' — result</div>'}</div><details class="transcript"><summary>Session activity and instructions</summary><p style="margin-top:15px">Instruction snapshot: ${esc(r.instructions)}</p><p>09:00 · Cloud workspace prepared<br>09:00 · Selected connections checked<br>09:01 · Agent inspected current sources<br>09:02 · Result recorded</p><p class="helper">Illustrative transcript. In Claxedo, this is the actual run’s session.</p></details></div>`}
function showDialog(html){const d=$('#dialog');d.innerHTML=html;d.showModal()}
function scheduleFields(t={schedule:'Weekdays',time:'09:00',timezone:'Asia/Kolkata'}){return `<div class="schedule-box"><div class="fields"><div class="field"><label for="cadence">Repeat</label><select id="cadence"><option ${t.schedule==='Daily'?'selected':''}>Daily</option><option ${t.schedule==='Weekdays'?'selected':''}>Weekdays</option><option ${t.schedule==='Weekly on Monday'?'selected':''}>Weekly on Monday</option><option ${t.schedule==='Weekly on Friday'?'selected':''}>Weekly on Friday</option></select></div><div class="field"><label for="time">Time</label><input id="time" type="time" value="${esc(t.time)}" required></div></div><div class="field"><label for="timezone">Timezone</label><select id="timezone"><option>Asia/Kolkata</option></select></div><div id="schedule-preview" class="preview"></div></div>`}
function bindPreview(){const update=()=>{const t={schedule:$('#cadence').value,time:$('#time').value||'09:00'};$('#schedule-preview').textContent=`Next run: ${next(t)} · Asia/Kolkata`};$('#cadence').onchange=update;$('#time').oninput=update;update()}
function newDialog(){showDialog(`<form id="new-form"><div class="modal-head"><h2>New task</h2><button type="button" data-action="close-dialog" aria-label="Close">×</button></div><div class="modal-body"><div class="seg" style="width:100%"><button type="button" style="flex:1" class="${type==='once'?'active':''}" data-newtype="once">One-time</button><button type="button" style="flex:1" class="${type==='recurring'?'active':''}" data-newtype="recurring">↻ Recurring</button></div><input type="hidden" id="new-type" value="${type}"><div class="field"><label for="title">What needs to be done?</label><input id="title" required placeholder="e.g. Review new GitHub issues" autocomplete="off"></div><div class="field"><label for="description">Instructions</label><textarea id="description" required placeholder="Describe the work, the expected result, and when to ask for your input."></textarea></div><div class="fields"><div class="field"><label for="new-project">Project</label><select id="new-project"><option>opencode</option><option>website</option></select></div><div class="field"><label for="preset">Run with</label><select id="preset"><option>Cloud review</option><option>Cloud writer</option></select></div></div><div id="schedule-fields" class="${type==='once'?'hidden':''}">${scheduleFields()}</div><div id="once-help" class="helper ${type==='recurring'?'hidden':''}" style="margin-top:20px">Create this task now and run it when you are ready.</div></div><div class="modal-footer"><button type="button" data-action="close-dialog">Cancel</button><button class="primary" id="create-label">${type==='recurring'?'Create recurring task':'Create task'}</button></div></form>`);bindPreview();$('#new-form').onsubmit=e=>{e.preventDefault();const recurring=$('#new-type').value==='recurring';const t={id:Math.max(...tasks.map(t=>t.id))+1,type:recurring?'recurring':'once',title:$('#title').value.trim(),description:$('#description').value.trim(),project:$('#new-project').value,preset:$('#preset').value,status:'ready',paused:false,runs:[],schedule:$('#cadence').value,time:$('#time').value,timezone:$('#timezone').value};if(!t.title||!t.description)return;tasks.unshift(t);$('#dialog').close();selected=t.id;type=t.type;page='detail';detailTab='instructions';render();toast(recurring?'Recurring task created. Its schedule is enabled.':'Task created. Ready to run.')}}
function editSchedule(){const t=getTask();showDialog(`<form id="schedule-form"><div class="modal-head"><h2>Edit schedule</h2><button type="button" data-action="close-dialog" aria-label="Close">×</button></div><div class="modal-body"><p class="muted">${esc(t.title)}</p>${scheduleFields(t)}<p class="helper">Changes apply to future runs. Any current run continues.</p></div><div class="modal-footer"><button type="button" data-action="close-dialog">Cancel</button><button class="primary">Save schedule</button></div></form>`);bindPreview();$('#schedule-form').onsubmit=e=>{e.preventDefault();Object.assign(t,{schedule:$('#cadence').value,time:$('#time').value,timezone:$('#timezone').value});$('#dialog').close();render();toast('Schedule updated for future runs.')}}
function startRun(){const t=getTask();if(t.runs[0]?.state==='running')return;const r={id:Math.max(0,...tasks.flatMap(t=>t.runs.map(r=>r.id)))+1,date:'Just now',title:'Preparing the workspace…',state:'running',duration:'0s',trigger:'Manual'};r.instructions=t.description;t.runs.unshift(r);if(t.type==='once')t.status='running';detailTab='runs';render();toast('Sample run started. Open it to simulate completion.')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.type){type=b.dataset.type;query='';render();return}if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.open){selected=Number(b.dataset.open);page='detail';detailTab=getTask().runs.length?'runs':'instructions';render();return}if(b.dataset.detail){detailTab=b.dataset.detail;render();return}if(b.dataset.run){runId=Number(b.dataset.run);page='run';render();return}if(b.dataset.newtype){const v=b.dataset.newtype;$('#new-type').value=v;document.querySelectorAll('[data-newtype]').forEach(x=>x.classList.toggle('active',x.dataset.newtype===v));$('#schedule-fields').classList.toggle('hidden',v==='once');$('#once-help').classList.toggle('hidden',v==='recurring');$('#create-label').textContent=v==='recurring'?'Create recurring task':'Create task';return}const a=b.dataset.action;if(a==='home'){page='list';render()}if(a==='new')newDialog();if(a==='close-dialog')$('#dialog').close();if(a==='schedule')editSchedule();if(a==='pause'){const t=getTask();t.paused=!t.paused;render();toast(t.paused?'Future runs paused. Any active run continues.':'Schedule resumed.')}if(a==='run-now')startRun();if(a==='back-detail'){page='detail';detailTab='runs';render()}if(a==='finish-run'||a==='approve'){const t=getTask(),r=t.runs.find(r=>r.id===runId);r.state='succeeded';r.title=t.id===41?'4 issues need review':'Work completed and ready to review';r.duration='2m 34s';if(t.type==='once')t.status='done';render();toast(t.type==='recurring'?'Run completed. The recurring task remains scheduled.':'Run completed. Task marked done.')}if(a==='cancel-run'){const t=getTask(),r=t.runs.find(r=>r.id===runId);r.state='cancelled';r.title='Run cancelled';if(t.type==='once')t.status='ready';render();toast('Run cancelled.')}if(a==='reconnect')toast('This run needs a renewed GitHub connection. No real connection is changed in this mockup.');if(a==='edit'){const t=getTask();showDialog(`<form id="edit-form"><div class="modal-head"><h2>Edit instructions</h2></div><div class="modal-body"><textarea class="editor" id="edit-text" aria-label="Task instructions" required>${esc(t.description)}</textarea><p class="helper">Existing runs keep their original instructions.</p></div><div class="modal-footer"><button type="button" data-action="close-dialog">Cancel</button><button class="primary">Save instructions</button></div></form>`);$('#edit-form').onsubmit=e=>{e.preventDefault();t.description=$('#edit-text').value;$('#dialog').close();render();toast('Instructions updated for future runs.')}}});
$('#reset').onclick=()=>{tasks=structuredClone(initial);type='recurring';page='list';query='';project='all';view='list';render();toast('Sample data reset.')};
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#dialog').close()}});
render();
</script>
</body></html>
