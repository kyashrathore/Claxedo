name = "claxedo-sandbox-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-29"

# The runtime is reached through this Worker's own /sandbox/:id/proxy route,
# so the workers.dev URL is enough: no wildcard route or certificate.
workers_dev = true

[observability]
enabled = true

# Container snapshots exist only under the `durable_object` scheduling policy
# (Wrangler 4.131.0 and later), which is fixed when the container application
# is created, so this class is a new application beside the retired `Sandbox`
# one. The policy refuses `instance_type`, `max_instances` and
# `constraints.regions`: the instance is chosen at `start()`, and a container
# is placed near its Durable Object, which the Worker hints into ENAM.
[[containers]]
class_name = "WorkspaceSandbox"
scheduling_policy = "durable_object"

[containers.images.runtime]
dockerfile = "./Dockerfile"

[[durable_objects.bindings]]
class_name = "WorkspaceSandbox"
name = "WORKSPACE_SANDBOX"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorkspaceSandbox"]
deleted_classes = ["Sandbox"]

# The sandbox registry, one object per live sandbox under `sandbox-registry/`:
# a Durable Object namespace cannot be enumerated, so without this binding
# `GET /sandboxes` answers 501 and the control plane's GC reports
# `listingUnsupported` instead of a clean sweep it cannot see.
[[r2_buckets]]
binding = "SANDBOX_REGISTRY"
bucket_name = "claxedo-sandbox-backups"

# Native outbound handlers read credentials from KV outside the container.
# Provisioning a brokered credential requires this binding.
[[kv_namespaces]]
binding = "EGRESS_SECRETS"
id = "47926e0723e54c8d825cae7af8bcc60f"
