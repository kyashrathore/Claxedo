name = "claxedo-sandbox-proxy"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# The runtime is reached through the worker's own /sandbox/:id/proxy route
# (containerFetch), NOT exposePort preview subdomains — so NO wildcard route or
# wildcard ACM cert is required. Served at the workers.dev URL below; for a
# branded host add `routes = [{ pattern = "sandbox.claxedo.com/*", zone_name =
# "claxedo.com" }]` on an account that owns the zone.
workers_dev = true

[observability]
enabled = true

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
# The runnable image includes the workspace runtime plus every supported agent
# harness and currently needs about 5.3GB. standard-1 provides an 8GB disk.
instance_type = "standard-1"
max_instances = 3

[containers.constraints]
regions = ["APAC"]

[containers.configuration.observability.logs]
enabled = true

[[durable_objects.bindings]]
class_name = "Sandbox"
name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

# Egress credential broker (Cloudflare Worker-proxy pattern). Brokered secrets
# are stored here keyed by sandbox id — never inside the container. Create the
# namespace (`wrangler kv namespace create EGRESS_SECRETS`) and set the signing
# secret (`wrangler secret put EGRESS_SIGNING_SECRET`). Brokering stays off
# until both are configured.
# Add an EGRESS_SECRETS KV binding here only after creating a real namespace.
# The Worker keeps credential brokering disabled when this optional binding or
# EGRESS_SIGNING_SECRET is absent.
