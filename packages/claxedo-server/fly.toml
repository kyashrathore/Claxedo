# Fly.io deployment for the Claxedo control plane (self-host).
#
# From the MONOREPO ROOT:
#   fly launch --copy-config --no-deploy -c packages/claxedo-server/fly.toml
#   fly volumes create claxedo_data --size 10 -a <app>
#   fly deploy -c packages/claxedo-server/fly.toml
#
# Unsigned single-user mode needs NO extra secrets (SQLite authority is the
# default). For signed/hosted mode, set the auth/relay secrets via
# `fly secrets set` — see packages/claxedo-server/.env.example.

app = "claxedo-control-plane"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  # Build context is the repo root; fly deploy must run from the monorepo root.

[env]
  CLAXEDO_SERVER_HOST = "0.0.0.0"
  CLAXEDO_SERVER_PORT = "3001"
  CLAXEDO_DATA_DIR = "/data"

[mounts]
  source = "claxedo_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # Single long-lived process: sessions and the SQLite store live here.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/claxedo/health"

[[vm]]
  size = "shared-cpu-2x"
  # 4GB: the embedded engine (node-embed) OOMs a 2GB machine on first load.
  memory = "4gb"
