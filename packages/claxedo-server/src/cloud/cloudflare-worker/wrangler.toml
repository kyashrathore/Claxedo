name = "claxedo-sandbox-proxy"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "sandbox.claxedo.com/*", zone_name = "claxedo.com" },
  { pattern = "*.sandbox.claxedo.com/*", zone_name = "claxedo.com" },
]

[observability]
enabled = true

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 3

[containers.configuration.observability.logs]
enabled = true

[[durable_objects.bindings]]
class_name = "Sandbox"
name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]
