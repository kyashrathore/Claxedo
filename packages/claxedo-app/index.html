<!doctype html>
<html lang="en" style="background-color: var(--background-base, #101010); color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Claxedo</title>
    <link rel="icon" type="image/png" href="/favicon-96x96-v3.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <link rel="shortcut icon" href="/favicon-v3.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F8F7F7" />
    <meta name="theme-color" content="#131010" media="(prefers-color-scheme: dark)" />
    <style id="claxedo-initial-paint">
      html,
      body,
      #root {
        min-height: 100%;
        background-color: #101010;
        color: #a0a0a0;
      }

      body {
        margin: 0;
      }

      #root:empty {
        display: grid;
        min-height: 100dvh;
        place-items: center;
      }

      #root:empty::before {
        box-sizing: border-box;
        width: 18px;
        height: 18px;
        content: "";
        border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        border-top-color: currentColor;
        border-radius: 999px;
        animation: claxedo-initial-spin 0.8s linear infinite;
      }

      @keyframes claxedo-initial-spin {
        to {
          transform: rotate(1turn);
        }
      }
    </style>
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="flex flex-col h-dvh p-px"></div>
    <script src="/src/app/entry/main.tsx" type="module"></script>
  </body>
</html>
