# Cloudflare Worker config for the Claxedo Workspace Relay.
#
# The deployed relay: the Worker-safe Durable Object relay in src/worker.ts.
#
# Build / verify (no Cloudflare account needed):
#   npx wrangler deploy --dry-run --outdir dist-worker
# Deploy to staging (needs CLOUDFLARE_API_TOKEN + account):
#   npx wrangler deploy --env staging
#
# Secrets expected before staging/prod deploy:
#   CLAXEDO_RELAY_RESOLVER_TOKEN
#   CLAXEDO_RELAY_HOST_SIGNING_KEY_PEM
#   CLAXEDO_CONTROL_PLANE_JWKS_URL
# Optional:
#   CLAXEDO_RELAY_RESOLVER_URL or CLAXEDO_CENTRAL_URL (resolver base; /target, /revocation and
#     /host-generation are derived from it, so the host-tunnel serving-generation fence is always on)
#   CLAXEDO_RELAY_HOST_GENERATION_URL (absolute lookup URL; only when it is not <resolver base>/host-generation)
#   CLAXEDO_RELAY_HOST_GENERATION_CACHE_TTL_MS (default 10000)
#   CLAXEDO_RELAY_TARGET_CACHE_TTL_MS (default 10000; how long a stopped sandbox or session host keeps answering)
#   CLAXEDO_RELAY_REVOCATION_CACHE_TTL_MS (default 10000)
#   CLAXEDO_RELAY_HOST_PUBLIC_KEY_PEM
#   CLAXEDO_RELAY_HOST_NEXT_PUBLIC_KEY_PEM
#   CLAXEDO_RELAY_HOST_KID
#   CLAXEDO_RELAY_HOST_NEXT_KID

name = "claxedo-workspace-relay"
main = "src/worker.ts"
# The date every Claxedo Worker deploys at: WORKERS_COMPATIBILITY_DATE in
# claxedo-server's scripts/deploy/hosted-worker-bundle.ts, whose
# wrangler-config.test.ts holds this file to it, and relay-config-drift.test.ts
# holds wrangler-h2.toml to this file. At this date a listener-path WebSocket
# delivers binary frames as Blob, which socketFrame()/socketPayload() in
# src/cloudflare.ts decode. The real-workerd tests in src/relay-workerd-*.test.ts
# boot the relay at this date.
compatibility_date = "2026-07-30"

[observability]
enabled = true

# Both values below are DELIBERATE and must stay explicit — an omitted var here
# silently falls back to a code default that is wrong for production, and the
# fallback is invisible until a user hits it. `relay-config-drift.test.ts`
# fails if either key disappears from this block.
[vars]
# Concurrent WebSocket channels per host tunnel. The code
# default (TUNNEL_CHANNEL_CAP_DEFAULT = 16, src/cloudflare.ts) is below what one
# real workspace opens — terminal tabs plus agent event streams plus documents —
# and the 17th is rejected with a 503 `too_many_channels`. 256 clears realistic
# usage by an order of magnitude while staying a real abuse bound; staging's
# 32768 equals Cloudflare's own per-DO socket ceiling, i.e. no cap at all, which
# is fine for a load target and wrong for production.
CLAXEDO_RELAY_TUNNEL_CHANNEL_CAP = "256"
# Where a new relay Durable Object is placed when its workspace's credential
# declares no region. A DO's location is fixed at FIRST CREATION and never
# migrates, so this is permanent per workspace. "apac" matches the current
# India/South-Asia user base (DEFAULT_RELAY_LOCATION_HINT in
# src/relay-location.ts). A cloud machine's room follows the region its
# credential declares, and the room of a workspace whose sessions run on their
# own Durable Objects is created beside those objects in "enam"
# (SESSION_HOST_LOCATION_HINT) whatever this floor says.
CLAXEDO_RELAY_LOCATION_HINT = "apac"

[[durable_objects.bindings]]
name = "WORKSPACE_RELAY_ROOM"
class_name = "WorkspaceRelayRoom"

# Each top-level Pi session on a cloud workspace runs in its own SessionDO in
# the session-host Worker; the relay forwards a `durable-object` target to it.
[[durable_objects.bindings]]
name = "SESSION_HOST"
class_name = "SessionDO"
script_name = "claxedo-session-host"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceRelayRoom"]

[env.staging]
name = "claxedo-workspace-relay-staging"

# `vars` is NOT inherited from the top level by named environments — wrangler
# requires each environment to restate every key it needs, and an omitted key
# falls back to the code default rather than to the top-level value.
[env.staging.vars]
# Deliberately uncapped: staging is where the relay load benches run, and
# 32768 is Cloudflare's own per-DO socket ceiling. Production uses 256.
CLAXEDO_RELAY_TUNNEL_CHANNEL_CAP = "32768"
CLAXEDO_RELAY_LOCATION_HINT = "apac"

[[env.staging.durable_objects.bindings]]
name = "WORKSPACE_RELAY_ROOM"
class_name = "WorkspaceRelayRoom"

[[env.staging.durable_objects.bindings]]
name = "SESSION_HOST"
class_name = "SessionDO"
script_name = "claxedo-session-host-staging"
