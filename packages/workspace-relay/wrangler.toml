# Cloudflare Worker config for the Claxedo Workspace Relay.
#
# This deploys the Worker-safe Durable Object relay (src/worker.ts) used by the
# Cloudflare-first deployment shape. The Bun relay remains available for local
# development and non-Cloudflare regional container deployments.
#
# Build / verify (no Cloudflare account needed):
#   npx wrangler deploy --dry-run --outdir dist-worker
# Deploy to staging (needs CLOUDFLARE_API_TOKEN + account):
#   npx wrangler deploy --env staging
#
# Secrets expected before staging/prod deploy:
#   CLAXEDO_RELAY_RESOLVER_TOKEN
#   CLAXEDO_RELAY_HOST_SIGNING_KEY_PEM
#   CLAXEDO_CONTROL_PLANE_JWKS_URL
# Optional:
#   CLAXEDO_RELAY_RESOLVER_URL or CLAXEDO_CENTRAL_URL
#   CLAXEDO_RELAY_HOST_PUBLIC_KEY_PEM
#   CLAXEDO_RELAY_HOST_NEXT_PUBLIC_KEY_PEM
#   CLAXEDO_RELAY_HOST_KID
#   CLAXEDO_RELAY_HOST_NEXT_KID

name = "claxedo-workspace-relay"
main = "src/worker.ts"
# HELD at 2025-05-01 deliberately (D3, 2026-07-27) — do not bulk-bump.
# Cloudflare's `websocket_standard_binary_type` flag becomes default at
# compatibility_date 2026-03-17: server-side WebSockets then default to
# binaryType "blob" instead of "arraybuffer". Measured on real workerd
# (miniflare 4.20260722.0, hibernatable DO socket, 4-byte binary frame):
#   2025-05-01 -> ArrayBuffer   2026-03-16 -> ArrayBuffer
#   2026-03-17 -> Blob          2026-07-18 -> Blob
# socketFrame()/socketPayload() in src/cloudflare.ts accept only
# `string | ArrayBuffer | Uint8Array` and return undefined for anything else,
# so at >= 2026-03-17 every binary tunnel frame is SILENTLY DROPPED — no throw,
# no log. cloudflare.test.ts uses hand-rolled socket doubles, so nothing in the
# suite would catch it. Teach those two functions to await Blob.arrayBuffer()
# (and add a real-workerd binary round-trip test) BEFORE moving this date.
compatibility_date = "2025-05-01"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "WORKSPACE_RELAY_ROOM"
class_name = "WorkspaceRelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceRelayRoom"]

[env.staging]
name = "claxedo-workspace-relay-staging"

[env.staging.vars]
CLAXEDO_RELAY_TUNNEL_CHANNEL_CAP = "32768"

[[env.staging.durable_objects.bindings]]
name = "WORKSPACE_RELAY_ROOM"
class_name = "WorkspaceRelayRoom"
