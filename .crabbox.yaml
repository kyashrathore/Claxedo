  # Capacity escape hatch: the same Linux checks can be routed explicitly to
  # AWS without changing their commands or treating a product failure as a
  # provider failure. `script/cbx-ci.ts run pr-linux-aws` selects this matrix.
  pr-diagnostics-linux-aws: &aws_linux_job
    provider: aws
    target: linux
    architecture: amd64
    serverType: m7i.2xlarge
    market: on-demand
    shell: true
    command: bash script/cbx-ci-remote.sh diagnostics-linux
    stop: auto

  pr-unit-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh unit-linux

  pr-typecheck-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh typecheck-linux

  pr-e2e-core-01-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 1 12
  pr-e2e-core-02-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 2 12
  pr-e2e-core-03-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 3 12
  pr-e2e-core-04-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 4 12
  pr-e2e-core-05-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 5 12
  pr-e2e-core-06-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 6 12
  pr-e2e-core-07-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 7 12
  pr-e2e-core-08-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 8 12
  pr-e2e-core-09-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 9 12
  pr-e2e-core-10-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 10 12
  pr-e2e-core-11-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 11 12
  pr-e2e-core-12-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-core 12 12

  pr-e2e-workgraph-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-workgraph
  pr-e2e-tier-real-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-tier-real
  focus-e2e-tier-real-claude-acp-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-tier-real-scenario "behaviors 2,6,8,9"
  focus-e2e-tier-real-claude-native-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-tier-real-scenario "behaviors 3,6,8,9"
  focus-e2e-tier-real-codex-acp-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-tier-real-scenario "behaviors 4,6,8,9"
  focus-e2e-tier-real-codex-native-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-tier-real-scenario "behaviors 5,6,8,9"
  focus-e2e-tier-real-cursor-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-tier-real-scenario "behavior 7"
  focus-e2e-tier-real-web-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-tier-real-web
  pr-e2e-workgraph-journey-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh e2e-workgraph-journey
  pr-agent-runtime-stats-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh agent-runtime-stats
  pr-docs-links-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh docs-links
  pr-packages-dry-run-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh packages-dry-run
  pr-relay-bench-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh relay-bench
  pr-storybook-linux-aws:
    <<: *aws_linux_job
    command: bash script/cbx-ci-remote.sh storybook

  pr-unit-windows:
    provider: aws
    target: windows
    architecture: amd64
    # Override the repo-level Hetzner cpx42. Provider-specific jobs inherit
    # global scalar defaults unless they replace them explicitly.
    serverType: m7i.2xlarge
    market: on-demand
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File script/cbx-ci-windows.ps1 -Lane unit
    stop: auto

  pr-agent-runtime-stats-windows:
    provider: aws
    target: windows
    architecture: amd64
    serverType: m7i.2xlarge
    market: on-demand
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File script/cbx-ci-windows.ps1 -Lane agent-runtime-stats
    stop: auto

  focus-agent-sdk-runtime-windows:
    provider: aws
    target: windows
    architecture: amd64
    serverType: m7i.2xlarge
    market: on-demand
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File script/cbx-ci-windows.ps1 -Lane package -Package @claxedo/agent-sdk-runtime
    stop: auto

  focus-server-core-windows:
    provider: aws
    target: windows
    architecture: amd64
    serverType: m7i.2xlarge
    market: on-demand
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File script/cbx-ci-windows.ps1 -Lane package-test -Package @claxedo/server-core
    stop: auto

  pr-e2e-desktop-macos:
    # A native Mac is required. Point CRABBOX_HOST_ID (or trusted aws.macHostId
    # config) at a preallocated mac2 Dedicated Host; never commit the host ID.
    provider: aws
    target: macos
    # mac2.metal selects ARM64 itself. An explicit `architecture: arm64` is the
    # Linux ARM selector and Crabbox rejects that combination for macOS.
    architecture: null
    serverType: mac2.metal
    market: on-demand
    shell: true
    command: bash script/cbx-ci-macos.sh e2e-desktop
    stop: auto

  pr-agent-runtime-stats-macos:
    provider: aws
    target: macos
    architecture: null
    serverType: mac2.metal
    market: on-demand
    shell: true
    command: bash script/cbx-ci-macos.sh agent-runtime-stats
    stop: auto
