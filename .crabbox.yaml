# Crabbox repo config (v0.40 schema — unknown keys are silently ignored).
# Validate without spending capacity:
#   ./script/cbx doctor
#   ./script/cbx-ci.ts dry-run pr-linux
#
# AWS is the canonical manual pre-push provider. Hetzner remains available only
# through the explicitly named fallback group in script/cbx-ci.ts.
provider: aws
target: linux
architecture: amd64
# Match GitHub's Ubuntu 24.04 Linux runner. This also keeps jobs off Crabbox's
# Ubuntu 26.04 default, where Bun 1.3.14's baseline binary
# cannot load this repository's native N-API SQLite dependency.
os: ubuntu:24.04
serverType: m7i.2xlarge
market: on-demand
keep: true
ttl: 3h
idleTimeout: 45m

# Native Windows cannot recursively delete an installed worktree on every
# incremental sync: loaded native modules and generated executables may still
# hold file handles. Overlay the complete manifest instead; every named CI job
# gets an isolated lease, and caller-supplied warm leases intentionally retain
# dependency caches between focused reruns.
sync:
  delete: false
  # Seed the canonical public default branch before overlaying the dirty local
  # checkout. This preserves real Git metadata for CI policy checks while still
  # exercising uncommitted edits through Crabbox's normal manifest sync.
  gitSeed: true
  baseRef: dev

# Each entry is one GitHub check boundary. Run one failed lane by name, or use
# script/cbx-ci.ts to run a group and persist the exact failed set for `retry`.
# Linux and Windows use AWS. macOS remains separate because emulating it on
# Linux would not exercise the platform contract GitHub gates.
jobs:
  # Explicit Hetzner fallback selected by `pr-linux-hetzner`.
  pr-diagnostics-linux:
    provider: hetzner
    target: linux
    architecture: amd64
    serverType: cpx42
    shell: true
    command: bash script/cbx-ci-remote.sh diagnostics-linux
    stop: auto

  pr-unit-linux:
