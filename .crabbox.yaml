# Crabbox repo config (v0.40 schema — unknown keys are silently ignored).
# Validate without spending capacity:
#   ./script/cbx doctor
#   ./script/cbx-ci dry-run pr-linux
#
# NOTE: the pre-baked snapshot is NOT set here — Hetzner image override only works
# via the CRABBOX_HETZNER_IMAGE env var (see ./script/cbx wrapper).

provider: hetzner
target: linux
architecture: amd64
# The pinned Hetzner snapshot has a 160 GB disk floor, so cpx42 is the smallest
# configured runner that can boot it. script/cbx exports the snapshot ID.
serverType: cpx42
keep: true
ttl: 3h
idleTimeout: 45m

# Each entry is one GitHub check boundary. Run one failed lane by name, or use
# script/cbx-ci to run a group and persist the exact failed set for `retry`.
# Linux is immediately runnable through the repo's Hetzner wrapper. Native
# Windows and macOS remain separate because emulating them on Linux would not
# exercise the platform contracts GitHub gates.
jobs:
  pr-diagnostics-linux:
    provider: hetzner
    target: linux
    architecture: amd64
    serverType: cpx42
    shell: true
    command: bash script/cbx-ci-remote.sh diagnostics-linux
    stop: auto

  pr-unit-linux:
    provider: hetzner
    target: linux
    architecture: amd64
    serverType: cpx42
    shell: true
    command: bash script/cbx-ci-remote.sh unit-linux
    stop: auto

  pr-typecheck-linux:
    provider: hetzner
    target: linux
    architecture: amd64
    serverType: cpx42
    shell: true
    command: bash script/cbx-ci-remote.sh typecheck-linux
    stop: auto

  pr-e2e-core-01:
