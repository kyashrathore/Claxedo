      - Surfaces toggle via CSS `visibility`, not aria-hidden; retention keeps a
        small mounted set. Alternating two sessions by URL popstate re-resolves
        each time (route-intent -> openSession): during alternation only ONE
        session-page-root stays mounted and the backgrounded one reads back as a
        `new` shell — i.e. URL-nav does NOT reuse a warm mounted content here.
      - Same-harness re-measurement of URL-nav alternation reproduced the
        regression shape: ~197 ms median switch and ~160 MiB retained-heap growth
        over 100 switches (post-GC) on the Solid 2 arm.
    KEY METHODOLOGICAL POINT: whether URL-nav is "heavier" than rail-click is
    irrelevant to the COMPARISON, because BOTH arms were measured on the identical
    URL-nav path with the identical harness (Solid 1 arm d631aad, same demo
    fixtures). Path choice moves absolute numbers, not the relative result: Solid 1
    on the same path is still ~4.5x faster. So the "~4.5x slower" figure is a real
