# ─────────────────────────────────────────────────────────────────────────────
# WHAT WAS DONE — idiomatic Solid 2-native refactors (all within spec mutable
# scope: app/, features/session/, lib/, session-ui, ui). Each verified against
# the base tag: focused vitest green, full touched-surface sweep shows ZERO new
# failures, tsgo typecheck delta 0, architecture debt ratchet delta 0.
# ─────────────────────────────────────────────────────────────────────────────
refactors:
  - id: activation-batching
    commit: 8428ed00
    file: packages/claxedo-app/src/app/workbench/rail/rail-sidebar.tsx
    pattern: "Let automatic batching commit related writes (cheatsheet: batch removed; flush() only at imperative boundaries)"
    change: >
      Removed the navigation-wide flush() wrapping activateSession so the whole
      session switch commits once on the scheduler microtask instead of draining
      the reactive queue synchronously mid-handler. The archive control's
      flush-based double-click guard became a plain in-flight boolean; the signal
      now only drives the disabled presentation.
    verification: "vitest src/features/session/ui/navigation + rail-sidebar-disclosure green (27/27)"

  - id: single-workbench-store
    commit: 533457df
    file: packages/claxedo-app/src/app/workbench/workbench/provider.tsx
    pattern: "Use one draft-first authoritative store (cheatsheet: stores; eliminate scratch/reconcile duplication)"
    change: >
      WorkbenchProvider kept a SECOND reconciled store and re-reconciled every
      mutation into both it and the consumer store, with a hand-rolled deep
      structural compare (sameWorkbenchState + 6 helper comparators) guarding the
      outer write. Reads now go straight to the consumer store, writes flow once
      through onChange, reconcile's own diffing replaces the comparators. Same-task
      read-after-write chaining stays owned by the scratch cache in useWorkbench.apply.
    verification: "provider-reconcile.vitest + N-reactivity green; behavior identical"

  - id: entity-local-metadata
    commit: baf95d39
    files:
      - packages/claxedo-app/src/app/workbench/state/metadata.ts
      - packages/claxedo-app/src/app/workbench/content/index.tsx
      - packages/claxedo-app/src/features/session/ui/content/session-content.tsx
      - packages/claxedo-app/src/features/session/ui/session-screen.tsx
    pattern: "Localize mutable collections; derive instead of synchronize (cheatsheet: entity-local reconcile, property-level tracking)"
    change: >
      Replaced the metadata slice's manual version-bump signal + whole-object
      storePath replacement with entity-local store writes: set/upsert/patch
      reconcile into the existing entity node so a field change wakes only that
      field's readers, and ids() tracks key structure alone (no global version).
      Three consumers dropped their meta.ids() registry-wide subscriptions and
      rely on keyed get() reads, so a status prime on one session no longer wakes
      every mounted surface. The open-session registry keeps its push callback
      (bridge to an external non-reactive consumer), unchanged.
    verification: "metadata semantics test green; open-sessions + cache-cleanup unchanged"

