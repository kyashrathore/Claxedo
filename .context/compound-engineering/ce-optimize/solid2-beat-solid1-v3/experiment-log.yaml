microbenchmark:
  file_metadata: packages/claxedo-app/src/app/workbench/state/__bench__/reactive-work.bench.vitest.ts
  file_provider: packages/claxedo-app/src/app/workbench/workbench/__bench__/provider-work.bench.vitest.ts
  workload: { switches: 106, sessions_metadata: 120, sessions_provider: 40, reps_per_run: 7, runs: 3 }
  results:
    metadata_slice:
      control_wakes_per_switch: 2      # global version bump wakes the id-set observer every switch
      candidate_wakes_per_switch: 1    # entity-local write wakes only the changed field
      wake_ratio: 0.50                 # stable across all runs
      wallclock_ratio_range: [0.176, 0.260]   # candidate ~4-5.7x faster
    workbench_provider:
      wake_ratio: 1.00                 # identical subscriber wakes -> behavior preserved
      wallclock_ratio_range: [0.461, 0.490]    # candidate ~2x faster (second store + deep compare removed)
  interpretation: >
    On the session-switch hot path the refactor strictly reduces reactive-graph
    work: the metadata slice halves observer wakes and cuts wall-clock ~5x by
    replacing global version invalidation with entity-local reconcile; the
    workbench provider preserves subscriber behavior exactly (wake_ratio 1.0)
    while halving wall-clock by removing the duplicate store and deep compare.
    This is consistent with the contract's expected direction but is main-thread
    reactive-work evidence only — it does not measure paint, RSS, or the CDP
    switch latency the contract gates on.

