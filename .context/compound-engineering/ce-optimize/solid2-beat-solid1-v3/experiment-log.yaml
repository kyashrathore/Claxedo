  reuse_path_reconfirmed: >
    RE-INVESTIGATED the "am I measuring a pathological path?" doubt directly on
    the current demo build (candidate HEAD), and it strengthens rather than
    weakens the verdict. Findings (Chromium 1194 + CDP, offline demo):
      - The demo rail renders ZERO session rows (no [data-testid^=
        "rail-sidebar-session-list"], listCount 0) and exposes no compact-switcher
