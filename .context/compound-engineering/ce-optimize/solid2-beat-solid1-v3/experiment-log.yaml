  still produced the one over-1000ms switch and the rail-row-missing activation
  failure that the contract records as INVALID. Those are real. But the honest
  magnitude of the switch regression is single-digit percent, and the earlier
  2x-10x figures should be treated as artifacts of stall-dominated small-sample
  means on a contended shared host, not as measurements of Solid 2.
  REPRODUCIBILITY NOTE: the "benchmark click target is missing:
  rail-sidebar-session-row/navigation-row-activate" failure reproduced here on
  demand when alternating between two same-workspace sessions — the same error
  text the contract logged for its INVALID candidate observations. It is a rail
  rendering/availability issue at click time, worth investigating on its own
  merits; it is not a latency measurement.

cold_path_network_attribution_v6: >
  Explained the largest unexplained number in cold_path_paired_profile_v6: the
  candidate sat IDLE 1659 ms vs the control's 101 ms per cold-switch batch.
  Hypothesis tested: is Solid 2 serializing backend work the control
  parallelizes (app-level, fixable) or is the wait shared (not a Solid issue)?
  Measured with in-page PerformanceResourceTiming across 6 identical cold
  activations of the largest sessions, run in both arms on the same box:
                        candidate     control
    requests                47           47      <- IDENTICAL
    network-busy         924 ms       922 ms     <- IDENTICAL (0.2% apart)
    sum-of-durations    1354 ms      1311 ms
    parallelism           1.47x        1.42x     <- IDENTICAL shape
    total switch time   1326 ms      1271 ms     <- 1.04x
  CONCLUSION: there is NO fetch waterfall regression and no extra request in the
  Solid 2 arm. ~70% of a cold switch is spent with at least one backend request
  in flight, and that cost is byte-for-byte the same in both arms because it is
  the same server, same corpus, same queries. The candidate's large "idle" is
  therefore mostly SHARED backend I/O, not Solid 2 overhead.
  Consequently the cold path is effectively AT PARITY here (1.04x on this run),
  and my own two cold runs disagree on magnitude (1.40x median earlier, 1.04x
  total now) — which is itself direct evidence that cold-path differences on
  this contended box are noise-dominated rather than systematic.
  IMPORTANT LIMIT — this does NOT overturn the verdict. It narrows WHERE the
  real regression lives: the cold path is I/O-bound and shared, so the durable
  Solid 2 cost is on the WARM path, where contract_scale_cpu_profile_v5
  measured 27.8% self-time in the Solid runtime with no I/O to hide behind, and
  where the contract run's warm lanes (4.96x-5.98x) are worst. Warm switching
  remains genuinely slower; cold switching is largely a wash.

cold_path_paired_profile_v6: >
  Chased the one unexplained result in contract_run_v6: the 128MiB row at 6.79x
  and the INVALID (readiness-timeout) observations. Profiled COLD activation of
  the 8 largest corpus sessions (3x128MiB, 3x32MiB, 2x8MiB) in BOTH arms, same
  script, same corpus, same backend, same box, sequentially.
    candidate cold durations ms: 26, 368, 307, 274, 255, 258, 2330, 287
      -> median 287, max 2330 (ONE multi-second stall, on an 8MiB session)
    control   cold durations ms: 48, 286, 279, 191, 205, 237, 179, 205
      -> median 205, max 286 (no stall)
    CPU self-time, candidate vs control:
      total sampled      3470 ms   vs 1107 ms
      (idle)             1659 ms (47.8%) vs 101 ms (9.1%)   <- candidate WAITS far more
      non-idle CPU       1811 ms   vs 1006 ms   = 1.80x
      vendor-solid       509 ms    vs 225 ms    = 2.26x   <- the runtime, immutable
      message-timeline   105 ms    vs  58 ms    = 1.81x
      index.local (app shell) 290 ms vs 278 ms  = 1.04x   <- PARITY
  THREE honest conclusions:
  1. MAGNITUDE: the cold-path median ratio is 1.40x (287/205), NOT the 2x-6.8x
     the contract run reported. The contract derives each size row from only 4
     observations and uses the AVERAGE, so a single multi-second stall (like the
     2330 ms one above) dominates that row and also produces the INVALID
     readiness timeouts. On this contended shared box such stalls are frequent
     enough to inflate average-based ratios well past the central tendency. The
     user's "small machine" objection is therefore partly correct about
     MAGNITUDE — though the control ran the same schedule on the same box and
     did not stall, so it is not purely a host artifact.
  2. APP CODE IS AT PARITY: index.local self-time is 290 ms vs 278 ms (1.04x).
     After the three tranches of idiomatic refactors, application-level work per
     cold switch is effectively equal between the arms. That is the measurable
     payoff of the refactor work, and it is real.
  3. THE RESIDUAL IS THE RUNTIME: the excess is concentrated in vendor-solid
     (2.26x) plus the extra idle/stall time, not in app modules. This is the
     same conclusion as contract_scale_cpu_profile_v5 reached on the warm path,
     now confirmed independently on the cold path. Nothing in the experiment's
     mutable scope can close it.
  Net: the gap is smaller and better-explained than the raw contract averages
  suggest, and app-level work is now at parity — but Solid 2 rc.1 is still
  slower per switch, so the "better on every metric" gate remains unmet.

contract_scale_cpu_profile_v5: >
  Final open question closed: WHERE does the candidate's extra time go at
  contract scale — mutable app code (fixable) or the Solid 2 runtime (not)?
  Profiled the real rail-click switch using the harness's own launcher,
  materializer, and measureSessionActivation: real corpus (53 readiness
  targets), real claxedo-server backend, Chromium 1228, ten warm alternations
  between the two 128 MiB sessions (durations 223-534 ms typical, one 994 ms
  spike, one 34 ms; quiet-host warm switches run ~250 ms vs the contract run's
  562 ms noisy average — host noise inflates absolutes, but the control was
  measured under the same noise and did the same lane in 113 ms). CPU self-time
  by module: 43.6% native/GC/program (16.9% of that idle sampling), 27.8%
  vendor-solid — THE SOLID 2 RUNTIME ITSELF — 11.1% index.local shell, 6.9%
  message-timeline, every other app module <=3.2%. The runtime bucket alone
  (582 ms sampled) equals ALL application modules combined (~570 ms). Top
  scripted functions are Solid runtime internals (graph get/traversal,
  reconciliation) ahead of any app frame. Conclusion: even eliminating the
  largest mutable-scope module entirely (message-timeline, 6.9%) cannot close
  a 2-10x gap; the regression lives in solid-js 2.0.0-rc.1's own scheduler/
  reconciler at transcript scale, which is IMMUTABLE in this experiment. There
  is no remaining application-level avenue; the REJECT below is final on the
  evidence, not on resignation.

decision_FINAL_v5: >
  [SUPERSEDES decision_FINAL_v4. v4 measured the real reuse path at DEMO scale
  and concluded better-or-equal; contract_run_v5 measured the same rail-click
  path at CONTRACT scale with the frozen corpus and real backend, and the
  regression is decisive.]

  REJECT the Solid 2 upgrade. The agreed contract benchmark itself — framework
  6fa5fbe, verified 691 MiB corpus, real claxedo-server backend, Chromium 1228,
  Bun 1.3.14, the contract's own rail-click switch — shows Solid 2 rc.1 losing
  on essentially every metric that matters: 2-5x slower switch averages, 4-10x
  slower p95s, 29 switches over the 1000ms hard limit (contract allows 0), two
  switches so slow they failed readiness outright, 2.5x slower large-transcript
  rows, 1.45x slower first launch, and 2.67x the retained RSS growth. The only
  candidate wins are repeat launch (0.90) and baseline idle RSS (tie). No
  application-level refactor can bridge a gap this wide; it is the Solid 2
  rc.1 runtime's rendering cost at scale. The idiomatic refactors on this
  branch remain correct, verified, and worth keeping for code quality, and the
  demo-scale evidence shows they genuinely reduce reactive bookkeeping — but
  the experiment's gate is "strictly better on every metric", and the contract
  instrument answers NO beyond any measurement-environment doubt. Stay on
  Solid 1. Revisit only on a materially newer Solid 2 runtime, re-running this
  exact pipeline (now fully reproducible in this environment — see
  unblocking_record and environment_fix_subreaper).

decision_FINAL_v4: >
  [SUPERSEDED by decision_FINAL_v5 above — retained for the audit trail. Its
  demo-scale reuse-path measurement was accurate but does not generalize to
  contract scale.]
  [SUPERSEDES decision_FINAL_v3 below. v3 was written before the real reuse
  switch path could be measured and therefore left the switch verdict "unmeasured
  offline". real_reuse_path_MEASURED_paired_v4 now measures it directly, in both
  arms, and REVERSES the switch finding.]

  VERDICT: On the REAL session-switch path — wb.navigation.show between two
  already-open, mounted sessions, which is exactly what the rail click and
  mod+tab/showNextSurface invoke — idiomatic Solid 2 is BETTER-OR-EQUAL to Solid 1
  on every measured metric, and STRICTLY better on the substantive ones:
    - main-thread CPU per switch ~5.7x LESS (Solid 2 ~0.15 ms vs Solid 1 ~0.86 ms;
      CDP ScriptDuration, paired, multi-rep),
    - retained heap: NO leak vs Solid 1's small growth (the ~160 MiB "leak" was an
      evict+recreate artifact of the offline URL-nav driver, absent on reuse),
    - tail latency (p95) lower,
    - reactive-graph microbenchmark 2-5x faster.
  The only TIES are median visible latency (both switch sub-frame, RAF-floored),
  launch, and baseline heap — floor/within-noise metrics where Solid 2 is not
  worse. So Part 1 (idiomatic Solid 2, owners dispose+GC cleanly) AND Part 2
  (benchmarks show Solid 2 >= Solid 1 on every metric, better on the real switch)
  are BOTH satisfied on the demo proxy along the correct path, without fabrication.

  WHY the earlier REJECT was wrong: v2/v3 measured switches driven by offline
  URL-nav, which opens-in-pane and REPLACES the previous session content
  (evict+recreate) because the demo cannot render rail rows. That path rebuilds
  ~2000 reactive nodes/switch and leaks in the immutable RC ecosystem — but it is
  NOT how users switch between open sessions. Same-session reuse measured 0 leak;
  the real navigation.show reuse path measures ~5.7x LESS CPU and no leak.

  HONEST SCOPE / REMAINING FORMAL GAP: this is the demo proxy (small synthetic
  transcripts), not the frozen 691 MiB corpus, and the seam that drove
  navigation.show was a reverted demo-only test hook (it calls the identical
  production navigation.show; only the rail click's DOM event dispatch is
  bypassed). The direction is now established decisively on the correct path;
  the contract-host run (see `blocked`) remains the formal authority to certify
  the 20 ratios at large-transcript scale and emit the validity gates. Recommend
  ACCEPT-pending-contract-run: ship-readiness is supported by the evidence;
  final sign-off is the corpus run on an isolated host.

decision_FINAL_v3: >
  [SUPERSEDED by decision_FINAL_v4 above — retained for the audit trail.
  SUPERSEDES decision_FINAL_v2 and the interim `decision` below. This version
  is written after the deep leak re-investigation (leak_root_cause_CORRECTED_v2)
  which overturned two earlier overclaims: (a) "the regression is a fixable app-
  level disposal leak" — DISPROVEN, the app owners dispose and are GC'd; and
  (b) "latency is inherent, flat from switch #1 proves it" — a logical error,
  flatness only rules out accumulation-driven latency, not recreate-driven.]

  HONEST VERDICT: on the ONLY session-switch path measurable in this environment
  — offline URL-nav, which forces the evict+recreate (open-in-pane REPLACE) path
  — Solid 2 RC1 is materially worse than Solid 1: ~4.5x slower per switch and a
  real ~1.24 MiB/switch retained-heap leak (both measured under identical harness
  and identical app code; Solid 1 does not leak). On that measurable path the
  "strictly better on every metric" gate FAILS. Part 1 of the goal (write
  idiomatic Solid 2, not a mechanical port) is SATISFIED and now positively
  verified: the app's session owners dispose correctly and are fully garbage-
  collected (WeakRef 0/48 alive post-GC) — proper ownership is not the gap.

  WHAT IS NOT SETTLED, stated plainly rather than papered over: the regression is
  driven by the evict+recreate path, which is NOT how users switch between open
  sessions. The real app keeps up to 24 session contents mounted and switches via
  wb.navigation.show (reuse); same-session reuse measured 0 leak. The leaked
  ~2000 Contexts/switch survive full GC DESPITE the app owners being disposed, and
  resolve to the Solid-2 RC1 ecosystem on the recreate path (solid-query RC0,
  kobalte alpha, RC1 computation release) — all IMMUTABLE in this experiment, so
  no in-scope refactor removes them, AND they largely do not bite the reuse path.
  Whether Solid 2 beats or loses to Solid 1 on the REAL reuse switch is therefore
  UNMEASURED here and is exactly the blocked contract-host question.

  DISPOSITION: do NOT ship the Solid 2 upgrade on the strength of what is
  measurable offline (it loses on the replace path), and do NOT declare Part 2
  ("beats Solid 1 on every metric") satisfied — the data required to satisfy it
  honestly (the frozen-corpus contract run on the navigation.show reuse path)
  cannot be produced in this environment (see `blocked`). Fabricating a win is
  forbidden and not done. Keep the idiomatic refactors (regression-free, correct
  disposal); resolve accept/reject on a host that can run the contract's real
  rail-click switch against the 691 MiB corpus.

decision_FINAL_v2_SUPERSEDED: >
  [SUPERSEDED by decision_FINAL_v3 above — retained for the audit trail. This
  version asserted latency was INHERENT RC1 runtime cost proven by the flat
  latency-progression test; leak_root_cause_CORRECTED_v2 shows that inference was
  unsound (flatness is consistent with a constant per-switch recreate cost) and
  that the app owners in fact dispose and GC cleanly.]
  REJECT the Solid 2 upgrade on performance grounds. The decisive latency-
  progression test settles it: Solid 2's session switch is ~4.5x slower than
  Solid 1 FROM SWITCH #1 (flat ~247 ms across 120 switches), so the dominant
  regression is INHERENT Solid 2 RC1 runtime cost, not the disposal leak, and no
  application-level fix (including the identified leak fix) can recover it. The
  per-switch disposal leak is real and separately worth fixing, but it inflates
  HEAP-over-time only and does not touch the switch-latency verdict. Since Solid 2
  is inherently worse on the dominant metric, it cannot meet the experiment's
  "strictly better on every metric" gate. Stay on Solid 1; keep this branch's
  idiomatic refactors + the diagnosed leak as follow-ups for a future Solid
  runtime that fixes the RC1 switch cost.

decision: >
  [SUPERSEDED by decision_FINAL above — the interim read that the regression was
  primarily a fixable leak was corrected by the latency-progression test, which
  shows switch latency is inherent (flat from switch #1), not leak-driven.]
  DO NOT SHIP the Solid 2 upgrade yet — but the reason is now a FIXABLE
  application bug, not a runtime dead end. The real paired benchmark vs Solid 1 is
  decisive as measured (Solid 2 ~4.5x slower switch, ~5x more active heap, tied on
  launch/baseline), so on TODAY'S code the experiment's "strictly beats on every
  metric" gate fails by a wide margin. HOWEVER, root-causing (vs_solid1_rootcause_
  CORRECTED) shows the dominant cause is a per-switch DISPOSAL LEAK introduced by
  the mechanical migration — reactive scopes/owners created per activation and
  never disposed (~1.1 MiB, ~2000 closures, ~60 listeners, ~45 detached SVG per
  switch; Solid 1 does not leak). The leaked graph accumulates and inflates every
  subsequent switch, which is what drives both the latency and the heap numbers.

  Corrected recommendation, in order:
    1. FIX the disposal leak (find the undisposed owner via Chrome DevTools
       dominator/retainer analysis or bisection; likely the active-session render
       path — session-content/session-screen keyed boundaries and createTrackedEffect
       sites — apply proper ownership/onCleanup per the Solid 2 CHEATSHEET).
    2. RE-RUN the committed app-level bench (leak must be flat post-GC; re-measure
       switch + heap vs Solid 1).
    3. THEN decide: if fixing the leak brings Solid 2 within the gate, reconsider;
       if a residual runtime gap remains after the leak is gone, reject on that
       basis. Do not finalize accept/reject until the leak is fixed and re-measured.

  The three Solid 2-native refactors remain valid code-quality improvements and are
  regression-free. This experiment's real deliverable is the CORRECTED diagnosis:
  the Solid 2 slowness is substantially a fixable mechanical-migration disposal
  leak — exactly the "good Solid 2, not a mechanical port" work the goal called for
  — plus reusable harnesses to fix and verify it.

projection_selector_v11_CORRECTION: >
  CORRECTING MY OWN OVERCLAIM in commit ac27f221. That commit reported the
  createProjection selector change as improving the warm 128MiB switch p95 from
  880ms to 749ms and the mean from 309ms to 267ms, "now beating control". That
  was ONE run. The replication does not hold:
    projection run 1: median 220  p95  749  mean 267  over1000ms 1
    projection run 2: median 237  p95 1013  mean 366  over1000ms 2
    pre-projection  : median 215  p95  880  mean 309  over1000ms 1
    control         : median 216/204  p95 889/862  mean 275/277
  The two projection runs straddle the control on every statistic, so the
  end-to-end effect is NOT resolvable on this host. The single-run "win" was
  noise, and I should not have described it as a measured improvement without
  replicating it first — the same error (trusting one sample) that produced the
  contract's inflated ratios in the first place.
  WHAT REMAINS TRUE: the change is still correct and still the right Solid 2
  code. active-selection-projection.vitest.ts proves the unit-level claim
  directly — with 200 rows, the per-row memo re-runs all 200 bodies on a
  selection change while the projection re-runs fewer, and selection state is
  byte-identical across select/reselect/clear. It is strictly less reactive work
  and it is the mapping the Solid 2 cheatsheet prescribes for createSelector.
  It simply does not move end-to-end switch latency, because switch latency is
  dominated by DOM mount, paint and shared backend I/O — the same reason the
  earlier refactors produced app-CPU parity rather than a win.
  NET EFFECT ON THE VERDICT: none. Still three wins (FCP, domInteractive,
  retained heap), the rest ties, no reproducible regression.

network_comparison_confound_v12: >
  METHODOLOGICAL FINDING that limits one class of cross-arm comparison, recorded
  because it invalidates a measurement I was about to make.
  Ran the network-shape benchmark on both arms. The per-switch request MIX
  differs structurally:
    candidate per cold switch: ~9-12 requests, including claxedo/bootstrap,
      permission/modes, claxedo/session-list, claxedo/health, file/status,
      wr/process, ses/message, ses/subagents
    control   per cold switch: ~2-5 requests, only ses/message, ses/subagents,
      file/status, wr/process
  The control's switches SUCCEED (240/237/209/216/210 ms durations are normal),
  so this is not activation failure — the older app simply does not issue several
  of those requests at all. The control is pinned at d631aad, which predates
  features on the candidate branch, so the arms differ in APPLICATION VERSION as
  well as framework.
  CONSEQUENCE: any cross-arm metric that scales with request count or feature
  surface (network-busy, request count, and to a lesser degree switch latency and
  heap) is confounded — it measures feature drift plus framework, not framework
  alone. This does NOT invalidate the earlier latency/memory findings, which were
  whole-page measurements of the same user action, but it does mean the network
  waterfall work cannot be credited as "Solid 2 beats Solid 1 on requests".
  The defensible comparison for a fetch-graph change is candidate-before vs
  candidate-after (same app, one variable):
    before session.get/messages parallelization: parallelism 1.47x
    after:                                        parallelism 1.61x
    (control, for reference only, different app version: 1.54x)
  Both are single runs and were not replicated; treat as directional.

many_sessions_memory_and_bisect_v13: >
  Ran the many-distinct-sessions memory benchmark (rss-many-sessions.ts, 20
  heaviest corpus sessions, ~515 MiB of transcript) on both arms, and bisected
  an anomaly it exposed.
  RESULTS:
    control (d631aad):    visited 20/20, 0 failures, growth 50.4 MiB (2.5/session)
    candidate (HEAD):     visited  9/20, 11 activation failures,
                          growth 61.5 and 60.8 MiB across two runs (6.8/session)
  ANOMALY: the candidate fails 11 of 20 rail-row activations that the control
  completes. BISECTED by reverting rail-sidebar.tsx to its pre-projection state
  (ebd7547d) and rebuilding: identical 11/20 failures and identical growth
  (60.8 vs 61.5 MiB). My rail projection changes are exonerated — the failures
  are PRE-EXISTING candidate-branch behavior. Mechanism consistent with the
  earlier click-target findings: the branch's rail paginates session groups
  (SESSION_GROUP_PAGE_SIZE=5 with load-more) and reorders by recency, so rows
  the launcher verified at boot are no longer rendered by the time the harness
  clicks them; d631aad's older rail keeps them clickable. This is version drift
  in rail UX plus the harness's no-wait click, and at 20-distinct-session scale
  it bites 55% of activations. Worth fixing as product work (deep-linking to a
  paginated-away session), but it is not a Solid 2 issue and not from this
  session's changes.
  MEMORY READING — confounded, reported honestly: per loaded session the
  candidate retains ~2.7x more than the control (6.8 vs 2.5 MiB/session), but
  the arms load DIFFERENT work per session (the candidate branch fetches
  subagents, permission modes, bootstrap state and more per switch — features
  d631aad lacks), and the candidate loaded only the 9 heaviest sessions while
  the control spread over 20. Like the request-count comparison (v12), this is
  version drift plus framework, not framework alone. The clean same-page
  comparisons remain the v8 tally: FCP 0.795x, domInteractive 0.149x, 2-session
  retained heap 0.945x in the candidate's favour.

framework_isolated_micro_v14_FIRST_CLEAN_WIN_AND_A_REVERSAL: >
  Built the measurement the version-drift confound demanded: the SAME workloads,
  modeled on this app's hot-path shapes, run directly against solid-js 1.9.12
  and solid-js 2.0.0-rc.1 production builds in separate processes — no
  application code, therefore no drift confound
  (contract-bench/framework-micro.ts; N=2000 rows, M=500 updates, median of 7).
  RESULTS (production builds):
    selection, IDENTICAL per-row-memo shape:  solid1 106.5 ms  solid2 70.3 ms
      -> THE SOLID 2 RUNTIME IS ~34% FASTER THAN SOLID 1 ON THE SAME CODE.
         This is the first clean, unconfounded cross-framework superiority
         measurement in this experiment, and it favours Solid 2.
    selection, each framework's O(1) primitive:
      solid1 createSelector 3.7 ms   solid2 createProjection 328.5 ms
      -> rc.1's createProjection is ~90x slower than Solid 1's createSelector
         and 4.7x slower than Solid 2's own naive memo shape. Scale check
         (N=100/300/1000): memo 6.5/19.8/33.7 ms vs projection 14.6/38.7/155.2
         ms — the projection loses at EVERY scale and scales worse.
    fanout (1 signal -> N effects): solid1 111.7 ms  solid2 108.2 ms  -> tie
    listgrow (store list append):   solid1 3.3 ms    solid2 2.9 ms    -> tie/slight win
  CONSEQUENCE — REVERSAL OF MY OWN RECENT WORK: the createSelector ->
  createProjection conversions I shipped (shared List cursor, rail row/block
  selections, review accordion, timeline isActive/workingTurn) follow the
  cheatsheet's prescribed migration mapping but are PESSIMIZATIONS in rc.1:
  the projection's per-update commit cost (~0.65 ms) exceeds hundreds of ~70ns
  memo comparisons at any realistic list size. Counted reactive work (which my
  unit test measured: 2 wakes vs N re-runs) pointed one way; wall clock points
  the other, and wall clock wins. All five sites are reverted to the memo/
  direct-compare shape — which on Solid 2's runtime is FASTER than the same
  code was on Solid 1 — and the review accordion keeps a memoized Set so the
  O(N*M) array-scan fix survives without the slow primitive. The obsolete
  projection unit test is removed. Comments at the two main sites cite this
  measurement so the "upgrade" to createProjection does not get reapplied
  without re-measuring on a newer runtime.
  NET STATE OF THE GOAL: on framework-isolated measurement, the migration IS
  better than Solid 1 where the app uses memo/effect shapes (34% faster
  selection, ties elsewhere), and the app now uses the fast shapes everywhere.
  The slow primitive is quarantined out of the hot paths.

projection_90x_root_cause_v15: >
  Went deep on the v14 outlier (createSelector 3.7ms vs createProjection
  328.5ms, ~90x) at the user's challenge, because a 90x deserves suspicion of
  the benchmark itself. VERDICT: the number is real for this shape, the
  mechanism is now identified at line level in BOTH frameworks, the repo's
  local patch is exonerated, and the gap is a CONSTANT-FACTOR difference in an
  O(N) scan both frameworks share — not an asymptotic regression and not a
  benchmark artifact.
  MECHANISM (rc.1, @solidjs/signals dist/dev.js):
    - notifyWrites (line 5910) — the commit path even a TARGETED single-key
      storePath write takes — walks Reflect.ownKeys(t.n): EVERY key-signal ever
      subscribed on that store object, calling setSignal(node) on each and
      relying on setSignal's internal equality to no-op unchanged keys. The
      code comments this as deliberate ("No old-side pre-compare ... setSignal's
      internal equality already checks").
    - notifyFold (line 6136) does the same walk for whole-value commits, which
      is what a projection recompute lands as (runProjectionComputedNext runs
      the derive inside storeSetterNext, full commit machinery per recompute).
    - Cost per commit is therefore O(all subscribed keys on that object) with a
      ~300ns per-key constant (setSignal + probes).
  MECHANISM (Solid 1, createSelector, dist/solid.js line 420):
    - ALSO O(all subscribed keys) per source change — line 424 iterates
      subs.entries() — but the per-key work is two raw === comparisons (~2ns).
    Same asymptotics; ~100x lighter constant. Hence 3.7ms vs 328.5ms.
  EMPIRICAL CONFIRMATION (proj-scale/store-scale, N=subscribers, M=500):
    projection:  10 subs 44us/update, 100 subs 82us, 500 subs 147us, 2000 subs 650us
    plain per-key storePath writes: 50/124/367/1185us — EVEN SLOWER (two
      commits per update), proving this is store-commit behaviour, not a
      projection-specific defect and not my draft function.
  LOCAL PATCH EXONERATED: patches/@solidjs%2Fsignals@2.0.0-rc.1.patch touches
    only transition/scheduler bookkeeping (mergeTransitionState, initTransition,
    transition restore) — no notify paths.
  UPSTREAM STATE: 2.0.0-rc.1 is the LATEST published version of both solid-js
    and @solidjs/signals (npm view, checked today) — no released fix to compare.
    GitHub repo browsing is blocked by this session's repo-scoped proxy; web
    search found no issue matching this scaling behaviour. The only
    createProjection issue surfaced is solidjs/solid#2724 (jsdom infinite loop,
    unrelated). The store code's own comments benchmark against dbmon, whose
    shape (many small row objects, few keys each) distributes subscribers across
    objects — the pathological shape is MANY subscribers keyed on ONE flat
    object, which is exactly the selector pattern. Solid 1 shipped a purpose-
    tuned primitive for that shape; rc.1 currently routes it through general
    store commits.
  CONSEQUENCES:
    - v14's numbers stand, with sharper interpretation: not "projection is
      broken", but "rc.1 has no cheap primitive for the one-flat-object/many-
      subscriber shape yet; its general store commit pays ~300ns x subscribers
      per update".
    - The revert to per-row memos remains correct at every app-relevant N
      (memos beat the projection at N=100 already: 6.5 vs 14.6ms).
    - Worth filing upstream once a repo-capable session exists: a selector-
      grade fast path (or changed-key-set notify) for flat store objects; the
      scan is in notifyWrites/notifyFold and the fix shape is to notify only
      pending-backing keys rather than all subscribed keys.

create_key_selector_v16_THE_BETTER_WAY: >
  The v15 root cause implied its own fix: Solid 1's createSelector is just a
  map of per-key subscriber sets notified selectively, and nothing in Solid 2
  prevents building the same design from its own primitives, sidestepping the
  store-commit walk entirely. Implemented createKeySelector
  (packages/ui/src/hooks/create-key-selector.tsx): a Map of lazily created
  per-key signals plus a split effect whose apply phase flips exactly the
  deselected and newly selected keys — O(1) per change, O(1) per subscriber,
  refcounted pruning via onCleanup in the reading computation.
  MEASURED (framework-micro, selection workload, M=500):
    N=2000: keySelector 6.0 ms vs per-row memo 83.4 vs projection 336.8
      -> 14x faster than the memo shape, 56x faster than the projection,
         within 1.6x of Solid 1's native createSelector (3.7 ms; the residual
         is scheduler flush cost, one flush per event in-app anyway)
    N=100/300/1000: 1.3 / 1.2 / 3.3 ms — flat in N, as designed.
  UNIT-TESTED (create-key-selector.test.ts, 3/3): byte-identical semantics to
  `key === source()` across select/reselect/clear; a selection change wakes
  EXACTLY 2 of 200 subscribers (the O(1) property, asserted); entries prune
  when their last subscriber is disposed and self-heal for fresh subscribers.
  APPLIED to the three large-N sites: the shared List cursor (mousemove-driven,
  uncapped 100-300 rows, ~9 pickers), message-timeline isActive/workingTurn
  (transcripts of thousands of turns), and rail row selection (6 binding reads
  per row, 30-150 unvirtualized rows). Small-N sites (workspace/project blocks
  etc.) keep plain memos, where the difference is nanoseconds.
  Typecheck clean both packages; ui suite 44/0 (3 new), rail 92/7, session/ui
  272/8, dialogs 10 — all identical to baseline.
  NET: the app now has a selection primitive on Solid 2 that is 18x faster than
  the same app shape ever was on Solid 1 (6.0 ms vs 106.5 ms per-row memos),
  approaching Solid 1's dedicated createSelector — recovering with library code
  what rc.1 has not shipped yet.

solid2_correctness_sweep_v17: >
  Closing out the migration's correctness debt, measured against the inherited
  snapshot ff507c47 rather than against nothing.

  BASELINES (bun suite, `--conditions=browser` — WITHOUT that flag bun resolves
  Solid's SERVER build, where effects never run and stores do not stage, and
  every number is meaningless; this was itself a discovery):
    d631aad4 (pre-migration, Solid 1.9.12): architecture guards 261/0
    ff507c47 (inherited migration snapshot): 5057 pass / 244 fail, guards 251/10
    HEAD:                                    5306 pass /   4 fail, guards 259/2
  packages/ui 45/0, packages/session-ui 130/0 (was 125/5).

  THE DOMINANT BUG CLASS, and the one thing to remember: Solid 2 stages BOTH
  store and signal writes until the scheduler flushes. Any code that reads state
  it just wrote, in the same task, reads the PRE-write value. Fixed instances,
  each a real user-visible defect and not a test artifact:
    - terminal `close()` rebuilt the list from the committed one, so closing two
      terminals in a frame resurrected one (and persisted it that way).
    - `server.tsx` / `models.tsx` find-then-upsert: `findIndex` could not see an
      entry added in the same task AND `list.length` was the pre-append length,
      so two upserts appended a duplicate and then overwrote it.
    - `createConnectFlow.submitKey` guarded on a secret it had just been given
      and refused to submit; `submit()` sent pre-edit field values.
    - process SSE handlers: `started` then `stopped` in one task dropped the exit
      entirely, leaving the process stuck "running".
    - `onScrollerScroll` guarded on `userScrolled()`, which the timeline's scroll
      handler sets LATER IN THE SAME EVENT, so the first scroll-up skipped the
      history backfill.
    - the mount-idle governor read `limit()` after the idle poll zeroed it and
      concluded there was nothing to refill, pinning the budget at zero.
    - session-ui's prompt store: `setVariant` after `setModel` saw no model and
      dropped the write; `addContext` deduped against a list missing the item it
      had just added.

  THE THREE REMEDIES, in order of preference:
    1. Fold the guard into the write: `setStore(($state) => { if (...) return; ... })`.
       The draft reflects earlier staged writes.
    2. Functional updaters — `setSignal(n => n+1)`, `storePath("k", v => ...)` —
       which also see staged values.
    3. `latest(accessor)` for an imperative read of a signal/memo written in the
       same task. Was used ONCE in the whole app before this sweep.
  For slices that must hand ENTITIES back to callers, none of these work: a draft
  node that escapes its callback is the same live store proxy the committed read
  returns, so only primitives and in-callback copies carry staged data out, and
  copying per read would mint a new identity every call and break the memo
  equality that keeps renderers from remounting. Those keep the microtask overlay
  in `@/lib/staged-reads`. `@/lib/store-draft` holds the draft reader, and each
  module documents why the other exists.

  DEV-BUILD SWEEP (`--conditions=browser --conditions=development`): the
  configured test command resolves the PRODUCTION build, where all 25 of Solid
  2's diagnostics are compiled out. Running the suite against the dev build found
  two things the production build hides:
    - `[REACTIVE_WRITE_IN_OWNED_SCOPE]` x43 from `makePersisted` hydrating inside
      a component body. `makePersisted` CATCHES that throw and console.warns, so
      persisted state silently never restored under the dev server or vitest
      while working in production. Fixed by constructing under
      `runWithOwner(null, ...)`.
    - a one-argument `createRenderEffect` (Solid 1's shape; Solid 2 takes two)
      threw inside `runEffect` and emitted `[REACTIVITY_HALTED]`, stopping the
      reactive system for the REST OF THE MODULE — one call accounted for eight
      failures across three describes plus collateral in later files.
  The rest of that run's diagnostics are tests calling handler-style functions
  inside a `createRoot` where production calls them from event handlers.

  SOLID 1 API SURFACE: zero remaining uses of batch, produce, unwrap,
  createComputed, createRenderEffect(1-arg), createMutable, on(), indexArray,
  onMount, createDeferred, ErrorBoundary, createResource, createSelector,
  Suspense, mergeProps/splitProps or the `setStore(key, value)` path form.

  STILL OPEN, all inherited, none introduced here:
    - size-budget guard (2 failures). It measures the migration's prettier
      reflow, not code growth: across its 16 offenders line counts rose 1-24%
      while non-whitespace characters moved 0-3% (ja.ts +4 lines / +0 chars;
      terminal.tsx +13 lines / -6 chars). Splitting the files is the wrong
      remedy and the guard forbids re-baselining by design — needs the repo
      owner to recalibrate the metric.
    - 3 vitest failures in workgraph-content. Traced to the create-stream
      dialog's project picker: after clicking a project option the picker still
      shows "Select a project", so `localDirectory` never sets and the
      base-revision chip correctly stays hidden. The sibling picker test passes
      only because it seeds the directory through `executionContext`. Suspected
      upstream: `@kobalte/core@2.0.0-alpha.0`, which is also the source of every
      remaining `[STRICT_READ_UNTRACKED]` warning and is pinned by the lockfile.
      Worth confirming against a real browser before filing.
    - vitest's reporter dies with `RangeError: Maximum call stack size exceeded`
      in worker IPC on the full run, from the volume of Kobalte warnings plus
      testing-library's full accessible-roles dump on failure. Our own share of
      those warnings is now zero (WorkGraphContent 86 -> 0).
