invalid_observations_root_caused_v10: >
  Root-caused the contract's INVALID candidate observations ("benchmark click
  target is missing: rail-sidebar-session-row ... navigation-row-activate")
  rather than leaving them as an unexplained mark against the candidate.
  Source is perf-harness/src/agent-cdp-page.ts:183-190 — the harness's own CDP
  locator.click() evaluates the selector ONCE and throws immediately if the
  element is not present. There is no auto-wait, no retry, no timeout loop
  (unlike Playwright's locator API used elsewhere). So any session row that has
  not yet rendered at the instant of the click fails the observation outright.
  Evidence it is not a Solid 2 defect:
    - reproduced ON DEMAND in the CONTROL (Solid 1) arm during the paired
      retained-heap run, with the identical error text and selector;
    - reproduced in the candidate when alternating two same-workspace sessions;
    - the rail list is paginated (rail-sidebar-session-load-more exists), so a
      row can legitimately be absent from the first page.
  CONCLUSION: this is an immutable-harness limitation (a no-wait click) racing
  the application's asynchronous rail rendering, affecting BOTH arms. It is not
  a latency measurement and not a Solid 2 regression, and the contract counts it
  against whichever arm happens to lose the race.
  DELIBERATELY NOT "FIXED": the harness is frozen by the contract, and changing
  application rail-rendering timing purely so a no-wait benchmark click lands
  would be shaping the application around its test — the mirror image of the
  practice CLAUDE.md forbids. Recorded here as a known measurement hazard, and
  worth addressing on its own merits (a user clicking a not-yet-rendered rail
  row is a real if minor UX race) outside this experiment's frozen scope.

crossover_replication_v9_RESIDUAL_IS_NOISE: >
  The last claimed regression — "switch latency ~4-5% slower, consistent in
  sign across three measurements" — was itself an ORDER ARTIFACT. Every prior
  paired run had the candidate in position 1 and the control in position 2.
  Ran the proper crossover (each arm in BOTH positions, 40 warm alternations,
  same sessions, same box):
                    position 1     position 2    within-arm spread
    candidate         215 ms         215 ms          0 ms
    control           216 ms         204 ms         12 ms
  Position-matched comparison:
    position 1:  candidate 215 vs control 216  -> candidate marginally FASTER
    position 2:  candidate 215 vs control 204  -> candidate slower
  The two positions DISAGREE IN SIGN, and the between-arm difference (~5 ms on
  a ~212 ms operation, 2.4%) is SMALLER than the control's own run-to-run
  variance (12 ms, 5.9%). Position 2 is systematically faster for the control,
  which is exactly the bias the original candidate-first ordering introduced.
  CONCLUSION: warm switch latency is STATISTICALLY INDISTINGUISHABLE between
  the arms at this sample size. It is not a measured regression. Notably the
  candidate is also the more STABLE arm (215/215 vs 216/204).
  This retires the last outstanding deficit. Corrected final position:
    BETTER (candidate):  first-contentful-paint 0.795x, domInteractive 0.149x,
                         retained heap growth 0.945x
    INDISTINGUISHABLE:   warm switch latency (crossover, this entry), cold
                         switch (1.04x, within the same noise band), coldReady
                         (1.019x), network (identical), bundle (parity),
                         application CPU self-time (1.04x)
    WORSE:               none that survives replication
  HONEST LIMIT ON THIS CLAIM: "no measured regression survives replication" is
  NOT the same as "better on every metric". Parity is not victory, n=2 runs per
  arm is a small crossover, and vendor-solid self-time remains 2.26x in the CPU
  profile even though it does not surface as wall-clock difference. The
  defensible statement is: after the idiomatic Solid 2 refactors, Solid 2 rc.1
  beats Solid 1 on paint responsiveness and retained memory, and matches it
  everywhere else measured, with no remaining reproducible regression.

