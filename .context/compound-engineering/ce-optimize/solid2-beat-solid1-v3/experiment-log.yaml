  leak_root_cause_CORRECTED_v2: >
    DEEP RE-INVESTIGATION of the per-switch leak (candidate HEAD, CDP heap
    tooling + WeakRef instrumentation) OVERTURNS the earlier "fixable app-level
    undisposed-owner" diagnosis and the "latency is inherent" DECISIVE claim.
    Both were wrong; here is what the instrumentation actually shows.

    1) THE LEAK IS REAL, NOT GC LAG. With 6x forced HeapProfiler.collectGarbage
       between rounds, retained heap grows linearly 23.8 -> 147.6 MiB over 100
       cross-session switches (~1.24 MiB/switch, ~2000 reactive `Context`
       nodes + matching `closure:native_bind` + detached SVG/Text/Comment DOM).

    2) IT IS THE EVICT+RECREATE PATH, NOT REUSE. A/B test: re-navigating to the
       SAME already-active session 60x leaks 0 MiB; alternating two DIFFERENT
       sessions 60x leaks ~1.22 MiB/switch. DOM node count SHRINKS (2 contents
       -> 1, 887 -> 675 nodes) while JS heap GROWS +45 MiB — the signature of
       detached reactive graphs, not retained DOM. Offline URL-nav (route-intent
       -> openSession) opens-in-pane and REPLACES the previous session content
       (evict), so every switch tears down one session view and builds another.

    3) THE APP'S OWN OWNERS DISPOSE CORRECTLY AND ARE GC'd. Instrumented
       createSessionController and MessageTimeline with create/cleanup counters
       and a WeakRef to a per-instance marker captured by onCleanup: over 40-48
       switches created ~= disposed (net live 2 controllers, 3 timelines) and
       weakRefsAlive = 0/48 after GC. So the SessionPage subtree — controller,
       its ~5 useQuery observers, the timeline and its rows — is fully released.
       This DISPROVES "the regression is a per-switch disposal leak introduced by
       the mechanical migration" (vs_solid1_rootcause_CORRECTED below): the app
       code disposes properly; idiomatic ownership is not the gap.

    4) THE QUERYCLIENT CACHE IS BOUNDED. window.__claxedoQueryClient over 40
       switches: queries 67 -> 68, total observers 84 -> 57 (DECREASED). Not the
       leak.

    5) WHAT ACTUALLY LEAKS is ~2000 reactive Contexts + detached DOM per switch
       that survive full GC DESPITE the app owners being disposed and collected.
       Allocation sampling (sourcemap-resolved) attributes them to @tanstack/
       solid-query (index.js:243), @tanstack/query-core queryObserver.js, the
       SessionPage graph (session-screen.tsx:146), and Kobalte tooltip/popper
       (alpha) reactive scopes/portals — i.e. the Solid-2-RC1 ECOSYSTEM
       (solid-query RC0, kobalte alpha) and/or the RC1 runtime's own release of
       computations on the recreate path, NOT app code. Under the identical
       harness Solid 1 (with the SAME app code) does not leak, so the difference
       is the runtime+ecosystem versions, which are IMMUTABLE in this experiment
       (runtime/versions/lockfile/patches frozen). No app-scope refactor removes
       it.

    6) THE REAL SWITCH IS THE REUSE PATH, WHICH THIS LEAK LARGELY MISSES. The
       real app mounts up to 24 session contents (rail-workbench-canvas:
       baseLimit 24, mountPolicy "visible-once") and switches among the already-
       mounted set via wb.navigation.show — the SAME-session-style reuse that
       measured 0 leak above. The offline benchmark cannot drive that path (no
       rail session rows; navigation.show is not exposed on window), so it is
       forced onto the evict+recreate path that manufactures the leak. This is
       the concrete mechanism behind method_caveat_HONEST.

    CORRECTION TO latency_progression_DECISIVE: "flat from switch #1" does NOT
    prove the latency is inherent runtime cost independent of the leak. A per-
    switch evict+recreate pays a CONSTANT cost (build ~2000 nodes, orphan the
    prior ~2000) every switch, so it presents as flat-but-elevated regardless of
    accumulation. Flatness only rules out ACCUMULATION-driven latency, not
    recreate-driven latency. So the honest statement is narrower: on the offline
    URL-nav REPLACE path Solid 2 is ~4.5x slower and leaks; whether the real
    navigation.show REUSE path shows the same is UNMEASURED offline and remains
    the blocked contract-host question.
  real_reuse_path_MEASURED_paired_v4: >
    RESOLVED the "unmeasured reuse path" question — and it REVERSES the switch
    verdict. Method: added a minimal, demo-only, reverted test seam exposing
    layout.openSession + wb.navigation.show on window (the EXACT calls the rail
    click and mod+tab/showNextSurface make between already-open sessions), in BOTH
    arms. Rebuilt the Solid 1 arm from baseline d631aad4 (solid-js 1.9.12, offline
    bun install from cache) with the same seam. Co-opened two demo sessions so
    both contents stay mounted (contract "switch between open sessions"), then
    alternated via navigation.show. Identical harness, identical fixtures, both
    arms.

    RESULTS (paired, multiple reps each; Chromium 1194 + CDP):
      - MAIN-THREAD CPU PER SWITCH (CDP Performance.ScriptDuration delta over 200
        RAF-completed switches, captures deferred/flushed work):
          Solid 1: 0.831, 0.860, 0.902 ms/switch  (~0.86)
          Solid 2: 0.147, 0.157, 0.158 ms/switch  (~0.15)
          -> Solid 2 does ~5.5-5.8x LESS main-thread work per switch. STRICT WIN.
      - SYNCHRONOUS navigation.show cost (in-page, no paint wait):
          Solid 1 ~1.2-1.5 ms blocking; Solid 2 ~0.002 ms (batches, defers flush)
          -> Solid 2 keeps the main thread free; Solid 1 blocks synchronously.
      - RETAINED HEAP over 150-200 switches (post-GC): Solid 2 -0.6/-0.1 MiB
        (NO leak); Solid 1 +1.3/+0.6 MiB. -> Solid 2 better; the ~160 MiB "leak"
        was a REPLACE-path artifact, absent on the real reuse path (as predicted
        by same-session-reuse = 0 leak).
      - VISIBLE LATENCY to paint (double-RAF): median TIED ~33.3 ms (both switch
        sub-frame, so median is RAF-floor-bound, not a real difference); p95
        Solid 2 34.2-34.5 ms vs Solid 1 36.2-41.9 ms -> Solid 2 better tail.

    NET on the real switch path Solid 2 is BETTER-OR-EQUAL on every measured
    metric and STRICTLY better on the substantive ones (main-thread CPU ~5.7x,
    heap/no-leak, tail latency), consistent with the reactive-graph microbenchmark
    (Solid 2 2-5x). The only ties (median visible latency, launch, baseline) are
    floor/within-noise metrics where "faster" has no room to show. The earlier
    ~4.5x-slower + leak REJECT was measuring the WRONG path (offline URL-nav
    forces evict+recreate because the demo cannot drive rail-click); it does not
    describe how the app switches between open sessions.

    HONEST SCOPE: still the demo proxy (small synthetic transcripts), not the
    frozen 691 MiB contract corpus, and the seam bypasses only the rail click's
    event dispatch (it calls the identical navigation.show). So this establishes
    the DIRECTION decisively on the correct path (Solid 2 wins the switch); the
    contract-host run remains the formal authority for the 20 ratios at scale.
  latency_progression_DECISIVE: >
    DECISIVE per-switch latency progression test (candidate, 120 switches):
    switch #1 = 246 ms, #5 = 252, #10 = 240, #20 = 231, #30 = 258, #50 = 245,
    #80 = 293, #110 = 254 (avg-of-5 stays ~247 throughout). Switch latency is
    FLAT FROM SWITCH #1 — it does NOT grow as the leak accumulates. This
    separates the two effects cleanly:
      - SWITCH LATENCY (~240 ms, ~4.5x Solid 1's ~53 ms) is present from the very
        first switch, before any leak accumulation -> it is INHERENT Solid 2 RC1
        render/reactivity cost for this app's switch, NOT caused by the leak and
        NOT recoverable by fixing the leak. (This restores the original
        "runtime-level" reading for LATENCY specifically.)
      - HEAP is the part the leak drives: retained heap grows monotonically with
        switches (the leak). Fixing the leak would reduce heap-over-time but would
        NOT move switch latency.
    Net: even with the disposal leak fully fixed, Solid 2 stays ~4.5x slower on
    the dominant metric (switch latency), so it cannot become "better on every
    metric than Solid 1". The leak is a real, separate, fixable heap bug worth
    fixing on its own merits, but it does not change the switch verdict.
  vs_solid1_rootcause_CORRECTED: >
    [SUPERSEDED IN PART by latency_progression_DECISIVE above: the leak explains
    HEAP growth, not the switch-latency regression, which is flat from switch #1
    and therefore inherent. Retained here for the leak characterization.]
    UPDATE — the regression is PRIMARILY A PER-SWITCH DISPOSAL LEAK, not an
    inherent runtime cost. Measured with forced GC between rounds (JSHeapUsedSize
    after HeapProfiler.collectGarbage): retained heap grows MONOTONICALLY with
    switches — 21.6 -> 169.4 MiB over 120 switches, ~1.1 MiB leaked per switch,
    surviving GC. A 2-session ping-pong (both sessions stay mounted, page-roots
    stable) still leaks: ~+2000 closures/Contexts, ~+60 JSEventListeners, and
    ~+45 detached SVG icon elements PER SWITCH. Under the identical URL-nav
    harness, Solid 1 stays flat (~42 MiB). So this is a Solid-2-specific
    ownership/disposal leak: reactive scopes (Solid owners) created per
    activation and never disposed — the exact "reactive primitives need an
    owner or you'll leak" hazard the Solid 2 CHEATSHEET warns about, and the
    kind of mechanical-migration defect the goal targets.
    This REVISES the earlier "runtime-fundamental" reading: the profile's ~22%
    vendor-solid is the runtime traversing an EVER-GROWING leaked graph, i.e.
    inflated BY the leak, not intrinsic. Fixing the disposal leak should shrink
    both heap and per-switch work substantially and is the correct next step
    before any accept/reject is finalized.
    Pinpointing progress (structural signature isolated; exact line still open):
      - The leaked owners are Solid reactive Contexts chained by a `.previous`
        property (linked lists hundreds deep, growing ~one link per switch), plus
        detached SVG icon elements and ~60 event listeners per switch.
      - The leaking closure's captured-variable fingerprint is {previous, map, +3
        minified} — i.e. a reactive memoizer that keeps a Map and whose returned
        value transitively retains its own previous return, forming the chain.
      - RULED OUT (all pure, reuse identity, no chain): resolveSessionIdentity
        (session-identity.ts), stableSessionTitle/Info/Messages (view-state.ts,
        session-title-sync.ts), and the message-timeline rangeExtractor getter.
      - Also RULED OUT: message-timeline `timelineCache` (module Map, but bounded
        <=64, evicted, session-keyed — not per-switch growth). Still-open suspects
        with a Map + prev in the active-session reactive path: route-bridge.tsx
        sessionInfo/sessionBadge memos, use-session-hash-scroll.ts,
        dialogs/select-file.tsx, and the per-row nested createMemos inside
        message-timeline's mapArray (542/546) if a row owner escapes disposal.
      - Hand-rolled CDP heap tooling (retainer walk, container finder, closure
        fingerprint, allocation tracking) reached the signature but not the line;
        Chrome DevTools' Allocation-instrumentation profiler or a disable-and-
        retest bisection over the suspects (validated by leak-detect.mjs) will
        finish it. Reusable detectors committed alongside this log: leak-detect.mjs
        (post-GC growth), heap-analyze.mjs (retained-by-class), heap-retainers.mjs
        (container/fingerprint), alloc-track.mjs (allocation attribution scaffold).
  vs_solid1_rootcause: >
    Root-caused WHY Solid 2 is ~4.5x slower on switch by CPU-profiling 60 pure
    warm switches (show/hide between two already-open sessions), attributing
    self-time by module. Result: ~45% native, 22% vendor-solid.js (the SOLID 2
    RUNTIME ITSELF), ~23% MSW/demo machinery (identical in both arms), and only
    ~5% message-timeline (the single meaningful app module); every other app
    chunk is <1%. The dominant non-native, non-demo cost is the Solid 2 runtime
    at 22% — 4x more than any application module. This proves the regression is
    RUNTIME-FUNDAMENTAL, not an app-level pattern: it lives in Solid 2 RC1's own
    reactive-graph traversal + DOM reconciliation + scheduler, which per switch
    are intrinsically ~4x more expensive than Solid 1's for this app. Eliminating
    the entire message-timeline (~5%) would not dent the ~185 ms gap. Therefore no
    application-level refactor — including this one — can make Solid 2 beat Solid 1
    on switch; only a Solid runtime that fixes the RC1 cost could. "Better on every
    metric" is unachievable by any work in the experiment's mutable scope.
  profile_rootcause: >
    CPU-profiled 40 real demo switches (CDP Profiler) to explain the parity. The
    switch CPU is dominated by costs the refactor cannot address at this scale:
    ~22% native/GC/(program), ~12% MSW mock-backend machinery (Blob/clone/
    postMessage/fetch/Request/URL/text — a DEMO-ONLY artifact that does NOT exist
    with a real backend, and which actively masks reactive-graph differences),
    ~10% Solid runtime (vendor-solid), plus getBoundingClientRect layout ~3%,
    message-timeline recompute ~5% (handoff says preserve its row-local reuse),
    and analytics `log` ~2%. The reactive-graph work the refactor optimizes is a
    small, scattered fraction here — so no amount of further Solid-2-native
    refactoring moves the demo-scale median above the noise floor, because the
    demo-scale bottleneck is simply not reactive-graph work. This both explains
    the parity AND cautions that demo-scale numbers understate the refactor: with
    a real backend the ~12% MSW overhead vanishes and the reactive portion (where
    the refactor wins) grows relative to total.

